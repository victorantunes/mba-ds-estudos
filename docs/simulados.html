uta em uma probabilidade entre 0 e 1.", "d": ["Calcula a média dos valores das folhas, para regressão.", "Define o número de árvores.", "Padroniza as variáveis de entrada."], "e": "Aula 08/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV307", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "Na validação cruzada com K blocos, em cada rodada:", "c": "Um bloco diferente é usado como teste e os demais como treino, até que todos tenham sido testados uma vez.", "d": ["Os mesmos dados são usados em treino e teste.", "Apenas o primeiro bloco é usado como teste.", "Os blocos são descartados após o treino."], "e": "Aula 08/09: 'em cada rodada, duas partes servem para treino e uma para teste, alternando'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV308", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "Em um boosting com erro de treino de 0,10; 0,05; 0,04; 0,037 e 0,033 nas rodadas sucessivas, observa-se que:", "c": "O erro cai rapidamente no início e depois estabiliza, indicando que o ganho de novas árvores diminui (e o early stopping poderia atuar).", "d": ["O erro aumenta a cada nova árvore.", "O erro permanece constante em 0,10.", "O erro sempre chega a zero na segunda rodada."], "e": "Aula 08/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV309", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "O StandardScaler, ao padronizar dados para uma rede neural:", "c": "Aprende a escala com os dados de treino e aplica a mesma transformação ao teste.", "d": ["Aprende a escala com os dados de teste.", "É ajustado separadamente em treino e teste.", "Altera o rótulo Y."], "e": "Aula 08/09: 'ele aprende a escala usando o X de treino e depois aplica a mesma transformação ao teste'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV310", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "Uma pequena diferença entre o desempenho no treino e no teste sugere que:", "c": "O modelo generaliza bem; uma diferença muito grande seria sinal de overfitting ou de problema.", "d": ["O modelo está sempre sobreajustado.", "O conjunto de teste deve ser descartado.", "O modelo precisa de mais camadas."], "e": "Treino e teste parecidos indicam boa generalização. Uma diferença grande sinalizaria overfitting ou problema nos dados.", "dx": {"O modelo está sempre sobreajustado.": "Pequena diferença é sinal oposto ao de sobreajuste.", "O conjunto de teste deve ser descartado.": "O teste é justamente o que valida o modelo; não se descarta.", "O modelo precisa de mais camadas.": "Nada indica falta de capacidade; seria sinal de underfitting com desempenho ruim nos dois."}}, {"id": "XTM300", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "Na análise de sentimento aplicada ao mundo real, antes de confiar no classificador é essencial:", "c": "Validar o resultado, comparando as predições com dados rotulados (por exemplo, o conjunto de teste).", "d": ["Aumentar o vocabulário até 100% de cobertura.", "Eliminar todos os dados negativos.", "Usar sempre o mesmo modelo para qualquer empresa."], "e": "Aula 28/07: 'como eu valido se o meu classificador está tendo o resultado que eu espero'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM301", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "Em um pipeline de análise de sentimento, a etapa de pré-processamento inclui:", "c": "Limpeza, tokenização, lematização/stemming e remoção de stopwords.", "d": ["Apenas a coleta dos dados.", "Somente a escolha do algoritmo de classificação.", "A criação do dashboard final."], "e": "Aula 28/07: 'limpeza, tokenização, lematização, stem, remoção de stop words'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM302", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "Por que não é possível criar um modelo de sentimento que funcione 'para sempre'?", "c": "Porque a linguagem e o contexto mudam, e é preciso revalidar o modelo continuamente.", "d": ["Porque modelos de sentimento só funcionam em inglês.", "Porque o pré-processamento é impossível em português.", "Porque a acurácia sempre cai a zero após um ano."], "e": "Linguagem, gírias e contexto mudam; é preciso revalidar o modelo continuamente.", "dx": {"Porque modelos de sentimento só funcionam em inglês.": "Há modelos de sentimento para português e outros idiomas.", "Porque o pré-processamento é impossível em português.": "O pré-processamento é possível em português (spaCy, NLTK).", "Porque a acurácia sempre cai a zero após um ano.": "A acurácia não cai a zero em um ano; ela se degrada gradualmente."}}, {"id": "XTM303", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "O LeIA (estendido), usado na aula, é:", "c": "Uma versão do VADER adaptada/estendida para o português, baseada em léxico.", "d": ["Um modelo Transformer pré-treinado em português.", "Uma biblioteca de tokenização do spaCy.", "Um algoritmo de clustering de textos."], "e": "Aula 28/07: 'o LeIA estendido, que é uma versão do VADER para o português'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM304", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "Sobre os léxicos (dicionários) usados na análise de sentimento, é correto afirmar que:", "c": "Nenhum léxico é completo: nem todas as palavras e expressões estão no dicionário.", "d": ["Um bom léxico cobre 100% das palavras de qualquer idioma.", "Léxicos aprendem sozinhos com os dados rotulados.", "Léxicos dispensam pré-processamento."], "e": "Aula 28/07: 'nenhum léxico, nenhum dicionário que a gente vai utilizar tem todas as palavras'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM305", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "O spaCy, nos exemplos da aula, é utilizado principalmente para:", "c": "Pré-processamento (tokenização e lematização); ele não traz um classificador de sentimento pronto.", "d": ["Classificar o sentimento sem nenhum pré-processamento.", "Substituir o léxico LeIA.", "Gerar embeddings de imagens."], "e": "Aula 28/07: 'o spaCy não vem com classificador pronto, mas para o pré-processamento, tokenização, lematização...'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM306", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "No classificador Naive Bayes usado na aula, o modelo:", "c": "Calcula, para cada palavra, a probabilidade de aparecer em frases positivas e em negativas, e usa isso para classificar novas frases.", "d": ["Conta apenas o número de palavras de cada frase.", "Usa um dicionário fixo de sentimentos.", "Gera texto novo a partir do prompt."], "e": "Aula 28/07: 'calcula cada palavra, probabilidade dessa palavra aparecer numa frase positiva, numa frase negativa'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM307", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "A função de classificação com transformers usada na aula retorna:", "c": "A predição (rótulo) e a probabilidade associada.", "d": ["Apenas o rótulo, sem probabilidade.", "Apenas a lista de tokens.", "O vocabulário completo do modelo."], "e": "Aula 28/07: 'ela vai me devolver duas informações, a predição e a probabilidade'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM308", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "Sobre o uso de LLMs para classificar sentimento, é correto afirmar que:", "c": "Eles entendem contexto, negação e sarcasmo e podem explicar a classificação, mas isso tem custo.", "d": ["São sempre mais baratos que léxicos.", "Não entendem negação nem sarcasmo.", "Dispensam qualquer validação."], "e": "Aula 28/07: 'LLM entende contexto, negação, sarcasmo, explica o motivo... mas isso tem um custo, não é barato'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM309", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "Em uma análise baseada em aspectos (por exemplo, comida e serviço de um restaurante), o resultado esperado é:", "c": "Um sentimento (positivo, negativo ou neutro) para cada aspecto citado no texto.", "d": ["Um único sentimento para o texto inteiro.", "Apenas a contagem de palavras positivas.", "A tradução do texto para inglês."], "e": "Aula 28/07: 'para cada aspecto, as labels... positivo, negativo ou neutro da comida e do serviço'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XTM310", "a": "A5", "tp": "Text mining, sentimento e NLP", "src": "reconstruida", "s": "A frase 'Não gostei da cor do produto' foi classificada como positiva por um léxico manual simples. Esse resultado ilustra:", "c": "A limitação de abordagens que olham palavras isoladas e não tratam a negação.", "d": ["Que o léxico é sempre superior ao ML.", "Que frases negativas não existem em português.", "Que o spaCy classifica sentimento melhor que LLMs."], "e": "Aula 28/07. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO100", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Pesquisa Operacional (PO) é conhecida como:", "c": "A ciência da tomada de decisão, que transforma um problema real em um modelo e o resolve para obter uma solução boa e rápida.", "d": ["A ciência de escrever código para automatizar tarefas.", "Uma técnica estatística exclusiva para séries temporais.", "O estudo de bancos de dados relacionais."], "e": "Aula 11/08: 'PO, em inglês Operations Research, é a ciência da tomada de decisão'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO101", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Em 'programação matemática', a palavra programação refere-se a:", "c": "Transformar um problema real em um modelo matemático e resolvê-lo, e não a criar código de computador.", "d": ["Escrever programas em Python.", "Configurar servidores.", "Organizar o cronograma de um projeto."], "e": "Aula 11/08: 'não é a programação lá de criar código; é a programação no sentido de transformar um problema real num modelo matemático'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO102", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Os três componentes de um modelo matemático de otimização são:", "c": "Variáveis de decisão, função objetivo e restrições.", "d": ["Variáveis, constantes e gráficos.", "Entradas, saídas e relatórios.", "Hipótese nula, hipótese alternativa e p-valor."], "e": "Aula 11/08. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO103", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "As restrições de um modelo de otimização são:", "c": "As condições que limitam os valores que as variáveis de decisão podem assumir.", "d": ["A meta que se quer maximizar ou minimizar.", "O resultado final do modelo.", "As variáveis que o modelo escolhe."], "e": "Aula 11/08: 'o terceiro componente são as restrições, as condições que limitam as variáveis de decisão'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO104", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Em programação linear (PL):", "c": "As equações têm formato linear aditivo (constante multiplicada por variável) e as variáveis de decisão são contínuas.", "d": ["É permitido multiplicar duas variáveis de decisão entre si.", "As variáveis devem ser sempre inteiras.", "A função objetivo pode conter termos quadráticos."], "e": "Em PL as funções são lineares (soma de constante × variável) e as variáveis são contínuas.", "dx": {"É permitido multiplicar duas variáveis de decisão entre si.": "Multiplicar variáveis torna o modelo não linear.", "As variáveis devem ser sempre inteiras.": "Variáveis inteiras caracterizam programação inteira.", "A função objetivo pode conter termos quadráticos.": "Termos quadráticos tornam o modelo não linear."}}, {"id": "XPO105", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Qual das expressões abaixo NÃO é linear?", "c": "3·x₁·x₂", "d": ["10·x₁ + 3·x₂ + 2·x₃", "0,3·x + 0,5·y", "5·x₁ − 2·x₂"], "e": "Aula 11/08: multiplicar duas variáveis de decisão (3·x₁·x₂) é um formato não linear. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO106", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Se as variáveis de decisão precisarem ser inteiras (por exemplo, 3 em vez de 1,5), o modelo:", "c": "Deixa de ser de programação linear contínua e passa a ser um outro tipo de modelo (inteiro).", "d": ["Continua sendo programação linear contínua.", "Torna-se um modelo de séries temporais.", "Não pode ser resolvido por nenhum método."], "e": "Aula 11/08. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO107", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Maximizar uma função objetivo equivale a:", "c": "Minimizar a função com o sinal trocado (maximizar f é o mesmo que minimizar −f).", "d": ["Minimizar a função original.", "Zerar todas as variáveis.", "Dobrar as restrições."], "e": "Aula 11/08: 'maximizar uma função objetivo positiva é a mesma coisa que minimizar uma função negativa'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO108", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "No exemplo da aula, 'maximizar Z = 0,3x + 0,5y', em que x e y são metros de fita cortados nas máquinas antiga e moderna, representa:", "c": "A função objetivo, que quantifica a meta do problema.", "d": ["Uma restrição de capacidade.", "Uma variável de decisão.", "O resultado final do modelo."], "e": "Aula 11/08. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO109", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "Ao modelar um problema, a ordem recomendada na aula é:", "c": "Descrever em palavras as variáveis, a função objetivo e as restrições e só depois escrever as equações.", "d": ["Escrever as equações antes de entender o problema.", "Resolver o modelo antes de definir as variáveis.", "Definir as restrições e ignorar a meta."], "e": "Aula 11/08: 'identificar em palavras, ainda não estou usando letras e números'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XPO110", "a": "A5", "tp": "Pesquisa operacional e otimização", "src": "reconstruida", "s": "O resultado de um modelo de otimização é:", "c": "Um conjunto de valores, cada um referente a uma variável de decisão.", "d": ["Um único número sem relação com as variáveis.", "Uma tabela de frequências.", "Um gráfico de dispersão."], "e": "Aula 11/08: 'vou ter um conjunto de valores e cada valor é referente a uma variável'. (Questão elaborada a partir das legendas das aulas.)"}], "p1": [["O046", "E09", "O039", "E15", "O029", "O030", "XARV305", "O004", "XTM307", "XPO103"], ["E05", "O047", "O041", "E12", "E18", "O036", "O012", "XDL305", "XTM302", "XPO106"], ["O048", "E00", "O045", "E11", "O026", "O031", "O000", "O009", "XTM306", "XPO102"], ["E08", "E06", "O042", "E13", "E22", "O038", "O022", "O019", "XTM310", "XPO107"], ["E02", "E07", "O043", "E14", "O028", "E21", "XARV303", "O005", "XTM300", "XPO100"], ["E03", "E04", "O040", "E16", "O034", "O027", "O011", "XDL204", "XTM305", "XPO109"]], "p2": [{"titulo": "A tecnologia mudou em uma semana; as pessoas, não", "texto": "Uma seguradora implantou uma plataforma de inteligência artificial para análise de sinistros. Em sete dias o sistema estava instalado e treinado. Três meses depois, porém, os analistas continuavam refazendo à mão as análises que a máquina entregava prontas. A diretoria atribuiu o problema à falta de treinamento e contratou novos cursos de ferramenta. Uma consultora observou outra coisa: o que os analistas diziam era 'se a máquina faz o que eu fazia, o que sobra de mim?'. Para ela, a empresa administrava uma mudança tecnológica, que é um evento externo e planejável, enquanto as pessoas atravessavam uma transição, um processo interno, ligado à identidade profissional e a algo que percebem estar perdendo. Ela lembrou que, segundo levantamentos recentes, 88% das empresas já usam IA em ao menos uma área, mas apenas 37% relatam impacto real no lucro, sinal de que a produtividade individual não se converte sozinha em retorno em escala. Recomendou criar espaços de experimentação, nomear as perdas, reconhecer pequenas vitórias e redefinir o papel do analista, em vez de apenas ensinar a ferramenta.", "qs": [{"id": "T00", "a": "P2", "tp": "Transformação digital", "src": "original", "s": "Segundo o texto, por que a adoção da plataforma não foi automática, mesmo com a tecnologia instalada?", "c": "Porque a mudança tecnológica é um evento externo, mas a adoção depende de uma transição interna, ligada à identidade e à perda percebida pelas pessoas.", "d": ["Porque a plataforma era tecnicamente inferior ao trabalho manual.", "Porque faltou orçamento para novos cursos de ferramenta.", "Porque os analistas não tinham interesse em tecnologia."], "e": "A mudança tecnológica é um evento externo, mas a adoção depende de uma transição interna (identidade, perda percebida).", "dx": {"Porque a plataforma era tecnicamente inferior ao trabalho manual.": "O texto não diz que a plataforma era inferior.", "Porque faltou orçamento para novos cursos de ferramenta.": "O texto não aponta falta de orçamento como causa.", "Porque os analistas não tinham interesse em tecnologia.": "O texto não atribui desinteresse; fala de perda percebida."}}, {"id": "T01", "a": "P2", "tp": "Transformação digital", "src": "original", "s": "A reação dos analistas ('o que sobra de mim?') é, no texto, interpretada como:", "c": "Resistência à perda percebida, e não oposição à tecnologia em si.", "d": ["Prova de incompetência técnica da equipe.", "Falta de comunicação da diretoria sobre o preço da plataforma.", "Indício de que a plataforma deveria ser desativada."], "e": "A frase 'o que sobra de mim?' revela medo de perder identidade e valor, não rejeição técnica.", "dx": {"Prova de incompetência técnica da equipe.": "O texto não trata como incompetência.", "Falta de comunicação da diretoria sobre o preço da plataforma.": "O texto não menciona preço da plataforma.", "Indício de que a plataforma deveria ser desativada.": "O texto não sugere desativar; propõe conduzir a transição."}}, {"id": "T02", "a": "P2", "tp": "Transformação digital", "src": "original", "s": "Os números '88%' e '37%' são usados no texto para indicar que:", "c": "O uso difundido da IA não garante, por si só, impacto financeiro em escala.", "d": ["A IA reduz o lucro da maioria das empresas.", "Apenas 37% das empresas conseguem instalar a IA.", "A produtividade individual sempre vira retorno financeiro."], "e": "Os números mostram uso amplo de IA (88%) com poucos resultados financeiros em escala (37%).", "dx": {"A IA reduz o lucro da maioria das empresas.": "O texto não diz que a IA reduz o lucro.", "Apenas 37% das empresas conseguem instalar a IA.": "37% não é taxa de instalação, mas de retorno em escala.", "A produtividade individual sempre vira retorno financeiro.": "O texto diz o contrário: produtividade individual não vira retorno automaticamente."}}, {"id": "T03", "a": "P2", "tp": "Transformação digital", "src": "original", "s": "Qual das medidas recomendadas pela consultora está coerente com a ideia de 'preparar para a transição'?", "c": "Criar espaços de experimentação e redefinir o papel do analista.", "d": ["Ampliar apenas o número de cursos sobre a ferramenta.", "Substituir os analistas resistentes por novos contratados.", "Proibir o retrabalho manual sem discutir o motivo."], "e": "Preparar a transição passa por experimentar, redefinir papéis e lidar com a perda percebida.", "dx": {"Ampliar apenas o número de cursos sobre a ferramenta.": "Só mais cursos trata a ferramenta, não a transição.", "Substituir os analistas resistentes por novos contratados.": "Substituir quem resiste ignora o fator humano.", "Proibir o retrabalho manual sem discutir o motivo.": "Proibir sem discutir o motivo aumenta a resistência."}}, {"id": "T04", "a": "P2", "tp": "Transformação digital", "src": "original", "s": "A fase em que 'o antigo já não funciona e o novo ainda não se consolidou', com incerteza e ambiguidade, é chamada, no modelo de Bridges, de:", "c": "Zona neutra.", "d": ["Ending (fim).", "Novo começo.", "Fase de estabilização."], "e": "No modelo de Bridges a zona neutra é a fase de incerteza entre o fim do antigo e o novo começo.", "dx": {"Ending (fim).": "'Ending' é a fase de soltar o antigo, antes da zona neutra.", "Novo começo.": "Novo começo é a fase em que o novo já se consolida.", "Fase de estabilização.": "'Estabilização' não é uma das fases do modelo."}}]}, {"titulo": "Planejar tudo ou aprender no caminho?", "texto": "Uma equipe de dados foi chamada para criar um produto de recomendação para um mercado em que a empresa nunca atuou. Havia pressão para entregar um cronograma completo de doze meses. O gerente de projetos, acostumado a obras e implantações de sistemas, montou um plano detalhado, com escopo fechado. Dois meses depois, os primeiros testes com usuários mostraram que quase nenhuma hipótese do plano se confirmava. Uma agilista sugeriu separar o trabalho em microproblemas: o que a equipe já sabia resolver (como a infraestrutura de dados) seguiria um plano tradicional; o que dependia de descobrir o que o cliente valoriza seria tratado por experimentos curtos, em sprints de até 30 dias, com um Product Owner priorizando o backlog. Ela lembrou que, em problemas assim, a resposta provavelmente está errada antes do primeiro experimento, e que a incerteza deve ser acomodada no escopo, mantendo prazo e custo sob controle. Para decidir se o projeto valia o risco, a equipe calculou a nota D.I.C.E. (duração, integridade, compromisso e esforço) e obteve 16 pontos.", "qs": [{"id": "T10", "a": "P2", "tp": "Metodologias ágeis", "src": "original", "s": "O problema de construir o produto de recomendação para um mercado novo é melhor classificado como:", "c": "Incognoscível ou conhecível: exige experimentação, pois a resposta não pode ser definida de antemão.", "d": ["Conhecido: bastava planejar e executar.", "Resolvido: já existia uma solução pronta no mercado.", "Um processo recorrente de rotina."], "e": "Um produto para mercado novo é problema incognoscível/conhecível: a solução só aparece por experimentação.", "dx": {"Conhecido: bastava planejar e executar.": "Problema conhecido tem solução definida de antemão.", "Resolvido: já existia uma solução pronta no mercado.": "Não havia solução pronta para esse mercado novo.", "Um processo recorrente de rotina.": "Não é rotina recorrente: é projeto de inovação."}}, {"id": "T11", "a": "P2", "tp": "Metodologias ágeis", "src": "original", "s": "No texto, onde a abordagem adaptativa sugerida acomoda a incerteza?", "c": "No escopo, mantendo prazo e custo sob controle.", "d": ["Em prazo e custo, mantendo o escopo fixo.", "Na documentação, que deve ser extensa.", "No número de reuniões de planejamento."], "e": "Na abordagem adaptativa, prazo e custo são fixos e o escopo se ajusta à incerteza.", "dx": {"Em prazo e custo, mantendo o escopo fixo.": "Inverte: fixar escopo e flexibilizar prazo/custo é o modelo preditivo.", "Na documentação, que deve ser extensa.": "Documentação extensa não é onde se acomoda incerteza.", "No número de reuniões de planejamento.": "Mais reuniões de planejamento não acomodam incerteza."}}, {"id": "T12", "a": "P2", "tp": "Metodologias ágeis", "src": "original", "s": "Qual é o papel do Product Owner mencionado no texto?", "c": "Representar clientes e usuários e priorizar o Product Backlog para maximizar o valor.", "d": ["Remover impedimentos e proteger o time de interrupções.", "Escrever todo o código do produto.", "Aprovar o cronograma de doze meses."], "e": "O Product Owner representa clientes e usuários e prioriza o backlog para maximizar valor.", "dx": {"Remover impedimentos e proteger o time de interrupções.": "Remover impedimentos é do Scrum Master.", "Escrever todo o código do produto.": "O código é escrito pelos desenvolvedores.", "Aprovar o cronograma de doze meses.": "O PO prioriza o backlog, não aprova um cronograma fixo de 12 meses."}}, {"id": "T13", "a": "P2", "tp": "Metodologias ágeis", "src": "original", "s": "A nota D.I.C.E. de 16 pontos situa o projeto na zona:", "c": "WORRY (15 a 17): preocupante.", "d": ["WIN (7 a 14): altas chances de sucesso.", "WOE (18 a 28): alto risco.", "Fora da escala, pois a nota máxima é 10."], "e": "D.I.C.E.: 7–14 WIN, 15–17 WORRY, 18–28 WOE. A nota 16 cai em WORRY.", "dx": {"WIN (7 a 14): altas chances de sucesso.": "WIN é de 7 a 14.", "WOE (18 a 28): alto risco.": "WOE é de 18 a 28.", "Fora da escala, pois a nota máxima é 10.": "A escala vai de 7 a 28, não até 10."}}, {"id": "T14", "a": "P2", "tp": "Metodologias ágeis", "src": "original", "s": "Qual das medidas está alinhada com o princípio 'priorize o problema, não o projeto'?", "c": "Dividir o trabalho em microproblemas e escolher a abordagem conforme a natureza de cada um.", "d": ["Manter o plano de doze meses até o fim, para evitar mudanças.", "Aplicar a mesma metodologia a todas as atividades.", "Cancelar todos os experimentos para cumprir o escopo."], "e": "Priorizar o problema significa decompor em microproblemas e escolher a abordagem conforme a natureza de cada um.", "dx": {"Manter o plano de doze meses até o fim, para evitar mudanças.": "Manter o plano rígido prioriza o projeto, não o problema.", "Aplicar a mesma metodologia a todas as atividades.": "Uma mesma metodologia para tudo ignora a natureza dos problemas.", "Cancelar todos os experimentos para cumprir o escopo.": "Cancelar experimentos ignora a incerteza."}}]}, {"titulo": "Os dados dos clientes e a lei", "texto": "Uma rede varejista coletava, no cadastro do programa de fidelidade, nome, CPF, endereço, data de nascimento e, 'para personalizar ofertas', a religião do cliente. A área de marketing contratou uma agência para enviar promoções e compartilhou com ela a base completa. Meses depois, a empresa decidiu usar as compras para criar um perfil de crédito dos clientes, sem avisá-los. Um cliente pediu cópia de seus dados e a exclusão do cadastro. A advogada da empresa explicou que o tratamento de dados pessoais exige finalidade clara, necessidade, transparência e uma base legal, que nem sempre é o consentimento, e que existem agentes com papéis distintos: o controlador, que decide sobre o tratamento, e o operador, que trata em nome dele. Alertou, ainda, que a ANPD pode aplicar sanções, entre elas multa de até 2% do faturamento, limitada a R$ 50 milhões por infração.", "qs": [{"id": "T20", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "original", "s": "Do ponto de vista da LGPD, qual dado coletado pela rede varejista é considerado dado pessoal sensível?", "c": "A religião do cliente.", "d": ["O CPF.", "O endereço.", "A data de nascimento."], "e": "Religião é dado pessoal sensível (art. 5º da LGPD).", "dx": {"O CPF.": "CPF é dado pessoal comum.", "O endereço.": "Endereço é dado pessoal comum.", "A data de nascimento.": "Data de nascimento é dado pessoal comum."}}, {"id": "T21", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "original", "s": "A coleta da religião 'para personalizar ofertas' viola, principalmente, qual princípio?", "c": "Necessidade, pois o dado não é indispensável à finalidade.", "d": ["Livre acesso, pois o cliente não pode consultar os dados.", "Qualidade dos dados, pois a religião muda com o tempo.", "Responsabilização, pois a agência é terceirizada."], "e": "Coletar religião sem ser indispensável à finalidade viola o princípio da necessidade (minimização).", "dx": {"Livre acesso, pois o cliente não pode consultar os dados.": "Livre acesso é o direito de consultar os dados, não é o foco.", "Qualidade dos dados, pois a religião muda com o tempo.": "Qualidade dos dados trata de exatidão, não é o foco.", "Responsabilização, pois a agência é terceirizada.": "Responsabilização não depende de a agência ser terceirizada."}}, {"id": "T22", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "original", "s": "Usar as compras para criar um perfil de crédito sem avisar os clientes fere, principalmente:", "c": "Os princípios da finalidade e da transparência.", "d": ["O Marco Civil da Internet, que exige guarda de registros por 5 anos.", "A neutralidade da rede.", "Nenhum princípio, pois os dados já estão na empresa."], "e": "Usar dados para perfil de crédito sem avisar fere finalidade (uso para propósito diferente) e transparência.", "dx": {"O Marco Civil da Internet, que exige guarda de registros por 5 anos.": "O Marco Civil trata de registros de acesso, não é o caso.", "A neutralidade da rede.": "Neutralidade da rede é outro tema.", "Nenhum princípio, pois os dados já estão na empresa.": "Ter o dado na empresa não autoriza qualquer uso."}}, {"id": "T23", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "original", "s": "Na relação entre a rede varejista e a agência de marketing, quem trata os dados em nome do outro?", "c": "A agência é operadora; a rede varejista é a controladora.", "d": ["A agência é a controladora; a rede é a operadora.", "Ambas são titulares.", "A ANPD é a controladora."], "e": "O controlador decide sobre o tratamento (a rede); o operador trata em nome dele (a agência).", "dx": {"A agência é a controladora; a rede é a operadora.": "Inverte os papéis.", "Ambas são titulares.": "Titulares são as pessoas a quem os dados se referem.", "A ANPD é a controladora.": "A ANPD é a autoridade fiscalizadora, não controladora."}}, {"id": "T24", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "original", "s": "Sobre as sanções citadas pela advogada, é correto afirmar que a multa simples:", "c": "É de até 2% do faturamento, limitada a R$ 50 milhões por infração.", "d": ["É sempre de 10% do faturamento, sem limite.", "Aplica-se apenas a empresas estrangeiras.", "Substitui qualquer outra sanção, como advertência."], "e": "A multa simples é de até 2% do faturamento, limitada a R$ 50 milhões por infração.", "dx": {"É sempre de 10% do faturamento, sem limite.": "A multa não é sempre 10% e tem limite.", "Aplica-se apenas a empresas estrangeiras.": "Aplica-se a quem trata dados, nacionais ou estrangeiros.", "Substitui qualquer outra sanção, como advertência.": "Pode ser cumulada com outras sanções (advertência, etc.)."}}]}, {"titulo": "Um painel bonito que ninguém entende", "texto": "Uma indústria criou um painel com dezoito gráficos: pizzas com doze fatias, três versões do mesmo indicador e cores sem padrão. A diretoria reclamou que 'os números mudam de acordo com quem apresenta'. A equipe de TI explicou que cada área extraía os dados de planilhas próprias, sem regras comuns, e que alguns gestores usavam ferramentas não aprovadas, o que a TI classificou como shadow IT. A nova coordenadora propôs começar pelo objetivo: definir as métricas a partir das decisões que a diretoria precisa tomar, organizar o fluxo de extração, transformação e carga (ETL) para um repositório único e estabelecer regras de governança de dados, definindo quem gerencia a informação, como e com qual tecnologia. Com essa base, o modelo self-service permitiria que as áreas criassem as próprias análises, e o painel mostraria, por exemplo, a evolução das vendas por mês em gráfico de linhas e a participação de cada região em uma rosca com poucas fatias.", "qs": [{"id": "T30", "a": "P2", "tp": "Business Intelligence", "src": "original", "s": "Qual das alternativas descreve corretamente o ETL citado no texto?", "c": "Extrair os dados das fontes, transformá-los (limpeza e padronização) e carregá-los em um repositório único.", "d": ["Enviar relatórios por e-mail, validá-los e arquivá-los.", "Escolher o tipo de gráfico, aplicar a identidade visual e publicar.", "Criptografar, armazenar e destruir os dados."], "e": "ETL = Extract, Transform, Load: extrair, transformar (limpar/padronizar) e carregar em repositório único.", "dx": {"Enviar relatórios por e-mail, validá-los e arquivá-los.": "Enviar relatórios por e-mail não é ETL.", "Escolher o tipo de gráfico, aplicar a identidade visual e publicar.": "Escolher gráfico e publicar é visualização.", "Criptografar, armazenar e destruir os dados.": "Criptografar e destruir não é ETL."}}, {"id": "T31", "a": "P2", "tp": "Business Intelligence", "src": "original", "s": "O que é shadow IT, segundo o texto?", "c": "O uso de ferramentas ou sistemas sem conhecimento ou aprovação da área de TI.", "d": ["Um ataque hacker externo ao banco de dados.", "Um software licenciado e homologado pela TI.", "Um modelo de painel com fundo escuro."], "e": "Shadow IT é o uso de ferramentas sem conhecimento ou aprovação da área de TI.", "dx": {"Um ataque hacker externo ao banco de dados.": "Ataque externo é incidente de segurança.", "Um software licenciado e homologado pela TI.": "Software homologado é o oposto.", "Um modelo de painel com fundo escuro.": "Nada a ver com painel de fundo escuro."}}, {"id": "T32", "a": "P2", "tp": "Business Intelligence", "src": "original", "s": "Para mostrar a evolução das vendas ao longo dos meses, o tipo de gráfico mais adequado é:", "c": "Gráfico de linhas.", "d": ["Pizza com muitas fatias.", "Tabela sem formatação.", "Mapa de calor sem eixos."], "e": "Evolução ao longo do tempo é bem representada por gráfico de linhas.", "dx": {"Pizza com muitas fatias.": "Pizza com muitas fatias dificulta leitura e não mostra tempo.", "Tabela sem formatação.": "Tabela sem formatação não destaca tendência.", "Mapa de calor sem eixos.": "Mapa de calor sem eixos não permite leitura."}}, {"id": "T33", "a": "P2", "tp": "Business Intelligence", "src": "original", "s": "A principal razão para 'os números mudarem de acordo com quem apresenta' é:", "c": "A ausência de governança e de uma fonte única de dados, com regras comuns de extração.", "d": ["O excesso de gráficos de linha.", "O uso do Power BI em vez do Excel.", "A falta de cores no painel."], "e": "Números diferentes por apresentador indicam falta de governança e fonte única de dados.", "dx": {"O excesso de gráficos de linha.": "Gráfico de linha não muda os números.", "O uso do Power BI em vez do Excel.": "A ferramenta não é a causa.", "A falta de cores no painel.": "Cores não alteram os valores."}}, {"id": "T34", "a": "P2", "tp": "Business Intelligence", "src": "original", "s": "O modelo self-service citado só funciona bem quando:", "c": "Existe base estruturada e governada, com capacitação e cultura de dados.", "d": ["A TI deixa de participar do projeto.", "Cada área mantém sua própria planilha.", "Todos os usuários aprendem DAX."], "e": "Self-service funciona com base estruturada e governada, capacitação e cultura de dados.", "dx": {"A TI deixa de participar do projeto.": "A TI continua necessária (governança, base).", "Cada área mantém sua própria planilha.": "Planilhas isoladas por área geram inconsistência.", "Todos os usuários aprendem DAX.": "Não é preciso que todos dominem DAX."}}]}, {"titulo": "Migrar para a nuvem sem perder o controle", "texto": "Uma varejista com picos de vendas na Black Friday decidiu abandonar seus servidores próprios e migrar para a nuvem. A conta mensal, no entanto, dobrou em três meses: ambientes de teste ficavam ligados à noite, discos soltos continuavam cobrados e ninguém sabia a qual área atribuir cada custo. Pouco depois, um bucket com dados de clientes foi exposto por erro de configuração, e a empresa descobriu que, no modelo de responsabilidade compartilhada, o provedor garante a segurança da nuvem (hardware e data centers), mas a empresa responde pela segurança na nuvem (dados, permissões e configurações). Em resposta, adotou o princípio do menor privilégio, autenticação em múltiplos fatores e práticas de FinOps, com etiquetas (tags) de custo, alertas de orçamento e desligamento agendado de ambientes de teste. Para a área de dados, a empresa também passou a versionar e monitorar seus modelos em produção, usando práticas de MLOps, porque a acurácia medida no treino não se mantinha com a mudança no comportamento dos clientes.", "qs": [{"id": "T40", "a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "src": "original", "s": "A dobra da conta mensal ilustra, principalmente, qual desafio da nuvem?", "c": "Custos fora de controle por falta de governança (FinOps), como recursos ociosos e sem alocação.", "d": ["A escassez de provedores no mercado.", "A impossibilidade de escalar rapidamente.", "O excesso de segurança do provedor."], "e": "A conta dobrar por recursos ociosos e sem alocação é desafio de custo/FinOps.", "dx": {"A escassez de provedores no mercado.": "Há muitos provedores.", "A impossibilidade de escalar rapidamente.": "A nuvem escala rapidamente (justamente a causa dos custos).", "O excesso de segurança do provedor.": "O problema foi custo, não excesso de segurança."}}, {"id": "T41", "a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "src": "original", "s": "Segundo o modelo de responsabilidade compartilhada, a exposição do bucket por erro de configuração é responsabilidade:", "c": "Do cliente, pois envolve segurança NA nuvem (dados, permissões, configurações).", "d": ["Do provedor, pois envolve segurança DA nuvem.", "Exclusiva do fabricante do hardware.", "Do governo, por meio da ANPD."], "e": "Exposição por erro de configuração é segurança NA nuvem, do cliente.", "dx": {"Do provedor, pois envolve segurança DA nuvem.": "Segurança DA nuvem (hardware, datacenter) é do provedor.", "Exclusiva do fabricante do hardware.": "O fabricante do hardware não configura o bucket.", "Do governo, por meio da ANPD.": "A ANPD fiscaliza, não configura."}}, {"id": "T42", "a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "src": "original", "s": "O princípio do menor privilégio, adotado pela empresa, significa:", "c": "Conceder a cada identidade apenas as permissões estritamente necessárias.", "d": ["Dar acesso total a todos os administradores.", "Usar uma única senha compartilhada.", "Eliminar a autenticação em múltiplos fatores."], "e": "Menor privilégio: cada identidade recebe apenas as permissões estritamente necessárias.", "dx": {"Dar acesso total a todos os administradores.": "Acesso total a todos é o oposto.", "Usar uma única senha compartilhada.": "Senha compartilhada é má prática.", "Eliminar a autenticação em múltiplos fatores.": "O MFA reforça segurança, não deve ser eliminado."}}, {"id": "T43", "a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "src": "original", "s": "A queda de desempenho do modelo em produção, por mudança no comportamento dos clientes, é um exemplo de:", "c": "Data drift.", "d": ["Cold start.", "Vendor lock-in.", "Overfitting do conjunto de teste."], "e": "Queda de desempenho por mudança do comportamento dos clientes é data drift.", "dx": {"Cold start.": "Cold start é latência inicial de funções serverless.", "Vendor lock-in.": "Vendor lock-in é dependência de fornecedor.", "Overfitting do conjunto de teste.": "Overfitting é ajuste excessivo ao treino, não mudança dos dados em produção."}}, {"id": "T44", "a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "src": "original", "s": "Qual das alternativas associa corretamente modelo de serviço e exemplo?", "c": "SaaS: software pronto para uso, como um sistema de e-mail corporativo.", "d": ["IaaS: software pronto, em que o cliente não gerencia nada.", "PaaS: máquinas virtuais em que o cliente gerencia o sistema operacional.", "SaaS: infraestrutura bruta alugada por hora."], "e": "SaaS é software pronto para uso (e-mail corporativo).", "dx": {"IaaS: software pronto, em que o cliente não gerencia nada.": "IaaS é infraestrutura, não software pronto.", "PaaS: máquinas virtuais em que o cliente gerencia o sistema operacional.": "No PaaS o cliente não gerencia o SO.", "SaaS: infraestrutura bruta alugada por hora.": "Infraestrutura bruta por hora é IaaS."}}]}, {"titulo": "Liderar quando a máquina também decide", "texto": "Em uma empresa de crédito, o comitê historicamente decidia com base na experiência dos especialistas. Com a adoção de um modelo estatístico, passou a ser comum que o algoritmo discordasse do especialista, e ninguém sabia quem deveria prevalecer. O novo diretor de dados afirmou que dados não eliminam o julgamento: apenas mudam o lugar onde ele acontece. Propôs uma regra em que decisões em que o algoritmo e o especialista divergem seriam discutidas em diálogo, e não em debate, isto é, sem a intenção de vencer, mas de construir entendimento compartilhado. Reconheceu que os problemas da empresa eram complexos: não seriam 'resolvidos' de uma vez, mas gerenciados por experimentação. Para sustentar a mudança, investiu em colaboração entre áreas e em líderes capazes de cultivar a empatia, entendida não como sentir o mesmo que o outro, mas como o esforço de compreender suas razões e emoções. Lembrou também que, enquanto tarefas rotineiras tendem a ser automatizadas, capacidades como reconhecer padrões, criar narrativas e lidar com as pessoas (high concept e high touch) ganham valor.", "qs": [{"id": "T50", "a": "P2", "tp": "Transformação digital e liderança", "src": "original", "s": "Quando o texto afirma que 'dados não eliminam o julgamento', quer dizer que:", "c": "O julgamento continua existindo, mas passa a acontecer em outro lugar do processo de decisão.", "d": ["Os dados são sempre irrelevantes para a decisão.", "O algoritmo deve sempre prevalecer sobre o especialista.", "O especialista deve sempre prevalecer sobre o algoritmo."], "e": "O julgamento humano não some; passa a acontecer em outro ponto do processo.", "dx": {"Os dados são sempre irrelevantes para a decisão.": "O texto não diz que dados são irrelevantes.", "O algoritmo deve sempre prevalecer sobre o especialista.": "Não defende que o algoritmo sempre prevaleça.", "O especialista deve sempre prevalecer sobre o algoritmo.": "Não defende que o especialista sempre prevaleça."}}, {"id": "T51", "a": "P2", "tp": "Transformação digital e liderança", "src": "original", "s": "A diferença entre diálogo e debate, no texto, é que o diálogo:", "c": "Busca construir significado compartilhado, sem necessidade de concordar ou vencer.", "d": ["Busca derrotar a opinião contrária.", "Elimina a divergência entre as pessoas.", "Exige votação com maioria absoluta."], "e": "No diálogo busca-se construir significado compartilhado, sem precisar concordar nem vencer.", "dx": {"Busca derrotar a opinião contrária.": "Derrotar a opinião contrária é o debate.", "Elimina a divergência entre as pessoas.": "O diálogo não elimina a divergência.", "Exige votação com maioria absoluta.": "Votação não é característica do diálogo."}}, {"id": "T52", "a": "P2", "tp": "Transformação digital e liderança", "src": "original", "s": "Em relação à empatia, o texto a define como:", "c": "Um comportamento de esforço para compreender razões, emoções e intenções do outro.", "d": ["Sentir exatamente o mesmo que o outro.", "Concordar sempre com o interlocutor.", "Uma característica inata que não pode ser desenvolvida."], "e": "Empatia é esforço para compreender razões, emoções e intenções do outro.", "dx": {"Sentir exatamente o mesmo que o outro.": "Sentir exatamente o mesmo é identificação, não empatia.", "Concordar sempre com o interlocutor.": "Empatia não é concordar sempre.", "Uma característica inata que não pode ser desenvolvida.": "Pode ser desenvolvida."}}, {"id": "T53", "a": "P2", "tp": "Transformação digital e liderança", "src": "original", "s": "Por que o diretor afirma que os problemas da empresa devem ser 'gerenciados' e não 'resolvidos'?", "c": "Porque são problemas complexos, interdependentes, que pedem experimentação e adaptação contínuas.", "d": ["Porque são problemas simples, com uma única resposta certa.", "Porque a empresa não tem recursos para resolvê-los.", "Porque o algoritmo já os resolveu."], "e": "Problemas complexos e interdependentes são geridos por experimentação e adaptação contínuas.", "dx": {"Porque são problemas simples, com uma única resposta certa.": "Problemas simples teriam resposta única.", "Porque a empresa não tem recursos para resolvê-los.": "O motivo não é falta de recursos.", "Porque o algoritmo já os resolveu.": "Algoritmo não os resolveu."}}, {"id": "T54", "a": "P2", "tp": "Transformação digital e liderança", "src": "original", "s": "A diferença entre cooperar e colaborar, no contexto do texto, é que colaborar implica:", "c": "Entender todo o processo e fazer junto, para que cada parte potencialize as demais.", "d": ["Cumprir a própria tarefa e permitir que os outros cumpram a deles.", "Delegar toda a decisão a um único líder.", "Evitar qualquer divergência entre as áreas."], "e": "Colaborar é entender o todo e fazer junto, potencializando as partes.", "dx": {"Cumprir a própria tarefa e permitir que os outros cumpram a deles.": "Cumprir a própria tarefa descreve cooperar.", "Delegar toda a decisão a um único líder.": "Delegar tudo a um líder não é colaborar.", "Evitar qualquer divergência entre as áreas.": "Colaborar não exige evitar divergência."}}]}, {"titulo": "Questões de gestão", "texto": "", "qs": [{"id": "XLGPD01", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "O dado pessoal sensível é:", "c": "Uma subcategoria de dado pessoal, para a qual a lei exige critérios mais rigorosos e proteção maior.", "d": ["Qualquer dado financeiro.", "Qualquer dado de uma empresa.", "Um dado que não identifica ninguém."], "e": "Aula 21/10. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XAG103", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Um business case reúne, entre outros elementos:", "c": "Benefícios e como medi-los, riscos, custos, prazo e entregas.", "d": ["Somente o cronograma de reuniões.", "Apenas a lista de participantes do projeto.", "O código-fonte do produto."], "e": "O business case reúne benefícios, riscos, custos, prazo e entregas.", "dx": {"Somente o cronograma de reuniões.": "Não é só cronograma de reuniões.", "Apenas a lista de participantes do projeto.": "Não é só lista de participantes.", "O código-fonte do produto.": "Não inclui código-fonte."}}, {"id": "XCL110", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Um erro comum de quem está começando em nuvem é:", "c": "Acreditar que uma máquina virtual nunca vai falhar.", "d": ["Usar mais de uma região.", "Monitorar custos.", "Usar réplicas de banco de dados."], "e": "Aula 19/08. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XLGPD06", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "O fato de um dado estar público significa que:", "c": "Ainda é preciso respeitar finalidade, adequação e necessidade; não se pode fazer o que se quiser com ele.", "d": ["Pode ser usado livremente para qualquer fim.", "Não está mais protegido pela LGPD.", "Pode ser vendido sem base legal."], "e": "Aula 21/10: 'não é o fato de estar público que eu posso fazer o que eu quiser'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XAG101", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Sobre mudança incremental e transformacional, é correto afirmar que:", "c": "A transformacional altera mais dimensões organizacionais e envolve mais risco que a incremental, e nenhuma é melhor que a outra em termos absolutos.", "d": ["A incremental é sempre mais arriscada.", "Só a transformacional gera mudança.", "Chamar uma mudança de transformacional é suficiente para torná-la transformacional."], "e": "A mudança transformacional envolve mais dimensões e risco; não há melhor absoluta.", "dx": {"A incremental é sempre mais arriscada.": "A incremental tende a ser menos arriscada.", "Só a transformacional gera mudança.": "Incremental também é mudança.", "Chamar uma mudança de transformacional é suficiente para torná-la transformacional.": "O rótulo não basta; é preciso alterar as dimensões."}}]}, {"titulo": "Questões de gestão", "texto": "", "qs": [{"id": "XCL109", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "FinOps é:", "c": "A prática de trazer responsabilidade financeira ao modelo de gastos variáveis da nuvem, com foco em gastar melhor.", "d": ["Um tipo de banco de dados em nuvem.", "Um protocolo de rede.", "Uma ferramenta de visualização de dados."], "e": "FinOps traz responsabilidade financeira ao gasto variável da nuvem.", "dx": {"Um tipo de banco de dados em nuvem.": "Não é banco de dados.", "Um protocolo de rede.": "Não é protocolo de rede.", "Uma ferramenta de visualização de dados.": "Não é ferramenta de visualização."}}, {"id": "XLGPD02", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "Dados financeiros, segundo a aula, são:", "c": "Tratados com rigor pela ANPD, mas não enquadrados como dados pessoais sensíveis pela lei.", "d": ["Sempre dados sensíveis.", "Excluídos de qualquer proteção.", "Dados públicos de livre uso."], "e": "Dados financeiros têm rigor da ANPD, mas não são sensíveis pela lei.", "dx": {"Sempre dados sensíveis.": "Não são sempre sensíveis.", "Excluídos de qualquer proteção.": "Têm proteção.", "Dados públicos de livre uso.": "Não são de uso livre."}}, {"id": "XAG100", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Um resultado que se repete continuamente na organização, sem data de término, é, em geral, obtido por meio de:", "c": "Um processo, e não de um projeto.", "d": ["Um projeto, pois todo resultado é um projeto.", "Uma mudança disruptiva.", "Um portfólio de startups."], "e": "Aula 22/07: 'se é um resultado recorrente, então não se dá por meio de um projeto, provavelmente por um processo'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XCL107", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Por que a análise de ROI de uma migração para a nuvem costuma ser ruim no início?", "c": "Porque, em geral, as aplicações são migradas do jeito que estão, sem otimização para o ambiente de nuvem.", "d": ["Porque a nuvem é sempre mais cara que o data center.", "Porque a nuvem não permite análise de dados.", "Porque o ROI não pode ser calculado."], "e": "Migrar 'do jeito que está' (lift-and-shift) sem otimizar mantém custos altos no início.", "dx": {"Porque a nuvem é sempre mais cara que o data center.": "Não é verdade que a nuvem seja sempre mais cara.", "Porque a nuvem não permite análise de dados.": "A nuvem permite análise de dados.", "Porque o ROI não pode ser calculado.": "O ROI pode ser calculado."}}, {"id": "XLGPD09", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "Uma empresa que atua apenas com outras empresas (B2B) afirma que 'não precisa de LGPD'. Essa afirmação está:", "c": "Incorreta, pois a empresa trata, no mínimo, dados de funcionários.", "d": ["Correta, pois a LGPD só vale para consumidores.", "Correta, pois B2B é isento.", "Correta, pois funcionários não são titulares."], "e": "Qualquer empresa trata dados de funcionários, então a LGPD se aplica.", "dx": {"Correta, pois a LGPD só vale para consumidores.": "A LGPD vale para qualquer titular, não só consumidores.", "Correta, pois B2B é isento.": "B2B não é isento.", "Correta, pois funcionários não são titulares.": "Funcionários são titulares."}}]}, {"titulo": "Questões de gestão", "texto": "", "qs": [{"id": "XAG104", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Os três tipos de problemas apresentados na aula são:", "c": "Conhecidos (olham o passado), conhecíveis (olham o presente) e incognoscíveis (olham o futuro).", "d": ["Simples, complexos e caóticos.", "Internos, externos e mistos.", "Lineares, não lineares e aleatórios."], "e": "Aula 22/07. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XCL102", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "No PaaS, de acordo com a aula, o cliente:", "c": "Se preocupa apenas com o código (e os dados), enquanto o provedor cuida de virtualização, sistema operacional, patches e plataforma.", "d": ["Gerencia o sistema operacional e a virtualização.", "Não precisa escrever código.", "É dono do data center."], "e": "No PaaS o cliente cuida do código e dados; o provedor cuida do resto da plataforma.", "dx": {"Gerencia o sistema operacional e a virtualização.": "SO e virtualização são do provedor no PaaS.", "Não precisa escrever código.": "O cliente escreve código.", "É dono do data center.": "O data center é do provedor."}}, {"id": "XLGPD04", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "O suboperador é:", "c": "Um terceiro contratado pelo operador, que atua sempre em nome do controlador e com a autorização dele.", "d": ["O titular dos dados.", "O encarregado (DPO).", "A própria ANPD."], "e": "Aula 21/10. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XAG105", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Segundo a aula, para escolher entre gestão preditiva e ágil, deve-se:", "c": "Identificar a natureza do problema (conhecido, conhecível ou incognoscível) e escolher a gestão mais adequada a ele.", "d": ["Usar sempre a gestão ágil, por ser mais moderna.", "Usar sempre a preditiva, por ser mais segura.", "Escolher conforme a preferência do gerente."], "e": "Aula 22/07. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XCL104", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Na nuvem pública tradicional, é correto afirmar que:", "c": "Máquinas virtuais de empresas diferentes podem rodar no mesmo host físico (modelo multi-tenant).", "d": ["Cada cliente tem um host físico exclusivo.", "Só uma empresa pode usar a nuvem por vez.", "Não existe virtualização."], "e": "Na nuvem pública, VMs de clientes diferentes dividem o host (multi-tenant).", "dx": {"Cada cliente tem um host físico exclusivo.": "Host exclusivo não é o modelo padrão.", "Só uma empresa pode usar a nuvem por vez.": "Várias empresas usam a nuvem ao mesmo tempo.", "Não existe virtualização.": "A virtualização é a base."}}]}, {"titulo": "Questões de gestão", "texto": "", "qs": [{"id": "XLGPD07", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "Para a ANPD, um incidente de segurança é:", "c": "Qualquer fato que prejudique a confidencialidade, a integridade ou a disponibilidade; se puder trazer grave dano ao titular, deve ser comunicado à autoridade.", "d": ["Apenas ataques hacker externos.", "Somente a perda de equipamentos.", "Qualquer reclamação de cliente."], "e": "Incidente é qualquer fato que afete confidencialidade, integridade ou disponibilidade (CID).", "dx": {"Apenas ataques hacker externos.": "Não são só ataques externos.", "Somente a perda de equipamentos.": "Não são só perdas de equipamento.", "Qualquer reclamação de cliente.": "Reclamação de cliente não é, por si, incidente."}}, {"id": "XAG106", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "A expressão 'priorizar o problema, não o projeto' significa:", "c": "Entender claramente qual problema o projeto resolve antes de escolher como conduzi-lo, evitando fazer 'da melhor maneira possível a coisa errada'.", "d": ["Cancelar todos os projetos em andamento.", "Ampliar o escopo sempre que possível.", "Ignorar os stakeholders."], "e": "Evita fazer muito bem a coisa errada: antes do projeto, entender o problema.", "dx": {"Cancelar todos os projetos em andamento.": "Não é cancelar projetos.", "Ampliar o escopo sempre que possível.": "Não é ampliar escopo.", "Ignorar os stakeholders.": "Stakeholders são essenciais."}}, {"id": "XCL101", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Em um serviço SaaS, como o Office 365 ou o Gmail:", "c": "Tudo é gerenciado pelo provedor da nuvem.", "d": ["O cliente gerencia o sistema operacional.", "O cliente gerencia a rede física.", "O cliente instala o hardware."], "e": "Aula 19/08: 'o SaaS é um exemplo clássico... em que tudo é gerenciado pelo provedor'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XLGPD03", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "A classificação entre controlador e operador:", "c": "É determinada em cada fluxo de dados da organização; a mesma empresa pode ser controladora em um fluxo e operadora em outro.", "d": ["É fixa e definida pelo porte da empresa.", "É definida apenas pelo CNPJ.", "Não existe na LGPD."], "e": "Controlador/operador é definido por fluxo: a mesma empresa pode ser um ou outro conforme o caso.", "dx": {"É fixa e definida pelo porte da empresa.": "Não depende do porte.", "É definida apenas pelo CNPJ.": "Não depende do CNPJ.", "Não existe na LGPD.": "A LGPD define os dois papéis."}}, {"id": "XAG102", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "O campo mais importante de um business case é:", "c": "O resultado do business case, que indica se vale ou não a pena fazer o projeto.", "d": ["O nome do gerente do projeto.", "A lista de ferramentas de software.", "O organograma da empresa."], "e": "Aula 22/07: 'o campo mais importante é o resultado do business case'. (Questão elaborada a partir das legendas das aulas.)"}]}, {"titulo": "Questões de gestão", "texto": "", "qs": [{"id": "XCL103", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "No IaaS, quem é responsável por rede, armazenamento e servidor físico?", "c": "O provedor de nuvem; a partir da criação da máquina virtual, passa a haver responsabilidade compartilhada.", "d": ["O cliente, integralmente.", "A empresa fabricante do sistema operacional.", "Ninguém."], "e": "Aula 19/08. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XLGPD05", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "O princípio da necessidade (minimização) exige:", "c": "Tratar apenas os dados estritamente necessários à finalidade.", "d": ["Coletar o máximo possível 'para o caso de precisar'.", "Guardar os dados indefinidamente.", "Compartilhar dados com qualquer parceiro."], "e": "Aula 21/10: a LGPD acabou com a lógica de 'coleta aí, vai que um dia eu preciso'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XAG109", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Na origem do ágil, Takeuchi e Nonaka compararam as empresas inovadoras a uma equipe de rugby porque:", "c": "O trabalho era feito de forma interligada, com o time avançando junto; daí vem o termo Scrum.", "d": ["O trabalho era feito em revezamento sequencial.", "Cada pessoa trabalhava isolada.", "O objetivo era reduzir custos a qualquer preço."], "e": "Rugby: o time avança junto, de forma interligada, origem do termo Scrum.", "dx": {"O trabalho era feito em revezamento sequencial.": "Revezamento sequencial é o modelo cascata.", "Cada pessoa trabalhava isolada.": "Trabalho isolado contraria a metáfora.", "O objetivo era reduzir custos a qualquer preço.": "O foco era inovação, não custo."}}, {"id": "XCL105", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Segundo o professor, a 'nuvem privada' criada por meio de uma VPC em um provedor público:", "c": "É uma rede privada isolada, mas não necessariamente um host exclusivo da empresa; para ele, nuvem privada de verdade teria rede e host dedicados.", "d": ["É idêntica a um data center próprio.", "Dispensa configuração de segurança.", "Não isola a rede da internet."], "e": "Aula 19/08. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XLGPD11", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "Entre as sanções, a publicização da infração é relevante porque:", "c": "O dano de reputação pode ser tão grave quanto a multa, podendo até aniquilar o negócio.", "d": ["Não tem efeito sobre a empresa.", "Substitui qualquer outra sanção.", "Só vale para pessoas físicas."], "e": "Dano de reputação pode ser tão grave quanto a multa.", "dx": {"Não tem efeito sobre a empresa.": "Tem efeito sobre a empresa.", "Substitui qualquer outra sanção.": "Não substitui outras sanções.", "Só vale para pessoas físicas.": "Vale para organizações."}}]}, {"titulo": "Questões de gestão", "texto": "", "qs": [{"id": "XAG108", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Em projetos de grande risco, de inovação disruptiva ou em mercados muito voláteis, a aula recomenda trabalhar com a lógica de:", "c": "Portfólio, e não com a lógica de business case.", "d": ["Business case detalhado com escopo fechado.", "Processos rotineiros.", "Planejamento de doze meses sem revisão."], "e": "Aula 22/07. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XCL108", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Sobre computação serverless (funções), é correto afirmar que:", "c": "Cobra-se pelo tempo de execução (milissegundos), mas há cold start, limite de tempo de execução e vendor lock-in.", "d": ["Cobra-se pelo mês inteiro de servidor ligado.", "Não tem limite de tempo de execução.", "É portável entre provedores sem reescrever o código."], "e": "Serverless cobra por execução, mas tem cold start, limite de tempo e lock-in.", "dx": {"Cobra-se pelo mês inteiro de servidor ligado.": "Não cobra pelo mês de servidor ligado.", "Não tem limite de tempo de execução.": "Há limite de tempo de execução.", "É portável entre provedores sem reescrever o código.": "Não é portável sem reescrever código."}}, {"id": "XLGPD08", "a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "src": "reconstruida", "s": "Uma empresa foi multada por vender sua base de dados sem base legal. O caso ilustra que:", "c": "Todo tratamento, inclusive a venda de bases, precisa de uma base legal.", "d": ["A venda de bases é livre.", "O consentimento sempre dispensa outras bases.", "Só órgãos públicos são multados."], "e": "Todo tratamento, inclusive venda de bases, precisa de base legal.", "dx": {"A venda de bases é livre.": "A venda não é livre.", "O consentimento sempre dispensa outras bases.": "Consentimento é uma base entre várias e não dispensa as demais regras.", "Só órgãos públicos são multados.": "Multas atingem organizações privadas também."}}, {"id": "XAG110", "a": "P2", "tp": "Metodologias ágeis", "src": "reconstruida", "s": "Os frameworks DICE, Cynefin e PMRL, citados na aula, servem para:", "c": "Definir, a partir da natureza do projeto, o estilo de gestão e de liderança do time.", "d": ["Calcular o ROI de uma migração para a nuvem.", "Escrever código em Python.", "Cadastrar usuários na plataforma."], "e": "Aula 22/07: 'aplicar frameworks como DICE, Cynefin e PMRL para definir o estilo de gestão do projeto e como liderar o time'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XCL106", "a": "P2", "tp": "TI e inovação tecnológica", "src": "reconstruida", "s": "Uma nuvem híbrida é caracterizada por:", "c": "Manter parte do ambiente no data center próprio e rodar apenas algumas partes na nuvem, quando isso faz sentido técnico e de custo.", "d": ["Usar apenas um provedor público.", "Eliminar totalmente o data center.", "Usar somente software livre."], "e": "Nuvem híbrida combina data center próprio com nuvem para o que fizer sentido.", "dx": {"Usar apenas um provedor público.": "Usar um provedor público apenas não é híbrido.", "Eliminar totalmente o data center.": "Eliminar o data center não é híbrido.", "Usar somente software livre.": "Software livre não define nuvem híbrida."}}]}], "cards": [{"a": "A4", "tp": "Bagging e Random Forest", "s": "original", "f": "Considere as afirmações sobre o bagging (Bootstrap Aggregating):\nI – Treina vários modelos do mesmo tipo, cada um em uma amostra bootstrap dos dados.\nII – Combina as previsões por votação (classificação) ou média (regressão).\nIII – Seu efeito principal é reduzir o viés de cada modelo individual.\nEstá correto o que se afirma em:", "b": "Apenas I e II.\n\nBagging treina modelos do mesmo tipo em amostras bootstrap (I) e agrega por votação ou média (II); seu efeito é reduzir a variância, não o viés (III é falsa).", "id": "C0000"}, {"a": "A4", "tp": "Bagging e Random Forest", "s": "original", "f": "Em uma amostra bootstrap (com reposição) de tamanho igual ao do conjunto original, aproximadamente que fração dos registros originais costuma ficar de fora (out-of-bag, OOB)?", "b": "Cerca de 37%.\n\nCada sorteio com reposição deixa um registro de fora com prob. (1 − 1/n); para n grande, (1 − 1/n)^n → e^−1 ≈ 0,368. Cerca de 37% fica fora (OOB) e ~63% entra.", "id": "C0001"}, {"a": "A4", "tp": "Bagging e Random Forest", "s": "original", "f": "Qual é a diferença central entre a Random Forest e o bagging tradicional de árvores?", "b": "Na Random Forest, em cada divisão só um subconjunto aleatório de variáveis é candidato ao split, o que descorrelaciona as árvores.\n\nA Random Forest sorteia, a cada split, um subconjunto de variáveis candidatas, descorrelacionando as árvores e reduzindo a variância da média.", "id": "C0002"}, {"a": "A4", "tp": "Bagging e Random Forest", "s": "original", "f": "Em uma Random Forest, qual hiperparâmetro define quantas variáveis são consideradas como candidatas em cada divisão de uma árvore?", "b": "max_features\n\nn_estimators é o nº de árvores; max_features controla a aleatoriedade das colunas por split.", "id": "C0003"}, {"a": "A4", "tp": "Boosting", "s": "original", "f": "No boosting, cada novo modelo da sequência:", "b": "É treinado para corrigir os erros (resíduos) dos modelos anteriores.\n\nBoosting é sequencial: cada modelo foca nos erros do anterior e a previsão final é a soma ponderada.", "id": "C0004"}, {"a": "A4", "tp": "Boosting", "s": "original", "f": "Sobre bagging e boosting, assinale a alternativa correta:", "b": "O bagging reduz principalmente a variância; o boosting reduz principalmente o viés.\n\nBagging faz média de modelos independentes, reduzindo variância; boosting corrige erros sequencialmente, reduzindo viés.", "id": "C0005"}, {"a": "A4", "tp": "Boosting", "s": "original", "f": "No XGBoost, os parâmetros reg_alpha e reg_lambda correspondem, respectivamente, às regularizações:", "b": "L1 e L2, que penalizam os pesos das folhas e controlam a complexidade do modelo.\n\nreg_alpha = L1 e reg_lambda = L2, penalizando os pesos das folhas e controlando a complexidade.", "id": "C0006"}, {"a": "A4", "tp": "Boosting", "s": "original", "f": "Em modelos de boosting, aumentar demais o learning rate tende a:", "b": "Tornar o treinamento instável, com risco de oscilar e de sobreajustar.\n\nLearning rate alto dá passos grandes: o modelo pode oscilar em torno do mínimo e se ajustar demais ao treino, ficando instável.", "id": "C0007"}, {"a": "A4", "tp": "Ensemble", "s": "original", "f": "No stacking, o meta-modelo (nível 1):", "b": "Aprende a combinar as previsões dos modelos-base (nível 0), usando-as como novas variáveis.\n\nNo stacking o meta-modelo é treinado com as previsões dos modelos-base como features.", "id": "C0008"}, {"a": "A4", "tp": "Ensemble", "s": "original", "f": "Três modelos estimam a probabilidade de inadimplência de um cliente: 0,9; 0,4 e 0,3. Considerando corte de 0,5, qual é o resultado no soft voting e no hard voting, respectivamente?", "b": "Inadimplente (média ≈ 0,53) e adimplente (apenas 1 de 3 modelos votou inadimplente).\n\nSoft voting faz a média das probabilidades: (0,9+0,4+0,3)/3 ≈ 0,53 > 0,5 → inadimplente. Hard voting conta votos: só 1 de 3 passa de 0,5 → adimplente.", "id": "C0009"}, {"a": "A4", "tp": "Árvores de decisão", "s": "original", "f": "Uma árvore de decisão muito profunda e sem poda tende a apresentar:", "b": "Baixo viés e alta variância (sobreajuste aos dados de treino).\n\nÁrvore profunda sem poda memoriza o treino: ajusta o ruído (baixo viés) e muda muito com pequenas alterações nos dados (alta variância) = sobreajuste.", "id": "C0010"}, {"a": "A4", "tp": "Árvores de decisão", "s": "original", "f": "Um banco deseja detectar fraudes, e deixar passar uma fraude é muito mais grave que um alarme falso. Qual métrica deve ser priorizada?", "b": "Recall (sensibilidade).\n\nSe perder uma fraude é pior que um falso alarme, interessa minimizar falsos negativos: maximizar o recall.", "id": "C0011"}, {"a": "A4", "tp": "Árvores de decisão", "s": "original", "f": "O F1-score é definido como:", "b": "A média harmônica entre precisão e recall.\n\nF1 = 2·(precisão·recall)/(precisão+recall) = média harmônica de precisão e recall.", "id": "C0012"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "Sobre o perceptron, assinale a alternativa correta:", "b": "Calcula ŷ = g(Σ xᵢ·wᵢ), em que w₀ é o bias e g é a função de ativação.\n\nSem ativação, o perceptron univariado é uma regressão linear (w₁ gira a reta; w₀ a desloca).", "id": "C0013"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "O problema XOR é historicamente importante porque mostrou que:", "b": "Um perceptron sem camada oculta e sem ativação não linear não resolve problemas que não são linearmente separáveis.\n\nO XOR não é linearmente separável; um perceptron simples (sem camada oculta/ativação não linear) não o resolve, o que motivou as redes multicamadas.", "id": "C0014"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "Por que as funções de ativação não lineares são indispensáveis em uma MLP?", "b": "Sem elas, a composição de várias camadas continua sendo uma função linear.\n\nA não linearidade é o que dá poder expressivo à rede.", "id": "C0015"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "Em redes profundas, a ReLU costuma ser preferida à sigmoid nas camadas ocultas porque:", "b": "Não satura para valores positivos, o que reduz o problema do gradiente que desaparece.\n\nA sigmoid satura nas pontas (gradiente ≈ 0); a ReLU é barata e não satura para z > 0.", "id": "C0016"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "A função softmax, aplicada na camada de saída, serve para:", "b": "Transformar os logits em probabilidades que somam 1, em classificação multiclasse.\n\nSoftmax converte os logits em probabilidades não negativas que somam 1: usada na saída de classificação multiclasse.", "id": "C0017"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "Em um problema multiclasse com rótulos inteiros (0, 1, 2…) e saída softmax, a função de perda adequada é:", "b": "Sparse Categorical Cross Entropy.\n\nCom rótulo em one-hot usa-se a Categorical CE; com rótulo inteiro, a Sparse CCE (mesmo valor de perda).", "id": "C0018"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "No gradient descent, W ← W − η·∇J(W). O que tende a ocorrer se o learning rate η for grande demais?", "b": "O treinamento pode oscilar ou divergir, ultrapassando o mínimo da loss.\n\nLearning rate pequeno demais é lento; grande demais é instável.", "id": "C0019"}, {"a": "A4", "tp": "Redes neurais", "s": "original", "f": "Durante o treino, a loss de treinamento cai continuamente, mas a loss de validação cai e depois volta a subir. Isso indica:", "b": "Overfitting; medidas como early stopping, dropout ou regularização ajudam.\n\nA rede começa a decorar o treino; restaura-se o modelo da melhor época de validação.", "id": "C0020"}, {"a": "A4", "tp": "Deep learning", "s": "original", "f": "Em uma convolução com entrada 5×5, kernel 3×3, padding 'valid' e stride 1, qual é o tamanho da saída?", "b": "3×3\n\nSem preenchimento: 5 − 3 + 1 = 3.", "id": "C0021"}, {"a": "A4", "tp": "Deep learning", "s": "original", "f": "Qual é a principal vantagem de uma CNN sobre uma rede densa (FCN) no processamento de imagens?", "b": "Aprende features locais e hierárquicas, preserva a estrutura espacial e tem invariância à translação.\n\nA CNN usa filtros que aprendem padrões locais (bordas → formas → objetos), preservam a estrutura espacial e são invariantes à translação.", "id": "C0022"}, {"a": "A4", "tp": "Deep learning", "s": "original", "f": "Sobre a self-attention dos Transformers, assinale a alternativa correta:", "b": "Cada token gera Query, Key e Value; os scores entre Query e Key, normalizados por softmax, ponderam os Values.\n\nNa self-attention cada token gera Q, K, V; os scores Q·K, passados por softmax, ponderam os Values.", "id": "C0023"}, {"a": "A4", "tp": "Deep learning", "s": "original", "f": "Comparando LSTM e Transformer, é correto afirmar que o Transformer:", "b": "Paraleliza o treino e conecta todos os pares de tokens, ao custo de complexidade quadrática em N.\n\nO Transformer treina em paralelo e usa atenção entre todos os pares de tokens, com custo quadrático em N (N²).", "id": "C0024"}, {"a": "A4", "tp": "Deep learning", "s": "original", "f": "Sobre word embeddings, assinale a alternativa correta:", "b": "São vetores densos e treináveis, em que palavras de uso parecido ficam próximas no espaço.\n\nO embedding clássico é fixo por palavra; a atenção é que traz o contexto.", "id": "C0025"}, {"a": "A3", "tp": "Contagem e inflacionados de zeros", "s": "original", "f": "No teste de Cameron e Trivedi para superdispersão, a regressão auxiliar é estimada sem intercepto e o coeficiente da variável é estatisticamente diferente de zero. Conclui-se que:", "b": "Há superdispersão: a variância é significativamente maior que a média, e o modelo binomial negativo é mais adequado.\n\nCoeficiente significante na regressão auxiliar de Cameron-Trivedi = superdispersão, logo binomial negativo.", "id": "C0026"}, {"a": "A3", "tp": "Contagem e inflacionados de zeros", "s": "original", "f": "O teste de Vuong, em modelos para dados de contagem, é utilizado para:", "b": "Verificar se há inflação de zeros, comparando o modelo inflacionado com o convencional.\n\nO teste de Vuong compara o modelo inflacionado de zeros com o convencional, verificando se há inflação de zeros.", "id": "C0027"}, {"a": "A3", "tp": "Contagem e inflacionados de zeros", "s": "original", "f": "Em modelos inflacionados de zeros (ZIP/ZINB), os 'zeros estruturais' correspondem a:", "b": "Observações para as quais o evento nunca ocorreria, modeladas pelo componente binário (logit).\n\nZeros estruturais vêm de observações que nunca teriam o evento, modeladas por um componente binário (logit); zeros amostrais vêm da Poisson/BN.", "id": "C0028"}, {"a": "A3", "tp": "Contagem e inflacionados de zeros", "s": "original", "f": "Uma variável dependente de contagem apresenta média 2 e variância 10. Qual é o modelo mais adequado?", "b": "Binomial negativo, pois há superdispersão (variância muito maior que a média).\n\nVariância (10) bem acima da média (2) = superdispersão; o Poisson subestima o erro; o binomial negativo, com parâmetro de dispersão, é o adequado.", "id": "C0029"}, {"a": "A3", "tp": "Modelos multinível", "s": "original", "f": "Em um modelo multinível, a variância entre escolas é 20 e a variância residual é 80. O coeficiente de correlação intraclasse (ICC) vale:", "b": "0,20 — 20% da variação é atribuível ao contexto (escola).\n\nICC = variância entre grupos / (entre + residual) = 20/(20 + 80) = 0,20: 20% da variação é do contexto.", "id": "C0030"}, {"a": "A3", "tp": "Modelos multinível", "s": "original", "f": "Para prever o valor de um indivíduo de determinado grupo em um modelo multinível, deve-se:", "b": "Somar a parte fixa (γ) aos efeitos aleatórios do grupo (ν₀ⱼ e ν₁ⱼ·x).\n\nO fittedvalues já incorpora os efeitos aleatórios.", "id": "C0031"}, {"a": "A3", "tp": "Modelos logísticos", "s": "original", "f": "Em uma regressão logística multinomial com uma variável dependente de 4 categorias, quantos logitos são estimados?", "b": "3, cada um comparando uma categoria com a categoria de referência.\n\nCom J categorias estimam-se J − 1 logitos, cada um comparando uma categoria com a de referência. Com 4 categorias, são 3 logitos.", "id": "C0032"}, {"a": "A3", "tp": "Modelos logísticos", "s": "original", "f": "Em uma regressão logística binária, o coeficiente β = 0,7 de uma variável X implica que e^β ≈ 2,01. Isso significa que:", "b": "Cada unidade adicional de X multiplica a chance (odds) do evento por cerca de 2.\n\ne^β é a razão de chances: cada unidade de X multiplica as odds por ≈ 2,01.", "id": "C0033"}, {"a": "A3", "tp": "Modelos logísticos", "s": "original", "f": "Em um modelo de regressão logística binária, o logito estimado para um indivíduo é Z = −0,5. Qual é a probabilidade estimada de ocorrência do evento? (p = 1/(1 + e^−Z))", "b": "Aproximadamente 0,3775.\n\np = 1/(1 + e^0,5) = 1/(1 + 1,6487) ≈ 0,3775. Logito negativo → probabilidade abaixo de 0,5.", "id": "C0034"}, {"a": "A3", "tp": "Modelos logísticos", "s": "original", "f": "A matriz de confusão de um modelo logístico (cutoff 0,5) apresenta: verdadeiros positivos = 45, falsos negativos = 15, falsos positivos = 10 e verdadeiros negativos = 130. A sensibilidade do modelo é:", "b": "75,00%\n\nSensibilidade = VP/(VP + FN) = 45/60 = 75%. (Acurácia = 175/200 = 87,5%; especificidade = 130/140 ≈ 92,86%.)", "id": "C0035"}, {"a": "A3", "tp": "Modelos logísticos", "s": "original", "f": "Com os mesmos dados de uma matriz de confusão (VP = 45, FN = 15, FP = 10, VN = 130), a acurácia global do modelo é:", "b": "87,50%\n\nAcurácia = (VP + VN)/total = 175/200.", "id": "C0036"}, {"a": "A3", "tp": "Contagem e inflacionados de zeros", "s": "original", "f": "Em um modelo de regressão Poisson, ln(λ) = 0,5 + 0,2·X. Para X = 3, o número esperado de ocorrências é aproximadamente:", "b": "3,00\n\nλ = e^(0,5 + 0,2·3) = e^1,1 ≈ 3,00. Em Poisson o preditor linear é ln(λ), então é preciso exponenciar.", "id": "C0037"}, {"a": "A3", "tp": "Modelos logísticos", "s": "original", "f": "Em uma regressão logística multinomial com três categorias (referência = 0), os logitos de um indivíduo são Z₁ = 0,5 e Z₂ = −0,2. A probabilidade de pertencer à categoria de referência é aproximadamente:", "b": "0,288\n\nP₀ = 1/(1 + e^0,5 + e^−0,2) = 1/(1 + 1,649 + 0,819) ≈ 0,288.", "id": "C0038"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Em uma regressão linear simples, o coeficiente de correlação de Pearson entre X e Y é 0,6. O R² do modelo é:", "b": "0,36\n\nEm regressão simples R² = r² = 0,6² = 0,36.", "id": "C0039"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Considere o modelo Preço = 40 + 12·Sul + 8·Norte, em que Sul e Norte são dummies e a região de referência é o Centro. O preço médio previsto para o Norte é:", "b": "48\n\nO intercepto (40) é o preço do Centro (referência); Norte = 40 + 8 = 48 (Sul = 52).", "id": "C0040"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Uma variável qualitativa com 5 categorias será incluída em uma regressão OLS por meio de dummies. Quantas dummies devem ser criadas?", "b": "4\n\nCom J categorias criam-se J − 1 dummies; a categoria omitida é a referência. 5 − 1 = 4.", "id": "C0041"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Em um teste de Shapiro-Francia aplicado aos resíduos de um modelo OLS, obteve-se p-valor = 0,40. A conclusão adequada é:", "b": "Não se rejeita a hipótese de normalidade dos resíduos.\n\nNo Shapiro-Francia H0 é normalidade. Com p = 0,40 > 0,05 não se rejeita H0: resíduos compatíveis com normalidade.", "id": "C0042"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Em um teste de Breusch-Pagan, obteve-se p-valor = 0,002. A conclusão adequada é:", "b": "Há evidência de heterocedasticidade.\n\nNo Breusch-Pagan H0 é variância constante (homocedasticidade). Com p = 0,002 < 0
