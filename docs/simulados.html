,05 rejeita-se H0: há heterocedasticidade.", "id": "C0043"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Em uma transformação de Box-Cox, o parâmetro lambda (λ) igual a zero corresponde a:", "b": "Uma transformação logarítmica (ln) da variável dependente.\n\nEm Box-Cox, λ = 0 equivale à transformação ln(Y); λ = 1 é linear; λ = 2 quadrática; λ = −1 inversa.", "id": "C0044"}, {"a": "A2", "tp": "Regressão OLS", "s": "original", "f": "Um VIF de 10 para uma variável explicativa corresponde a uma Tolerance de:", "b": "0,10\n\nTolerance = 1/VIF = 1/10 = 0,10. Quanto menor a tolerance, maior a multicolinearidade; 0,10 é o limite clássico de alerta.", "id": "C0045"}, {"a": "A1", "tp": "PCA", "s": "original", "f": "Os autovalores de uma análise fatorial por componentes principais são 2,6; 1,1; 0,2 e 0,1. Pelo critério de Kaiser (raiz latente), quantos fatores devem ser mantidos e qual o percentual de variância acumulada deles?", "b": "Dois fatores, que acumulam 92,5% da variância.\n\nMantêm-se os fatores com autovalor > 1: 2,6 + 1,1 = 3,7 de um total de 4 → 92,5%.", "id": "C0046"}, {"a": "A1", "tp": "Análise de Correspondência", "s": "original", "f": "Uma Análise de Correspondência Múltipla envolve três variáveis com 4, 3 e 5 categorias. O número máximo de dimensões é:", "b": "9\n\nO máximo de dimensões da ACM é a soma das categorias menos o número de variáveis: (4 + 3 + 5) − 3 = 9 (J − Q).", "id": "C0047"}, {"a": "A1", "tp": "Clustering", "s": "original", "f": "Um banco com 50 observações é analisado pelo método hierárquico aglomerativo. Quantos estágios de aglomeração (junções) ocorrem até restar um único cluster?", "b": "49\n\nCom n observações são necessárias n − 1 junções para chegar a um cluster: 50 − 1 = 49.", "id": "C0048"}, {"a": "A1", "tp": "Clustering (hierárquico e K-means)", "s": "original", "f": "Por que é recomendável padronizar (Z-score) as variáveis antes de uma análise de clusters baseada em distância euclidiana?", "b": "Para que variáveis em escalas muito diferentes (por exemplo, renda em reais e idade em anos) não dominem o cálculo das distâncias.\n\nA distância euclidiana soma diferenças ao quadrado; a variável de maior escala pesaria mais. O Z-score deixa todas com média 0 e desvio padrão 1.", "id": "C0049"}, {"a": "A1", "tp": "Clustering (hierárquico e K-means)", "s": "original", "f": "No encadeamento single linkage (vizinho mais próximo), a distância entre dois clusters é:", "b": "A menor distância entre um elemento de um cluster e um elemento do outro.\n\nSingle = mínimo (vizinhos mais próximos); complete = máximo (vizinhos mais distantes); average = média entre pares.", "id": "C0050"}, {"a": "A1", "tp": "Clustering (hierárquico e K-means)", "s": "original", "f": "Pontos A = 1, B = 2, C = 6 e D = 8 são clusterizados pelo método hierárquico aglomerativo com single linkage. Quais são os dois primeiros agrupamentos?", "b": "Primeiro A e B (distância 1) e, depois, C e D (distância 2).\n\nAs menores distâncias são d(A,B) = 1 e d(C,D) = 2; o algoritmo une sempre o par mais próximo primeiro.", "id": "C0051"}, {"a": "A1", "tp": "Clustering (hierárquico e K-means)", "s": "original", "f": "No K-means, a cada iteração, o que acontece depois de alocar cada observação ao centroide mais próximo?", "b": "Os centroides são recalculados como a média das observações de cada cluster.\n\nO ciclo é: alocar ao centroide mais próximo, recalcular os centroides (médias) e repetir até não haver realocações.", "id": "C0052"}, {"a": "A1", "tp": "Clustering (hierárquico e K-means)", "s": "original", "f": "A silhueta de uma observação é s = (b − a) / máx(a, b). Se a = 2 e b = 8, o valor de s é:", "b": "0,75, indicando que a observação está bem alocada.\n\ns = (8 − 2)/8 = 0,75. Valores próximos de 1 indicam boa alocação; próximos de −1, alocação provavelmente errada.", "id": "C0053"}, {"a": "A1", "tp": "Análise Fatorial por Componentes Principais", "s": "original", "f": "No critério da raiz latente (Kaiser), mantêm-se os fatores com:", "b": "Autovalor maior que 1.\n\nAutovalor > 1 significa que o fator explica mais variância do que uma variável original padronizada (que tem variância 1).", "id": "C0054"}, {"a": "A1", "tp": "Análise Fatorial por Componentes Principais", "s": "original", "f": "Em uma análise fatorial com 5 variáveis padronizadas, os autovalores são 2,6; 1,3; 0,6; 0,3 e 0,2. Quantos fatores o critério de Kaiser retém e que percentual da variância total eles explicam?", "b": "2 fatores, explicando (2,6 + 1,3)/5 = 78% da variância.\n\nSó 2,6 e 1,3 são maiores que 1. A variância total é igual ao número de variáveis (5), então 3,9/5 = 0,78.", "id": "C0055"}, {"a": "A1", "tp": "Análise Fatorial por Componentes Principais", "s": "original", "f": "O teste de esfericidade de Bartlett tem como hipótese nula que a matriz de correlações é igual à matriz identidade. Um p-valor menor que 0,05 indica que:", "b": "Rejeita-se H0: há correlações suficientes entre as variáveis, e a análise fatorial é adequada.\n\nMatriz identidade significa correlações nulas; rejeitar essa hipótese mostra que existe correlação a ser resumida em fatores.", "id": "C0056"}, {"a": "A1", "tp": "Análise de Correspondência (simples e múltipla)", "s": "original", "f": "Em uma análise de correspondência simples (ANACOR) com uma variável de 5 categorias e outra de 4 categorias, o número máximo de dimensões é:", "b": "3, pois é o mínimo entre (5 − 1) e (4 − 1).\n\nNa ANACOR, o máximo de dimensões é mín(I − 1, J − 1) = mín(4, 3) = 3.", "id": "C0057"}, {"a": "A1", "tp": "Análise de Correspondência (simples e múltipla)", "s": "original", "f": "Na análise dos resíduos padronizados ajustados de uma tabela de contingência, um valor de 2,8 em uma célula indica que:", "b": "Há associação estatisticamente significante entre as duas categorias, com frequência observada maior que a esperada.\n\nResíduo padronizado ajustado > 1,96 (a 95%) indica associação significante; positivo significa mais casos que o esperado sob independência.", "id": "C0058"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "Em uma regressão linear simples estimada por OLS, o parâmetro beta (inclinação) representa:", "b": "A variação esperada em Y para cada aumento de uma unidade em X.\n\nEm Y = α + βX, β é o efeito marginal de X; α é o valor de Y quando X = 0.", "id": "C0059"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "Em um modelo Y = 10 + 2·X1 − 3·X2, qual é o valor previsto de Y para X1 = 4 e X2 = 1?", "b": "15\n\nY = 10 + 2·4 − 3·1 = 10 + 8 − 3 = 15.", "id": "C0060"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "O R² ajustado, diferentemente do R², serve para:", "b": "Comparar modelos com números diferentes de variáveis, penalizando a inclusão de preditoras que pouco contribuem.\n\nO R² nunca diminui ao acrescentar variáveis; o ajustado desconta o número de parâmetros e pode cair.", "id": "C0061"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "Em uma regressão múltipla, o teste t de uma variável com p-valor = 0,32 (α = 5%) indica que:", "b": "A variável não é estatisticamente significante para explicar Y na presença das demais.\n\nH0 do teste t: o parâmetro é zero. Com p > α não se rejeita H0, então a variável não contribui de forma significante.", "id": "C0062"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "A heterocedasticidade viola qual pressuposto do modelo OLS?", "b": "A variância constante dos termos de erro (homocedasticidade).\n\nHeterocedasticidade é variância dos erros que muda com X; costuma ocorrer por variáveis omitidas ou forma funcional errada.", "id": "C0063"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "Uma tolerance de 0,05 para uma variável explicativa indica:", "b": "Multicolinearidade elevada, pois o VIF correspondente é 20.\n\nVIF = 1/Tolerance = 1/0,05 = 20. VIF acima de 10 (tolerance < 0,10) sugere multicolinearidade elevada.", "id": "C0064"}, {"a": "A2", "tp": "Regressão simples e múltipla (OLS)", "s": "original", "f": "Na previsão de salário com a dummy 'mulher' (1 = mulher, 0 = homem) em Salário = 3000 + 500·Experiência − 400·Mulher, o salário previsto de uma mulher com 2 anos de experiência é:", "b": "3600\n\n3000 + 500·2 − 400·1 = 3000 + 1000 − 400 = 3600.", "id": "C0065"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Em uma regressão logística binária, o coeficiente estimado de X é β = −0,7. Isso significa que:", "b": "Cada aumento de uma unidade em X reduz a chance (odds) do evento, multiplicando-a por e^−0,7 ≈ 0,50.\n\nO sinal do beta dá a direção; e^β dá a razão de chances. e^−0,7 ≈ 0,50: a chance cai pela metade.", "id": "C0066"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Em um modelo logístico binário, a sensibilidade é:", "b": "A proporção de eventos reais (positivos) que o modelo classificou corretamente como evento.\n\nSensibilidade = VP/(VP + FN). Especificidade = VN/(VN + FP). Acurácia = (VP + VN)/total.", "id": "C0067"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Uma matriz de confusão apresenta VP = 40, FN = 10, VN = 35 e FP = 15. A sensibilidade e a especificidade são, respectivamente:", "b": "0,80 e 0,70\n\nSensibilidade = 40/(40 + 10) = 0,80. Especificidade = 35/(35 + 15) = 0,70.", "id": "C0068"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Em um modelo de regressão Poisson, a hipótese central sobre a variável dependente é:", "b": "Que a média e a variância são iguais (equidispersão).\n\nQuando a variância é muito maior que a média (superdispersão), usa-se o binomial negativo.", "id": "C0069"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Um modelo de contagem tem ln(λ) = 1 + 0,5·X. Para X = 2, o número esperado de ocorrências é aproximadamente:", "b": "7,39\n\nln(λ) = 1 + 0,5·2 = 2, então λ = e² ≈ 7,39.", "id": "C0070"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Em modelos multinível, o modelo nulo (sem variáveis explicativas) é estimado para:", "b": "Decompor a variância em níveis e calcular a correlação intraclasse (ICC), verificando se vale a pena modelar a estrutura hierárquica.\n\nO modelo nulo separa a variância entre grupos da variância dentro dos grupos; se o ICC for relevante, o multinível se justifica.", "id": "C0071"}, {"a": "A3", "tp": "Logística, contagem e multinível", "s": "original", "f": "Os efeitos fixos e os efeitos aleatórios em um modelo multinível diferem porque:", "b": "Os fixos são parâmetros comuns a todos os grupos; os aleatórios capturam como o intercepto ou a inclinação variam de um grupo para outro.\n\nPrevisão = parte fixa (comum) + parte aleatória (desvio do grupo).", "id": "C0072"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em redes neurais, a função de perda (loss), também chamada de função objetivo, serve para:", "b": "Medir o erro entre a predição da rede e o valor real, orientando a atualização dos pesos para reduzi-lo.\n\nAula 22/09: a loss é calculada comparando predição e rótulo e o gradiente indica como alterar os pesos. (Questão elaborada a partir das legendas das aulas.)", "id": "C0073"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "No treinamento com mini-batch SGD, a cada passo de otimização:", "b": "Toma-se um conjunto de N amostras aleatórias do treino, faz-se a inferência, calcula-se a média da loss e otimiza-se em relação àquele batch.\n\nAula 22/09: 'um batch são N amostras aleatórias do dado de treinamento; calculo a loss, a média da loss e otimizo em relação àquele batch'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0074"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Segundo a aula, se o batch size for aumentado por um fator K, é possível:", "b": "Aumentar o learning rate pelo mesmo fator K.\n\nAula 22/09: batch maior permite aumentar o learning rate pelo mesmo fator; a 'temperatura de treinamento' é o learning rate dividido pelo batch size. (Questão elaborada a partir das legendas das aulas.)", "id": "C0075"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "A 'temperatura de treinamento', citada na aula, é definida como:", "b": "O learning rate dividido pelo batch size.\n\nAula 22/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0076"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Durante o treino, a loss de treino só melhora, enquanto a de validação melhora até certo ponto e depois começa a piorar. O procedimento adequado é:", "b": "Esperar algumas épocas de 'paciência', interromper o treinamento (early stopping) e restaurar o modelo da melhor época de validação.\n\nAula 22/09: usa-se early stopping com paciência e restauração do melhor modelo de validação. (Questão elaborada a partir das legendas das aulas.)", "id": "C0077"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em redes profundas, a ReLU é preferida à sigmoide nas camadas ocultas porque:", "b": "A probabilidade de o gradiente desaparecer é menor com a ReLU do que com a sigmoide.\n\nAula 22/09: 'quando a rede fica profunda, a probabilidade do gradiente desaparecer com ReLU é menor do que com a sigmoide'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0078"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Otimizadores como SGD com momentum e Adam, em comparação ao SGD puro:", "b": "Ganham velocidade (inércia) na descida, ajudando a sair de mínimos locais rasos, e o Adam, por ser adaptativo, tolera escolhas imperfeitas de learning rate e batch size.\n\nAula 22/09: otimizadores 'pegam velocidade' e o adaptativo 'consegue se adaptar até um certo nível'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0079"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em uma rede com 64 neurônios, aplicar dropout de 20% significa que, a cada inferência de treino:", "b": "Cerca de 13 neurônios (20% de 64) têm suas saídas desligadas aleatoriamente, o que regulariza e controla o overfitting.\n\nAula 22/09: 'dropout é uma técnica de regularização... apaga 20% dessas saídas, ou seja, ~13 neurônios'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0080"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em um modelo com duas saídas, uma de regressão (MSE) e outra de classificação (entropia cruzada), por que é preciso balancear as perdas?", "b": "Porque as perdas têm escalas naturais diferentes, e escalas desbalanceadas geram diferença de gradiente, prejudicando o treino.\n\nAula 22/09: 'rede neural não gosta de escalas diferentes, porque vai dar diferença de gradiente; então a gente tem que balancear as perdas'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0081"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "No dataset Abalone, a variável categórica nominal 'sexo' deve ser tratada, para a rede neural, por meio de:", "b": "Um encoding categórico adequado, como one-hot, e não como um número ordinal arbitrário.\n\nAula 22/09: encodings categóricos (one-hot, ordinal, embedding); ordinal só se houver ordem genuína. (Questão elaborada a partir das legendas das aulas.)", "id": "C0082"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "A função softmax, aplicada à saída de uma rede de classificação multiclasse:", "b": "Redistribui os valores (logits) em probabilidades que somam 1, funcionando como uma normalização.\n\nAula 22/09: 'quando eu jogo na softmax, ela redistribui esses números e faz uma espécie de normalização'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0083"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Quando o dado possui estrutura espacial (tensores de rank 2, 3 ou mais), as redes densas (MLP) tornam-se ineficientes porque:", "b": "Precisam achatar o dado e perdem a relação de vizinhança entre as posições.\n\nAula 29/09: 'quando o dado entra no espaço bidimensional, rank 2, 3, 4…, as MLPs se tornam ineficientes'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0084"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em uma operação de convolução, o kernel:", "b": "Costuma ser menor que a imagem e desliza sobre ela; em cada posição, multiplicam-se os valores correspondentes e somam-se os produtos.\n\nAula 29/09: 'você vai multiplicar todo mundo pelo seu respectivo endereço, no kernel e na imagem, e depois você soma'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0085"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Uma imagem em tons de cinza, ao ser processada por uma CNN, é representada com:", "b": "Um canal de feature, ou seja, formato (H, W, 1).\n\nAula 29/09: 'quando uma imagem só tem um canal de cor, a gente tem que representar com um canal de feature'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0086"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Uma entrada 4×4 é convoluída com um kernel 3×3, sem padding. O tamanho da saída é:", "b": "2×2\n\nAula 29/09: 'quando a gente convoluiu um input 4x4 e um kernel 3x3, a saída diminuiu o tamanho'. Saída = 4 − 3 + 1. (Questão elaborada a partir das legendas das aulas.)", "id": "C0087"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Uma imagem 5×5×1 é convoluída com kernel 3×3 e padding 'valid'. A saída tem formato:", "b": "3×3\n\nAula 29/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0088"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Qual é a consequência de convoluir repetidamente uma imagem sem padding e com kernel 3×3?", "b": "A imagem perde pixels a cada convolução (dois por dimensão) e, com muitas camadas, pode desaparecer; o padding 'same' evita essa perda.\n\nAula 29/09: 'se toda vez que eu convoluir perder dois pixels, ela vai desaparecer'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0089"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em uma convolução com stride 2, uma imagem 8×8 passa a ter, aproximadamente, resolução:", "b": "4×4, isto é, a resolução cai pela metade.\n\nAula 29/09: 'se essa imagem tivesse oito por oito, ia ficar quatro por quatro, por causa dos strides dois'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0090"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "O max pooling é:", "b": "Uma operação parecida com a convolução, mas que mantém o maior valor de cada janela, reduzindo a resolução do feature map.\n\nAula 29/09: 'existe uma outra operação que não é convolucional, é muito parecida... que é o max pooling'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0091"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em uma imagem RGB, ao convoluir com um kernel 3×3:", "b": "O kernel passa a ter também 3 canais (profundidade igual ao número de canais de entrada).\n\nAula 29/09: 'se a imagem for RGB, ele vai automaticamente criar três canais também'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0092"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "No início do treinamento de uma CNN, os valores do kernel:", "b": "Nascem aleatórios e são ajustados pelo gradiente descendente ao longo do treino.\n\nAula 29/09: 'o kernel nasce aleatório... o gradiente descendente vai começar a levar para uma ladeira de convergência'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0093"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Na arquitetura U-Net, usada para segmentação:", "b": "Os feature maps do caminho de descida são copiados para o caminho de subida, o que permite segmentar com precisão.\n\nNa U-Net as conexões 'skip' copiam os feature maps do caminho de descida para o de subida, recuperando detalhe espacial e permitindo segmentação precisa.", "id": "C0094"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Na camada de vetorização de texto, o parâmetro max_tokens define:", "b": "O tamanho do vocabulário (os tokens mais frequentes mantidos).\n\nAula 06/10: 'Max Tokens é o meu vocabulário'; o output_sequence_length corta ou completa as sentenças. (Questão elaborada a partir das legendas das aulas.)", "id": "C0095"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "O parâmetro output_sequence_length da vetorização de texto:", "b": "Fixa o comprimento das sequências, cortando as sentenças maiores e completando as menores.\n\noutput_sequence_length fixa o tamanho das sequências de saída: corta as maiores e completa (padding) as menores.", "id": "C0096"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Uma palavra que não pertence ao vocabulário aprendido é tratada, na vetorização, como:", "b": "Um token especial de palavra desconhecida ([UNK]).\n\nAula 06/10: 'se o modelo vê uma palavra que não conhece, simplesmente joga para esse token'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0097"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em relação ao vocabulário construído pela vetorização, é correto afirmar que:", "b": "Os tokens ficam ordenados por frequência decrescente.\n\nAula 06/10: 'eles estão em ordem decrescente de frequência'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0098"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Sobre o vetor multi-hot de um texto, é correto afirmar que:", "b": "Tem o tamanho do vocabulário e indica a presença dos tokens, sem preservar a ordem.\n\nAula 06/10. (Questão elaborada a partir das legendas das aulas.)", "id": "C0099"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Em comparação com o one-hot de sequência, o embedding:", "b": "Reúne ordem, frequência e semântica em um espaço dimensional pequeno.\n\nAula 06/10: 'agora vai ter ordem, frequência e semântica em um espaço dimensional pequeno'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0100"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Uma vantagem do Transformer sobre a LSTM é:", "b": "A alta capacidade de paralelização do treino, que as LSTMs não têm.\n\nAula 06/10: 'a parte extremamente auto-paralelizável do Transformer, que LSTMs não têm'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0101"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "O positional encoding foi criado para:", "b": "Recuperar a informação de ordem dos tokens, que o mecanismo de atenção sozinho perde.\n\nAula 06/10: 'vamos inventar alguma coisa para recuperar a informação da ordem para que esse transformer valha a pena'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0102"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "No mecanismo de atenção multi-cabeça (multi-head):", "b": "As dimensões do embedding são divididas pelo número de cabeças H, e cada cabeça aprende padrões diferentes.\n\nAula 06/10: 'dividem as dimensões do embedding por H... cada cabeça aprende coisas diferentes'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0103"}, {"a": "A4", "tp": "Redes neurais e deep learning", "s": "original", "f": "Quando se diz que um modelo de linguagem tem 'janela de contexto de um milhão de tokens', quer-se dizer que:", "b": "Ele consegue receber, de uma vez, até um milhão de tokens como entrada.\n\nAula 06/10. (Questão elaborada a partir das legendas das aulas.)", "id": "C0104"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "O XGBoost pode ser descrito, de forma simplificada, como:", "b": "Uma implementação altamente otimizada de gradient boosting usando árvores de decisão.\n\nAula 08/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0105"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "No boosting, as árvores são construídas:", "b": "De forma sequencial, cada uma tentando corrigir os erros (resíduos) das anteriores.\n\nAula 08/09: 'várias árvores, só que de forma sequencial... o terceiro modelo vai tentar corrigir esses resíduos'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0106"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "Comparando Random Forest e boosting, é correto afirmar que:", "b": "Na Random Forest as árvores são construídas em paralelo e combinadas por votação ou média; no boosting são sequenciais e corrigem os erros anteriores.\n\nAula 08/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0107"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "No gradient boosting, o learning rate corresponde:", "b": "Ao tamanho do passo, enquanto o gradiente fornece a direção.\n\nAula 08/09: 'o gradiente vai dar a direção do passo e o tamanho do passo é o learning rate'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0108"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "O early stopping em modelos de boosting serve para:", "b": "Interromper o treinamento quando adicionar novas árvores deixa de melhorar o resultado na validação.\n\nAula 08/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0109"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "Em train_test_split de um problema de classificação, o parâmetro stratify=y:", "b": "Mantém a proporção das classes tanto no treino quanto no teste.\n\nAula 08/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0110"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "Em um problema de classificação binária com o XGBoost, o objetivo (objective) 'binary:logistic':", "b": "Usa uma função logística para transformar a saída bruta em uma probabilidade entre 0 e 1.\n\nAula 08/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0111"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "Na validação cruzada com K blocos, em cada rodada:", "b": "Um bloco diferente é usado como teste e os demais como treino, até que todos tenham sido testados uma vez.\n\nAula 08/09: 'em cada rodada, duas partes servem para treino e uma para teste, alternando'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0112"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "Em um boosting com erro de treino de 0,10; 0,05; 0,04; 0,037 e 0,033 nas rodadas sucessivas, observa-se que:", "b": "O erro cai rapidamente no início e depois estabiliza, indicando que o ganho de novas árvores diminui (e o early stopping poderia atuar).\n\nAula 08/09. (Questão elaborada a partir das legendas das aulas.)", "id": "C0113"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "O StandardScaler, ao padronizar dados para uma rede neural:", "b": "Aprende a escala com os dados de treino e aplica a mesma transformação ao teste.\n\nAula 08/09: 'ele aprende a escala usando o X de treino e depois aplica a mesma transformação ao teste'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0114"}, {"a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "s": "original", "f": "Uma pequena diferença entre o desempenho no treino e no teste sugere que:", "b": "O modelo generaliza bem; uma diferença muito grande seria sinal de overfitting ou de problema.\n\nTreino e teste parecidos indicam boa generalização. Uma diferença grande sinalizaria overfitting ou problema nos dados.", "id": "C0115"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "Na análise de sentimento aplicada ao mundo real, antes de confiar no classificador é essencial:", "b": "Validar o resultado, comparando as predições com dados rotulados (por exemplo, o conjunto de teste).\n\nAula 28/07: 'como eu valido se o meu classificador está tendo o resultado que eu espero'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0116"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "Em um pipeline de análise de sentimento, a etapa de pré-processamento inclui:", "b": "Limpeza, tokenização, lematização/stemming e remoção de stopwords.\n\nAula 28/07: 'limpeza, tokenização, lematização, stem, remoção de stop words'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0117"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "Por que não é possível criar um modelo de sentimento que funcione 'para sempre'?", "b": "Porque a linguagem e o contexto mudam, e é preciso revalidar o modelo continuamente.\n\nLinguagem, gírias e contexto mudam; é preciso revalidar o modelo continuamente.", "id": "C0118"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "O LeIA (estendido), usado na aula, é:", "b": "Uma versão do VADER adaptada/estendida para o português, baseada em léxico.\n\nAula 28/07: 'o LeIA estendido, que é uma versão do VADER para o português'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0119"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "Sobre os léxicos (dicionários) usados na análise de sentimento, é correto afirmar que:", "b": "Nenhum léxico é completo: nem todas as palavras e expressões estão no dicionário.\n\nAula 28/07: 'nenhum léxico, nenhum dicionário que a gente vai utilizar tem todas as palavras'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0120"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "O spaCy, nos exemplos da aula, é utilizado principalmente para:", "b": "Pré-processamento (tokenização e lematização); ele não traz um classificador de sentimento pronto.\n\nAula 28/07: 'o spaCy não vem com classificador pronto, mas para o pré-processamento, tokenização, lematização...'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0121"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "No classificador Naive Bayes usado na aula, o modelo:", "b": "Calcula, para cada palavra, a probabilidade de aparecer em frases positivas e em negativas, e usa isso para classificar novas frases.\n\nAula 28/07: 'calcula cada palavra, probabilidade dessa palavra aparecer numa frase positiva, numa frase negativa'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0122"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "A função de classificação com transformers usada na aula retorna:", "b": "A predição (rótulo) e a probabilidade associada.\n\nAula 28/07: 'ela vai me devolver duas informações, a predição e a probabilidade'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0123"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "Sobre o uso de LLMs para classificar sentimento, é correto afirmar que:", "b": "Eles entendem contexto, negação e sarcasmo e podem explicar a classificação, mas isso tem custo.\n\nAula 28/07: 'LLM entende contexto, negação, sarcasmo, explica o motivo... mas isso tem um custo, não é barato'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0124"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "Em uma análise baseada em aspectos (por exemplo, comida e serviço de um restaurante), o resultado esperado é:", "b": "Um sentimento (positivo, negativo ou neutro) para cada aspecto citado no texto.\n\nAula 28/07: 'para cada aspecto, as labels... positivo, negativo ou neutro da comida e do serviço'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0125"}, {"a": "A5", "tp": "Text mining, sentimento e NLP", "s": "original", "f": "A frase 'Não gostei da cor do produto' foi classificada como positiva por um léxico manual simples. Esse resultado ilustra:", "b": "A limitação de abordagens que olham palavras isoladas e não tratam a negação.\n\nAula 28/07. (Questão elaborada a partir das legendas das aulas.)", "id": "C0126"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Pesquisa Operacional (PO) é conhecida como:", "b": "A ciência da tomada de decisão, que transforma um problema real em um modelo e o resolve para obter uma solução boa e rápida.\n\nAula 11/08: 'PO, em inglês Operations Research, é a ciência da tomada de decisão'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0127"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Em 'programação matemática', a palavra programação refere-se a:", "b": "Transformar um problema real em um modelo matemático e resolvê-lo, e não a criar código de computador.\n\nAula 11/08: 'não é a programação lá de criar código; é a programação no sentido de transformar um problema real num modelo matemático'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0128"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Os três componentes de um modelo matemático de otimização são:", "b": "Variáveis de decisão, função objetivo e restrições.\n\nAula 11/08. (Questão elaborada a partir das legendas das aulas.)", "id": "C0129"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "As restrições de um modelo de otimização são:", "b": "As condições que limitam os valores que as variáveis de decisão podem assumir.\n\nAula 11/08: 'o terceiro componente são as restrições, as condições que limitam as variáveis de decisão'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0130"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Em programação linear (PL):", "b": "As equações têm formato linear aditivo (constante multiplicada por variável) e as variáveis de decisão são contínuas.\n\nEm PL as funções são lineares (soma de constante × variável) e as variáveis são contínuas.", "id": "C0131"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Qual das expressões abaixo NÃO é linear?", "b": "3·x₁·x₂\n\nAula 11/08: multiplicar duas variáveis de decisão (3·x₁·x₂) é um formato não linear. (Questão elaborada a partir das legendas das aulas.)", "id": "C0132"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Se as variáveis de decisão precisarem ser inteiras (por exemplo, 3 em vez de 1,5), o modelo:", "b": "Deixa de ser de programação linear contínua e passa a ser um outro tipo de modelo (inteiro).\n\nAula 11/08. (Questão elaborada a partir das legendas das aulas.)", "id": "C0133"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Maximizar uma função objetivo equivale a:", "b": "Minimizar a função com o sinal trocado (maximizar f é o mesmo que minimizar −f).\n\nAula 11/08: 'maximizar uma função objetivo positiva é a mesma coisa que minimizar uma função negativa'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0134"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "No exemplo da aula, 'maximizar Z = 0,3x + 0,5y', em que x e y são metros de fita cortados nas máquinas antiga e moderna, representa:", "b": "A função objetivo, que quantifica a meta do problema.\n\nAula 11/08. (Questão elaborada a partir das legendas das aulas.)", "id": "C0135"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "Ao modelar um problema, a ordem recomendada na aula é:", "b": "Descrever em palavras as variáveis, a função objetivo e as restrições e só depois escrever as equações.\n\nAula 11/08: 'identificar em palavras, ainda não estou usando letras e números'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0136"}, {"a": "A5", "tp": "Pesquisa operacional e otimização", "s": "original", "f": "O resultado de um modelo de otimização é:", "b": "Um conjunto de valores, cada um referente a uma variável de decisão.\n\nAula 11/08: 'vou ter um conjunto de valores e cada valor é referente a uma variável'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0137"}, {"a": "P2", "tp": "Transformação digital", "s": "original", "f": "Segundo o texto, por que a adoção da plataforma não foi automática, mesmo com a tecnologia instalada?", "b": "Porque a mudança tecnológica é um evento externo, mas a adoção depende de uma transição interna, ligada à identidade e à perda percebida pelas pessoas.\n\nA mudança tecnológica é um evento externo, mas a adoção depende de uma transição interna (identidade, perda percebida).", "id": "C0138"}, {"a": "P2", "tp": "Transformação digital", "s": "original", "f": "A reação dos analistas ('o que sobra de mim?') é, no texto, interpretada como:", "b": "Resistência à perda percebida, e não oposição à tecnologia em si.\n\nA frase 'o que sobra de mim?' revela medo de perder identidade e valor, não rejeição técnica.", "id": "C0139"}, {"a": "P2", "tp": "Transformação digital", "s": "original", "f": "Os números '88%' e '37%' são usados no texto para indicar que:", "b": "O uso difundido da IA não garante, por si só, impacto financeiro em escala.\n\nOs números mostram uso amplo de IA (88%) com poucos resultados financeiros em escala (37%).", "id": "C0140"}, {"a": "P2", "tp": "Transformação digital", "s": "original", "f": "Qual das medidas recomendadas pela consultora está coerente com a ideia de 'preparar para a transição'?", "b": "Criar espaços de experimentação e redefinir o papel do analista.\n\nPreparar a transição passa por experimentar, redefinir papéis e lidar com a perda percebida.", "id": "C0141"}, {"a": "P2", "tp": "Transformação digital", "s": "original", "f": "A fase em que 'o antigo já não funciona e o novo ainda não se consolidou', com incerteza e ambiguidade, é chamada, no modelo de Bridges, de:", "b": "Zona neutra.\n\nNo modelo de Bridges a zona neutra é a fase de incerteza entre o fim do antigo e o novo começo.", "id": "C0142"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "O problema de construir o produto de recomendação para um mercado novo é melhor classificado como:", "b": "Incognoscível ou conhecível: exige experimentação, pois a resposta não pode ser definida de antemão.\n\nUm produto para mercado novo é problema incognoscível/conhecível: a solução só aparece por experimentação.", "id": "C0143"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "No texto, onde a abordagem adaptativa sugerida acomoda a incerteza?", "b": "No escopo, mantendo prazo e custo sob controle.\n\nNa abordagem adaptativa, prazo e custo são fixos e o escopo se ajusta à incerteza.", "id": "C0144"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Qual é o papel do Product Owner mencionado no texto?", "b": "Representar clientes e usuários e priorizar o Product Backlog para maximizar o valor.\n\nO Product Owner representa clientes e usuários e prioriza o backlog para maximizar valor.", "id": "C0145"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "A nota D.I.C.E. de 16 pontos situa o projeto na zona:", "b": "WORRY (15 a 17): preocupante.\n\nD.I.C.E.: 7–14 WIN, 15–17 WORRY, 18–28 WOE. A nota 16 cai em WORRY.", "id": "C0146"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Qual das medidas está alinhada com o princípio 'priorize o problema, não o projeto'?", "b": "Dividir o trabalho em microproblemas e escolher a abordagem conforme a natureza de cada um.\n\nPriorizar o problema significa decompor em microproblemas e escolher a abordagem conforme a natureza de cada um.", "id": "C0147"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Do ponto de vista da LGPD, qual dado coletado pela rede varejista é considerado dado pessoal sensível?", "b": "A religião do cliente.\n\nReligião é dado pessoal sensível (art. 5º da LGPD).", "id": "C0148"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "A coleta da religião 'para personalizar ofertas' viola, principalmente, qual princípio?", "b": "Necessidade, pois o dado não é indispensável à finalidade.\n\nColetar religião sem ser indispensável à finalidade viola o princípio da necessidade (minimização).", "id": "C0149"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Usar as compras para criar um perfil de crédito sem avisar os clientes fere, principalmente:", "b": "Os princípios da finalidade e da transparência.\n\nUsar dados para perfil de crédito sem avisar fere finalidade (uso para propósito diferente) e transparência.", "id": "C0150"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Na relação entre a rede varejista e a agência de marketing, quem trata os dados em nome do outro?", "b": "A agência é operadora; a rede varejista é a controladora.\n\nO controlador decide sobre o tratamento (a rede); o operador trata em nome dele (a agência).", "id": "C0151"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Sobre as sanções citadas pela advogada, é correto afirmar que a multa simples:", "b": "É de até 2% do faturamento, limitada a R$ 50 milhões por infração.\n\nA multa simples é de até 2% do faturamento, limitada a R$ 50 milhões por infração.", "id": "C0152"}, {"a": "P2", "tp": "Business Intelligence", "s": "original", "f": "Qual das alternativas descreve corretamente o ETL citado no texto?", "b": "Extrair os dados das fontes, transformá-los (limpeza e padronização) e carregá-los em um repositório único.\n\nETL = Extract, Transform, Load: extrair, transformar (limpar/padronizar) e carregar em repositório único.", "id": "C0153"}, {"a": "P2", "tp": "Business Intelligence", "s": "original", "f": "O que é shadow IT, segundo o texto?", "b": "O uso de ferramentas ou sistemas sem conhecimento ou aprovação da área de TI.\n\nShadow IT é o uso de ferramentas sem conhecimento ou aprovação da área de TI.", "id": "C0154"}, {"a": "P2", "tp": "Business Intelligence", "s": "original", "f": "Para mostrar a evolução das vendas ao longo dos meses, o tipo de gráfico mais adequado é:", "b": "Gráfico de linhas.\n\nEvolução ao longo do tempo é bem representada por gráfico de linhas.", "id": "C0155"}, {"a": "P2", "tp": "Business Intelligence", "s": "original", "f": "A principal razão para 'os números mudarem de acordo com quem apresenta' é:", "b": "A ausência de governança e de uma fonte única de dados, com regras comuns de extração.\n\nNúmeros diferentes por apresentador indicam falta de governança e fonte única de dados.", "id": "C0156"}, {"a": "P2", "tp": "Business Intelligence", "s": "original", "f": "O modelo self-service citado só funciona bem quando:", "b": "Existe base estruturada e governada, com capacitação e cultura de dados.\n\nSelf-service funciona com base estruturada e governada, capacitação e cultura de dados.", "id": "C0157"}, {"a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "s": "original", "f": "A dobra da conta mensal ilustra, principalmente, qual desafio da nuvem?", "b": "Custos fora de controle por falta de governança (FinOps), como recursos ociosos e sem alocação.\n\nA conta dobrar por recursos ociosos e sem alocação é desafio de custo/FinOps.", "id": "C0158"}, {"a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "s": "original", "f": "Segundo o modelo de responsabilidade compartilhada, a exposição do bucket por erro de configuração é responsabilidade:", "b": "Do cliente, pois envolve segurança NA nuvem (dados, permissões, configurações).\n\nExposição por erro de configuração é segurança NA nuvem, do cliente.", "id": "C0159"}, {"a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "s": "original", "f": "O princípio do menor privilégio, adotado pela empresa, significa:", "b": "Conceder a cada identidade apenas as permissões estritamente necessárias.\n\nMenor privilégio: cada identidade recebe apenas as permissões estritamente necessárias.", "id": "C0160"}, {"a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "s": "original", "f": "A queda de desempenho do modelo em produção, por mudança no comportamento dos clientes, é um exemplo de:", "b": "Data drift.\n\nQueda de desempenho por mudança do comportamento dos clientes é data drift.", "id": "C0161"}, {"a": "P2", "tp": "Tecnologia da informação e inovação tecnológica", "s": "original", "f": "Qual das alternativas associa corretamente modelo de serviço e exemplo?", "b": "SaaS: software pronto para uso, como um sistema de e-mail corporativo.\n\nSaaS é software pronto para uso (e-mail corporativo).", "id": "C0162"}, {"a": "P2", "tp": "Transformação digital e liderança", "s": "original", "f": "Quando o texto afirma que 'dados não eliminam o julgamento', quer dizer que:", "b": "O julgamento continua existindo, mas passa a acontecer em outro lugar do processo de decisão.\n\nO julgamento humano não some; passa a acontecer em outro ponto do processo.", "id": "C0163"}, {"a": "P2", "tp": "Transformação digital e liderança", "s": "original", "f": "A diferença entre diálogo e debate, no texto, é que o diálogo:", "b": "Busca construir significado compartilhado, sem necessidade de concordar ou vencer.\n\nNo diálogo busca-se construir significado compartilhado, sem precisar concordar nem vencer.", "id": "C0164"}, {"a": "P2", "tp": "Transformação digital e liderança", "s": "original", "f": "Em relação à empatia, o texto a define como:", "b": "Um comportamento de esforço para compreender razões, emoções e intenções do outro.\n\nEmpatia é esforço para compreender razões, emoções e intenções do outro.", "id": "C0165"}, {"a": "P2", "tp": "Transformação digital e liderança", "s": "original", "f": "Por que o diretor afirma que os problemas da empresa devem ser 'gerenciados' e não 'resolvidos'?", "b": "Porque são problemas complexos, interdependentes, que pedem experimentação e adaptação contínuas.\n\nProblemas complexos e interdependentes são geridos por experimentação e adaptação contínuas.", "id": "C0166"}, {"a": "P2", "tp": "Transformação digital e liderança", "s": "original", "f": "A diferença entre cooperar e colaborar, no contexto do texto, é que colaborar implica:", "b": "Entender todo o processo e fazer junto, para que cada parte potencialize as demais.\n\nColaborar é entender o todo e fazer junto, potencializando as partes.", "id": "C0167"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "O dado pessoal sensível é:", "b": "Uma subcategoria de dado pessoal, para a qual a lei exige critérios mais rigorosos e proteção maior.\n\nAula 21/10. (Questão elaborada a partir das legendas das aulas.)", "id": "C0168"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Um business case reúne, entre outros elementos:", "b": "Benefícios e como medi-los, riscos, custos, prazo e entregas.\n\nO business case reúne benefícios, riscos, custos, prazo e entregas.", "id": "C0169"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Um erro comum de quem está começando em nuvem é:", "b": "Acreditar que uma máquina virtual nunca vai falhar.\n\nAula 19/08. (Questão elaborada a partir das legendas das aulas.)", "id": "C0170"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "O fato de um dado estar público significa que:", "b": "Ainda é preciso respeitar finalidade, adequação e necessidade; não se pode fazer o que se quiser com ele.\n\nAula 21/10: 'não é o fato de estar público que eu posso fazer o que eu quiser'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0171"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Sobre mudança incremental e transformacional, é correto afirmar que:", "b": "A transformacional altera mais dimensões organizacionais e envolve mais risco que a incremental, e nenhuma é melhor que a outra em termos absolutos.\n\nA mudança transformacional envolve mais dimensões e risco; não há melhor absoluta.", "id": "C0172"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "FinOps é:", "b": "A prática de trazer responsabilidade financeira ao modelo de gastos variáveis da nuvem, com foco em gastar melhor.\n\nFinOps traz responsabilidade financeira ao gasto variável da nuvem.", "id": "C0173"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Dados financeiros, segundo a aula, são:", "b": "Tratados com rigor pela ANPD, mas não enquadrados como dados pessoais sensíveis pela lei.\n\nDados financeiros têm rigor da ANPD, mas não são sensíveis pela lei.", "id": "C0174"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Um resultado que se repete continuamente na organização, sem data de término, é, em geral, obtido por meio de:", "b": "Um processo, e não de um projeto.\n\nAula 22/07: 'se é um resultado recorrente, então não se dá por meio de um projeto, provavelmente por um processo'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0175"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Por que a análise de ROI de uma migração para a nuvem costuma ser ruim no início?", "b": "Porque, em geral, as aplicações são migradas do jeito que estão, sem otimização para o ambiente de nuvem.\n\nMigrar 'do jeito que está' (lift-and-shift) sem otimizar mantém custos altos no início.", "id": "C0176"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Uma empresa que atua apenas com outras empresas (B2B) afirma que 'não precisa de LGPD'. Essa afirmação está:", "b": "Incorreta, pois a empresa trata, no mínimo, dados de funcionários.\n\nQualquer empresa trata dados de funcionários, então a LGPD se aplica.", "id": "C0177"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Os três tipos de problemas apresentados na aula são:", "b": "Conhecidos (olham o passado), conhecíveis (olham o presente) e incognoscíveis (olham o futuro).\n\nAula 22/07. (Questão elaborada a partir das legendas das aulas.)", "id": "C0178"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "No PaaS, de acordo com a aula, o cliente:", "b": "Se preocupa apenas com o código (e os dados), enquanto o provedor cuida de virtualização, sistema operacional, patches e plataforma.\n\nNo PaaS o cliente cuida do código e dados; o provedor cuida do resto da plataforma.", "id": "C0179"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "O suboperador é:", "b": "Um terceiro contratado pelo operador, que atua sempre em nome do controlador e com a autorização dele.\n\nAula 21/10. (Questão elaborada a partir das legendas das aulas.)", "id": "C0180"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Segundo a aula, para escolher entre gestão preditiva e ágil, deve-se:", "b": "Identificar a natureza do problema (conhecido, conhecível ou incognoscível) e escolher a gestão mais adequada a ele.\n\nAula 22/07. (Questão elaborada a partir das legendas das aulas.)", "id": "C0181"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Na nuvem pública tradicional, é correto afirmar que:", "b": "Máquinas virtuais de empresas diferentes podem rodar no mesmo host físico (modelo multi-tenant).\n\nNa nuvem pública, VMs de clientes diferentes dividem o host (multi-tenant).", "id": "C0182"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Para a ANPD, um incidente de segurança é:", "b": "Qualquer fato que prejudique a confidencialidade, a integridade ou a disponibilidade; se puder trazer grave dano ao titular, deve ser comunicado à autoridade.\n\nIncidente é qualquer fato que afete confidencialidade, integridade ou disponibilidade (CID).", "id": "C0183"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "A expressão 'priorizar o problema, não o projeto' significa:", "b": "Entender claramente qual problema o projeto resolve antes de escolher como conduzi-lo, evitando fazer 'da melhor maneira possível a coisa errada'.\n\nEvita fazer muito bem a coisa errada: antes do projeto, entender o problema.", "id": "C0184"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Em um serviço SaaS, como o Office 365 ou o Gmail:", "b": "Tudo é gerenciado pelo provedor da nuvem.\n\nAula 19/08: 'o SaaS é um exemplo clássico... em que tudo é gerenciado pelo provedor'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0185"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "A classificação entre controlador e operador:", "b": "É determinada em cada fluxo de dados da organização; a mesma empresa pode ser controladora em um fluxo e operadora em outro.\n\nControlador/operador é definido por fluxo: a mesma empresa pode ser um ou outro conforme o caso.", "id": "C0186"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "O campo mais importante de um business case é:", "b": "O resultado do business case, que indica se vale ou não a pena fazer o projeto.\n\nAula 22/07: 'o campo mais importante é o resultado do business case'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0187"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "No IaaS, quem é responsável por rede, armazenamento e servidor físico?", "b": "O provedor de nuvem; a partir da criação da máquina virtual, passa a haver responsabilidade compartilhada.\n\nAula 19/08. (Questão elaborada a partir das legendas das aulas.)", "id": "C0188"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "O princípio da necessidade (minimização) exige:", "b": "Tratar apenas os dados estritamente necessários à finalidade.\n\nAula 21/10: a LGPD acabou com a lógica de 'coleta aí, vai que um dia eu preciso'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0189"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Na origem do ágil, Takeuchi e Nonaka compararam as empresas inovadoras a uma equipe de rugby porque:", "b": "O trabalho era feito de forma interligada, com o time avançando junto; daí vem o termo Scrum.\n\nRugby: o time avança junto, de forma interligada, origem do termo Scrum.", "id": "C0190"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Segundo o professor, a 'nuvem privada' criada por meio de uma VPC em um provedor público:", "b": "É uma rede privada isolada, mas não necessariamente um host exclusivo da empresa; para ele, nuvem privada de verdade teria rede e host dedicados.\n\nAula 19/08. (Questão elaborada a partir das legendas das aulas.)", "id": "C0191"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Entre as sanções, a publicização da infração é relevante porque:", "b": "O dano de reputação pode ser tão grave quanto a multa, podendo até aniquilar o negócio.\n\nDano de reputação pode ser tão grave quanto a multa.", "id": "C0192"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Em projetos de grande risco, de inovação disruptiva ou em mercados muito voláteis, a aula recomenda trabalhar com a lógica de:", "b": "Portfólio, e não com a lógica de business case.\n\nAula 22/07. (Questão elaborada a partir das legendas das aulas.)", "id": "C0193"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Sobre computação serverless (funções), é correto afirmar que:", "b": "Cobra-se pelo tempo de execução (milissegundos), mas há cold start, limite de tempo de execução e vendor lock-in.\n\nServerless cobra por execução, mas tem cold start, limite de tempo e lock-in.", "id": "C0194"}, {"a": "P2", "tp": "Legislação no ambiente digital (LGPD)", "s": "original", "f": "Uma empresa foi multada por vender sua base de dados sem base legal. O caso ilustra que:", "b": "Todo tratamento, inclusive a venda de bases, precisa de uma base legal.\n\nTodo tratamento, inclusive venda de bases, precisa de base legal.", "id": "C0195"}, {"a": "P2", "tp": "Metodologias ágeis", "s": "original", "f": "Os frameworks DICE, Cynefin e PMRL, citados na aula, servem para:", "b": "Definir, a partir da natureza do projeto, o estilo de gestão e de liderança do time.\n\nAula 22/07: 'aplicar frameworks como DICE, Cynefin e PMRL para definir o estilo de gestão do projeto e como liderar o time'. (Questão elaborada a partir das legendas das aulas.)", "id": "C0196"}, {"a": "P2", "tp": "TI e inovação tecnológica", "s": "original", "f": "Uma nuvem híbrida é caracterizada por:", "b": "Manter parte do ambiente no data center próprio e rodar apenas algumas partes na nuvem, quando isso faz sentido técnico e de custo.\n\nNuvem híbrida combina data center próprio com nuvem para o que fizer sentido.", "id": "C0197"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Por que a \"média\" das cores dos carros não faz sentido, e o que se pode calcular?", "b": "Porque os números são apenas etiquetas de categorias (ponderação arbitrária). Para uma variável qualitativa só se calculam frequências e a moda.", "id": "C0198"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Cinco salários: 3; 3,2; 3,5; 4; 30. Qual medida descreve melhor o salário típico e por quê?", "b": "A mediana (3,5): o valor extremo de 30 puxa a média (8,74) para um valor que ninguém recebe.", "id": "C0199"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Em um teste com α = 5% e p = 0,03, qual a decisão? E com α = 1%?", "b": "Com 5%, p < α: rejeita H0. Com 1%, p > α: não rejeita H0.", "id": "C0200"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Quantos graus de liberdade tem um qui-quadrado de associação de uma tabela 3×4?", "b": "(3 − 1)(4 − 1) = 6.", "id": "C0201"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Qual teste fazer antes de comparar as médias de dois grupos, e para quê?", "b": "O teste F das variâncias, para decidir entre o t com variâncias iguais ou diferentes.", "id": "C0202"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Dados 2, 4, 6: quanto vale a variância amostral?", "b": "Média 4; soma dos quadrados dos desvios = 8; 8 ÷ (3 − 1) = 4.", "id": "C0203"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Coeficiente de variação (medida): fórmula / para que serve?", "b": "CV = \\frac{s}{\\bar{x}} \\times 100 — comparar a dispersão de variáveis em escalas diferentes", "id": "C0204"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Erro padrão (medida): fórmula / para que serve?", "b": "EP = \\frac{s}{\\sqrt{n}} — medir a precisão da média calculada", "id": "C0205"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Amplitude interquartil (medida): fórmula / para que serve?", "b": "AIQ = Q_3 - Q_1 — dispersão robusta; base da regra de Tukey", "id": "C0206"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "t de Student (distribuição): ideia / usada em?", "b": "como a normal, mas com caudas mais pesadas: compensa a incerteza de quem tem poucos dados e desvio desconhecido — teste t, intervalos de confiança", "id": "C0207"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "Qui-quadrado (χ²) (distribuição): ideia / usada em?", "b": "assimétrica à direita; compara frequências — associação entre categóricas", "id": "C0208"}, {"a": "A5", "tp": "Estatística", "s": "conceito", "f": "F de Snedecor (distribuição): ideia / usada em?", "b": "razão de variâncias — comparar variâncias, ANOVA", "id": "C0209"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Defina ETL e cite as fases do BI?", "b": "ETL = Extract, Transform, Load. Fases: identificação, coleta, limpeza/transformação, modelagem, armazenamento, visualização e publicação.", "id": "C0210"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Qual gráfico usar para uma série temporal?", "b": "Gráfico de linha, com o tempo no eixo horizontal.", "id": "C0211"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "O que é shadow IT e por que é um risco?", "b": "É o uso de sistemas ou serviços sem conhecimento ou aprovação da TI; escapa dos controles de segurança, governança e proteção de dados.", "id": "C0212"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Para que serve uma chave estrangeira no modelo do Power BI?", "b": "Relaciona duas tabelas (liga a coluna de uma à chave primária da outra), permitindo que filtros e medidas funcionem entre elas.", "id": "C0213"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Extract (etapa): o que acontece / exemplo?", "b": "os dados são extraídos de suas fontes — ler um CSV de vendas e uma tabela do ERP", "id": "C0214"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Transform (etapa): o que acontece / exemplo?", "b": "limpeza, padronização, correção de tipos — datas como data, moedas na mesma unidade", "id": "C0215"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Load (etapa): o que acontece / exemplo?", "b": "carga no destino em que serão consultados — gravar no data warehouse", "id": "C0216"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "acompanhar algo ao longo do tempo (objetivo): gráfico / observação?", "b": "linha — tempo no eixo horizontal", "id": "C0217"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "comparar categorias (objetivo): gráfico / observação?", "b": "barras ou colunas — ordene para facilitar a leitura", "id": "C0218"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "partes de um todo (objetivo): gráfico / observação?", "b": "pizza ou rosca — só com poucas fatias", "id": "C0219"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "valores exatos (objetivo): gráfico / observação?", "b": "tabela — quando o número importa mais que o formato", "id": "C0220"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Desktop (peça): função?", "b": "onde se desenvolve o relatório", "id": "C0221"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Service (peça): função?", "b": "publicar e consumir", "id": "C0222"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Mobile (peça): função?", "b": "acesso no celular", "id": "C0223"}, {"a": "P2", "tp": "BI e Data Viz", "s": "conceito", "f": "Embedded (peça): função?", "b": "incorporar em outros sistemas", "id": "C0224"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Defina engenharia de dados e diga o que o engenheiro normalmente não faz?", "b": "Desenvolve e mantém sistemas que coletam, organizam e processam dados. Normalmente não cria modelos de ML, dashboards, análises, KPIs nem aplicativos.", "id": "C0225"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Qual a diferença entre view e stored procedure?", "b": "View é tabela virtual/consulta salva, só leitura e sem lógica. A procedure é um bloco de código armazenado que pode alterar dados, ter lógica e parâmetros.", "id": "C0226"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Dê um exemplo de entidade fraca?", "b": "Itens de pedido: dependem do pedido e sua chave inclui a chave do pedido.", "id": "C0227"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Cite três problemas comuns ao preparar dados?", "b": "Valores ausentes, dados duplicados e formatos despadronizados.", "id": "C0228"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "CREATE TABLE (comando): faz?", "b": "cria a tabela", "id": "C0229"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "INSERT INTO … VALUES (comando): faz?", "b": "inclui linhas", "id": "C0230"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "SELECT (com JOIN e GROUP BY) (comando): faz?", "b": "consulta, liga tabelas e agrega", "id": "C0231"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "UPDATE … SET … WHERE (comando): faz?", "b": "altera linhas", "id": "C0232"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "DELETE … WHERE (comando): faz?", "b": "apaga linhas", "id": "C0233"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Forte (tipo): ideia / exemplo?", "b": "existe por si só, com chave primária própria — clientes, produtos", "id": "C0234"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Fraca (tipo): ideia / exemplo?", "b": "depende de outra e não tem chave primária completa sem a chave da entidade da qual depende — itens de pedido (dependem do pedido)", "id": "C0235"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Associativa (tipo): ideia / exemplo?", "b": "representa um relacionamento que tem atributos próprios — vendas (liga cliente e produto e guarda data e quantidade)", "id": "C0236"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "O que é (): view / stored procedure?", "b": "consulta salva que se comporta como tabela virtual — bloco de código SQL armazenado, como uma função", "id": "C0237"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Altera dados? (): view / stored procedure?", "b": "não, só consulta — pode alterar (insert, update, delete)", "id": "C0238"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Lógica e parâmetros (): view / stored procedure?", "b": "sem lógica de programação — tem lógica, parâmetros de entrada e saída", "id": "C0239"}, {"a": "P2", "tp": "Engenharia de Dados", "s": "conceito", "f": "Para quê (): view / stored procedure?", "b": "reaproveitar consultas complexas, simplificar relatórios — automatizar tarefas repetitivas, com segurança e reutilização", "id": "C0240"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Diferencie projeto e processo?", "b": "Projeto: único, finito, muda o negócio. Processo: contínuo e recorrente, mantém e aprimora o status quo.", "id": "C0241"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Onde cada abordagem acomoda a incerteza?", "b": "Preditiva: em prazo e custo (escopo fixo). Adaptativa: no escopo (prazo e custo rígidos).", "id": "C0242"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Calcule o DICE: D = 3, I = 2, C1 = 3, C2 = 2, E = 2?", "b": "3 + 4 + 6 + 2 + 2 = 17 → WORRY.", "id": "C0243"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Cite os 8 desperdícios do Lean?", "b": "Superprodução, espera, transporte, processamento excessivo, inventário excessivo, movimentação, defeitos e talento não utilizado.", "id": "C0244"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Duração (fator): o que mede / pontos?", "b": "tempo até a conclusão (ou entre revisões) — <2 meses = 1; 2–4 = 2; 4–8 = 3; >8 = 4", "id": "C0245"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Integridade (fator): o que mede / pontos?", "b": "capacidade da equipe, incluindo a liderança — 1 (excelente) a 4", "id": "C0246"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Compromisso (fator): o que mede / pontos?", "b": "C1 = gestão sênior; C2 = pessoas envolvidas — 1 a 4 cada", "id": "C0247"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Esforço (fator): o que mede / pontos?", "b": "esforço além das responsabilidades habituais — <10% = 1 … >40% = 4", "id": "C0248"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Indivíduos e interações (valorizamos mais): do que?", "b": "processos e ferramentas", "id": "C0249"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Software funcionando (valorizamos mais): do que?", "b": "documentação extensa", "id": "C0250"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Colaboração com o cliente (valorizamos mais): do que?", "b": "negociação de contratos", "id": "C0251"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Responder a mudanças (valorizamos mais): do que?", "b": "seguir um plano", "id": "C0252"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Claro (domínio): prática / foco?", "b": "melhores práticas, checklist — eficiência", "id": "C0253"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Complicado (domínio): prática / foco?", "b": "análise e boas práticas — especialistas", "id": "C0254"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Complexo (domínio): prática / foco?", "b": "experimentos seguros (probe → sense → respond) — eficácia", "id": "C0255"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Caótico (domínio): prática / foco?", "b": "agir primeiro para estabilizar — liderança direta", "id": "C0256"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Product Owner (elemento): o que é?", "b": "representa clientes e usuários, prioriza o Product Backlog, maximiza o valor", "id": "C0257"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Scrum Master (elemento): o que é?", "b": "líder-servidor; remove impedimentos", "id": "C0258"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Desenvolvedores (elemento): o que é?", "b": "time multidisciplinar e autogerenciável", "id": "C0259"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Eventos (elemento): o que é?", "b": "Sprint Planning · Daily · Sprint Review · Retrospective", "id": "C0260"}, {"a": "P2", "tp": "Metodologias Ágeis", "s": "conceito", "f": "Artefato → compromisso (elemento): o que é?", "b": "Product Backlog → Meta do Produto; Sprint Backlog → Meta da Sprint; Incremento → Definição de Pronto (DoD)", "id": "C0261"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Diferencie IaaS, PaaS e SaaS e dê um exemplo de cada?", "b": "IaaS: infraestrutura (EC2); PaaS: plataforma para desenvolver sem gerir infra (App Engine); SaaS: software pronto (Gmail).", "id": "C0262"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "O que é cold start?", "b": "Latência extra na primeira execução de uma função serverless, quando o ambiente ainda precisa ser iniciado.", "id": "C0263"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Quem responde pela configuração errada de um bucket?", "b": "O cliente (segurança NA nuvem, pelo modelo de responsabilidade compartilhada).", "id": "C0264"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Qual a diferença entre ACID e BASE?", "b": "ACID (SQL) garante transações consistentes; BASE (NoSQL) prioriza disponibilidade e velocidade com consistência eventual.", "id": "C0265"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Custo (): on-premises (antigo) / nuvem?", "b": "CAPEX: compra de hardware caro — OPEX: paga pelo uso", "id": "C0266"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Manutenção (): on-premises (antigo) / nuvem?", "b": "você mantém hardware e espaço físico — o provedor mantém", "id": "C0267"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Escala (): on-premises (antigo) / nuvem?", "b": "lenta — elasticidade em minutos", "id": "C0268"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Responsabilidade (): on-premises (antigo) / nuvem?", "b": "toda sua — compartilhada", "id": "C0269"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Esquema (): sql (relacional) / nosql?", "b": "fixo — flexível", "id": "C0270"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Garantia (): sql (relacional) / nosql?", "b": "ACID (atomicidade, consistência, isolamento, durabilidade) — BASE (disponibilidade e consistência eventual)", "id": "C0271"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Escala (): sql (relacional) / nosql?", "b": "difícil horizontalmente — horizontal", "id": "C0272"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Uso típico (): sql (relacional) / nosql?", "b": "transações, ERP — grande escala, velocidade", "id": "C0273"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Tipos (): sql (relacional) / nosql?", "b": "MySQL, PostgreSQL, RDS — documentos (MongoDB), chave-valor (Redis), colunar (Cassandra), grafo (Neo4j)", "id": "C0274"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Descritiva (tipo): pergunta?", "b": "o que aconteceu?", "id": "C0275"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Preditiva (tipo): pergunta?", "b": "o que vai acontecer?", "id": "C0276"}, {"a": "P2", "tp": "Cloud Computing", "s": "conceito", "f": "Prescritiva (tipo): pergunta?", "b": "o que devemos fazer?", "id": "C0277"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Um nó tem 3 vizinhos e há 1 ligação entre eles. Qual o CC?", "b": "Pares possíveis = 3; existe 1 → CC = 1/3 ≈ 0,33.", "id": "C0278"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "O que significa betweenness alta?", "b": "O nó aparece em muitos dos menores caminhos entre outros pares: é ponte ou porteiro da informação.", "id": "C0279"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "O que acontece ao aumentar a resolution?", "b": "Há menos comunidades, e maiores.", "id": "C0280"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Por que SNA não é análise de mídia social?", "b": "Porque analisa relacionamentos entre quaisquer entidades (ligações, e-mails, transações), não só redes sociais online.", "id": "C0281"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Líder (papel): descrição?", "b": "nó central da comunidade, com conectividade recíproca", "id": "C0282"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Seguidor (papel): descrição?", "b": "perfil parecido, ligado diretamente ao líder", "id": "C0283"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Marginal (papel): descrição?", "b": "perfil de seguidor, mas sem proximidade ao líder", "id": "C0284"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Outlier (papel): descrição?", "b": "poucas ou escassas conexões", "id": "C0285"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Bridge (ponte) (papel): descrição?", "b": "conecta comunidades diferentes", "id": "C0286"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Degree (grau) (métrica): pergunta / como calcula e interpreta?", "b": "quantas conexões o nó tem? — nº de links; em redes direcionadas, out-degree (saem), in-degree (chegam) e degree = in + out", "id": "C0287"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Clustering Coefficient (CC) (métrica): pergunta / como calcula e interpreta?", "b": "os vizinhos do nó se conhecem entre si? — CC = \\frac{\\text{ligações existentes entre os vizinhos}}{\\text{ligações possíveis entre os vizinhos}}", "id": "C0288"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Closeness (proximidade) (métrica): pergunta / como calcula e interpreta?", "b": "quão perto o nó está de todos? — média dos caminhos mais curtos até os demais; menor média = mais central (difunde informação mais rápido)", "id": "C0289"}, {"a": "A5", "tp": "Análise de Redes (SNA)", "s": "conceito", "f": "Betweenness (intermediação) (métrica): pergunta / como calcula e interpreta?", "b": "o nó está \"no meio do caminho\" de outros? — nº de vezes que o nó aparece nos menores caminhos entre outros pares; alto = porteiro/ponte", "id": "C0290"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Receitas 300, despesas não financeiras 280, juros 35. Qual o primário e o nominal?", "b": "Primário = +20 (superávit); nominal = 20 − 35 = −15 (déficit).", "id": "C0291"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "O que o Banco Central faz ao vender títulos públicos?", "b": "Retira liquidez da economia (política contracionária).", "id": "C0292"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Qual a diferença entre PIB nominal e real?", "b": "Nominal usa preços correntes; real desconta a inflação, mostrando o crescimento do volume produzido.", "id": "C0293"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Cite os três tipos de inflação?", "b": "De demanda, de custos/oferta e inercial.", "id": "C0294"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "De demanda (tipo): causa?", "b": "excesso de consumo e crédito", "id": "C0295"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "De custos (oferta) (tipo): causa?", "b": "choques: clima, câmbio, preços administrados", "id": "C0296"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Inercial (tipo): causa?", "b": "memória inflacionária, indexação e expectativas (espiral)", "id": "C0297"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Selic (instrumento): o que faz?", "b": "taxa básica de juros", "id": "C0298"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Compulsório (instrumento): o que faz?", "b": "parcela dos depósitos que os bancos precisam reter", "id": "C0299"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Redesconto (instrumento): o que faz?", "b": "empréstimo do BC a bancos sem liquidez", "id": "C0300"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Open market (instrumento): o que faz?", "b": "compra e venda de títulos públicos: vender retira liquidez; comprar injeta", "id": "C0301"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Normativos (camada): órgãos?", "b": "CMN, CNSP, CNPC", "id": "C0302"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Supervisores (camada): órgãos?", "b": "BACEN, CVM, SUSEP, PREVIC", "id": "C0303"}, {"a": "P2", "tp": "Conjuntura Econômica", "s": "conceito", "f": "Operadores (camada): órgãos?", "b": "bancos, cooperativas, fintechs, bolsas, seguradoras", "id": "C0304"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Calcule o retorno discreto de um ativo que foi de R$ 50 para R$ 52?", "b": "52 ÷ 50 − 1 = 4%.", "id": "C0305"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Cliente com EC = R$ 20 mil, PD = 5% e recuperação de 40%. Qual a perda esperada?", "b": "LGD = 1 − 0,4 = 0,6; perda = 0,05 × 20.000 × 0,6 = R$ 600.", "id": "C0306"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Por que a correlação negativa reduz o risco de uma carteira?", "b": "O termo de covariância fica negativo e reduz a variância total: um ativo sobe quando o outro cai.", "id": "C0307"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "PR = 90.000 e APR = 1.000.000. O banco está adequado?", "b": "Índice = 9% ≥ 8%, sim.", "id": "C0308"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Esperada (tipo de perda): tratamento?", "b": "provisionada", "id": "C0309"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Não esperada (tipo de perda): tratamento?", "b": "exige capital", "id": "C0310"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Excepcional (cauda) (tipo de perda): tratamento?", "b": "falha extrema", "id": "C0311"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "+ depreciação (despesa que não sai do caixa) (passo): cálculo?", "b": "entrada de caixa operacional", "id": "C0312"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Análise de sensibilidade (técnica): como funciona?", "b": "varia um parâmetr
