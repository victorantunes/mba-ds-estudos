o por vez e mede o impacto no VPL; se muda muito, o projeto é muito sensível àquele parâmetro", "id": "C0313"}, {"a": "A5", "tp": "Riscos e Analytics", "s": "conceito", "f": "Simulação de Monte Carlo (técnica): como funciona?", "b": "sorteia todas as variáveis segundo suas distribuições (Normal, Triangular, PERT) muitas vezes e obtém a distribuição do VPL", "id": "C0314"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Diferencie cooperar e colaborar?", "b": "Cooperar é cumprir a sua parte e deixar os demais cumprirem a deles. Colaborar é entender o processo todo e fazer junto, para potencializar o impacto.", "id": "C0315"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Quais são as 3 dores da incerteza?", "b": "Desconfiança, desânimo e medo da instabilidade.", "id": "C0316"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Empatia é sentimento ou comportamento?", "b": "Comportamento: esforço por compreender razões, emoções e intenções do outro.", "id": "C0317"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Quais os três tipos de liderança no modelo de complexidade?", "b": "Administrativa, adaptativa e capacitadora (enabling/metaliderança).", "id": "C0318"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Calma exagerada (under-reacting) (postura): comportamento / resultado?", "b": "minimiza e não muda nada — a crise avança", "id": "C0319"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Pânico (over-reacting) (postura): comportamento / resultado?", "b": "reage em excesso, foca no negativo — decisões ruins", "id": "C0320"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Adaptação (postura): comportamento / resultado?", "b": "aproxima-se das pessoas, empatiza e nomeia o que ocorre, desenha cenários — resposta construtiva", "id": "C0321"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Intrapessoal (domínio): competências?", "b": "autoconsciência, autocontrole, adaptabilidade, otimismo", "id": "C0322"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Interpessoal (domínio): competências?", "b": "consciência social (empatia) e administração de relacionamentos (influência, desenvolvimento dos outros, conflitos, trabalho em equipe)", "id": "C0323"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Natureza (): simples / complexos?", "b": "independentes e previsíveis — interdependentes, contexto desconhecido", "id": "C0324"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Tratamento (): simples / complexos?", "b": "podem ser resolvidos — devem ser gerenciados", "id": "C0325"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Método (): simples / complexos?", "b": "há histórico e uma resposta certa — planos raramente funcionam; experimentação", "id": "C0326"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Quem cuida (): simples / complexos?", "b": "pessoas operacionais — líderes, com práticas adaptativas", "id": "C0327"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Administrativa (tipo): ideia?", "b": "planejar, coordenar, controlar; estrutura e processos", "id": "C0328"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Adaptativa (tipo): ideia?", "b": "emerge de comportamentos coletivos e criativos, da necessidade de ajuste ao ambiente", "id": "C0329"}, {"a": "P2", "tp": "Liderança em DS", "s": "conceito", "f": "Capacitadora (enabling) (tipo): ideia?", "b": "metaliderança: cria as condições para a mudança e facilita conhecimento e criatividade, sem comandar", "id": "C0330"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Qual agente trata dados em nome de outro?", "b": "O operador (em nome do controlador).", "id": "C0331"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Todo tratamento de dados exige consentimento?", "b": "Falso. Exige uma base legal, e há outras além do consentimento (contrato, obrigação legal, legítimo interesse etc.).", "id": "C0332"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "O que diz o princípio da necessidade?", "b": "Usar o mínimo de dados necessário para atingir a finalidade.", "id": "C0333"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Biometria e CPF são dados sensíveis?", "b": "Biometria sim; CPF não.", "id": "C0334"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Qual o limite da multa simples?", "b": "Até 2% do faturamento do último exercício, limitada a R$ 50 milhões por infração.", "id": "C0335"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "GDPR (UE, 2018) (norma): ponto-chave?", "b": "regras estritas; alcance global (afeta empresas fora da UE que tratam dados de europeus)", "id": "C0336"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "CCPA (Califórnia, 2020) (norma): ponto-chave?", "b": "direito de saber o que é coletado e de pedir exclusão", "id": "C0337"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Marco Civil da Internet (Lei 12.965/2014) (norma): ponto-chave?", "b": "neutralidade da rede, privacidade, liberdade de expressão; provedor só responde por conteúdo de terceiros após ordem judicial; guarda de registros: conexão 1 ano, acesso a aplicações 6 meses", "id": "C0338"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Marco Legal das Criptomoedas (Lei 14.478/2022) (norma): ponto-chave?", "b": "regras para prestadoras de serviços de ativos virtuais", "id": "C0339"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "LAI (Lei 12.527/2011) (norma): ponto-chave?", "b": "transparência na administração pública (tensão com a LGPD: transparência × privacidade)", "id": "C0340"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "LGPD (Lei 13.709/2018) (norma): ponto-chave?", "b": "protege liberdade, privacidade e livre desenvolvimento da personalidade; trata dados de pessoas naturais, em qualquer meio", "id": "C0341"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Obrigação legal ou regulatória (base legal): exemplo?", "b": "guardar nota fiscal", "id": "C0342"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Execução de contrato (base legal): exemplo?", "b": "entregar o produto comprado", "id": "C0343"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Legítimo interesse (base legal): exemplo?", "b": "prevenção a fraudes do próprio negócio", "id": "C0344"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Proteção ao crédito (base legal): exemplo?", "b": "consulta de score", "id": "C0345"}, {"a": "P2", "tp": "LGPD", "s": "conceito", "f": "Outras (base legal): exemplo?", "b": "políticas públicas, estudos por órgão de pesquisa, exercício regular de direitos, proteção da vida, tutela da saúde", "id": "C0346"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Por que padronizar antes do cluster?", "b": "Porque a distância é sensível à escala: variáveis em unidades maiores dominariam o agrupamento.", "id": "C0347"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Quando se define o número de clusters no hierárquico e no K-means?", "b": "No hierárquico, depois, olhando o dendrograma; no K-means, antes (K a priori), apoiado em cotovelo e silhueta.", "id": "C0348"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Qual a diferença entre single e complete linkage?", "b": "Single usa a menor distância entre elementos dos dois clusters; complete usa a maior.", "id": "C0349"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "O que indica uma silhueta próxima de 1?", "b": "Observações bem alocadas: perto do próprio cluster e longe do vizinho.", "id": "C0350"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Como saber quais variáveis formaram os clusters?", "b": "Pelo teste F (ANOVA): p < α indica que a média da variável difere entre clusters.", "id": "C0351"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Euclidiana (padrão) (medida): ideia?", "b": "distância em linha reta", "id": "C0352"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Euclidiana quadrática (medida): ideia?", "b": "a mesma, ao quadrado", "id": "C0353"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Manhattan (city block) (medida): ideia?", "b": "soma das diferenças absolutas", "id": "C0354"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Chebychev (medida): ideia?", "b": "a maior diferença em uma variável", "id": "C0355"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Correlação entre linhas (medida): ideia?", "b": "medida de semelhança; vira dissimilaridade com 1 - r", "id": "C0356"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Single (vizinho mais próximo) (método): distância entre dois grupos / quando?", "b": "a mínima entre elementos — observações bem distintas", "id": "C0357"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Complete (vizinho mais distante) (método): distância entre dois grupos / quando?", "b": "a máxima — observações parecidas", "id": "C0358"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Average (entre grupos) (método): distância entre dois grupos / quando?", "b": "a média de todos os pares — meio-termo", "id": "C0359"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Cotovelo (Elbow) (método): como lê?", "b": "gráfico de WCSS × K; escolhe-se a \"dobra\" onde a queda deixa de ser grande", "id": "C0360"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "Silhueta (método): como lê?", "b": "s = \\frac{b - a}{\\max(a, b)}, com a = distância média dentro do próprio cluster e b = distância média ao cluster vizinho mais próximo; vai de −1 a 1 e perto de 1 é melhor", "id": "C0361"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "entre grupos?", "b": "o quanto as médias dos clusters se afastam umas das outras;", "id": "C0362"}, {"a": "A1", "tp": "Clustering", "s": "conceito", "f": "dentro dos grupos?", "b": "o quanto as observações variam dentro de cada cluster.", "id": "C0363"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Por que a PCA ajuda a resolver multicolinearidade?", "b": "Porque os fatores são ortogonais (correlação zero); usá-los como regressores elimina a correlação entre preditores.", "id": "C0364"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Qual a H0 do teste de Bartlett e qual decisão desejamos?", "b": "H0: a matriz de correlações é a identidade. Queremos rejeitá-la (p < 0,05).", "id": "C0365"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Autovalores 2,6; 1,1; 0,2; 0,1. Quantos fatores pelo critério de Kaiser?", "b": "Dois (os de autovalor maior que 1).", "id": "C0366"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "O que é comunalidade?", "b": "A proporção da variância de uma variável original retida pelos fatores mantidos.", "id": "C0367"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Redução estrutural (objetivo): o que significa?", "b": "menos variáveis (5 → 2)", "id": "C0368"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Análise de construtos (objetivo): o que significa?", "b": "interpretar o que cada fator representa", "id": "C0369"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Rankings e índices (objetivo): o que significa?", "b": "combinar fatores em uma nota", "id": "C0370"}, {"a": "A1", "tp": "Fatorial e PCA", "s": "conceito", "f": "Fatores ortogonais (objetivo): o que significa?", "b": "entrada para modelos supervisionados, resolvendo a multicolinearidade", "id": "C0371"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "Qual a hipótese nula do qui-quadrado de associação?", "b": "As variáveis são independentes (associação aleatória).", "id": "C0372"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "Quantos graus de liberdade tem uma tabela 4×5?", "b": "(4−1)(5−1) = 12.", "id": "C0373"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "O que significa um resíduo padronizado ajustado de 2,8?", "b": "Excesso de ocorrências no cruzamento (> 1,96): associação significativa entre aquelas categorias.", "id": "C0374"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "Por que remover variáveis sem associação na ACM?", "b": "Uma variável que não se associa a nenhuma outra não tem o que mostrar no mapa e só adiciona ruído.", "id": "C0375"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "Diferença entre ANACOR e ACM?", "b": "ANACOR usa 2 variáveis categóricas; ACM usa 3 ou mais.", "id": "C0376"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "Matriz binária (indicadora) Z (método): como funciona / dimensões?", "b": "0/1 para presença de cada categoria em cada observação — J - Q (J = total de categorias; Q = nº de variáveis); inércia total = (J-Q)/Q", "id": "C0377"}, {"a": "A1", "tp": "ANACOR e ACM", "s": "conceito", "f": "Matriz de Burt B = Z'Z (método): como funciona / dimensões?", "b": "cruza todos os pares de variáveis numa única tabela e aplica a ANACOR — as mesmas", "id": "C0378"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "A correlação entre X e Y é 0,5. Qual o R² da regressão simples?", "b": "R² = 0,5² = 0,25 (25%).", "id": "C0379"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "O F é significativo e o R² é 0,08. Existe modelo?", "b": "Sim, existe modelo (ao menos uma variável explica Y), mas com baixa capacidade preditiva.", "id": "C0380"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "Uma variável qualitativa tem 5 categorias. Quantas dummies?", "b": "4; a quinta é a referência.", "id": "C0381"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "O que se espera do Shapiro-Francia dos resíduos?", "b": "Não rejeitar H0 (p > 0,05): resíduos normais.", "id": "C0382"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "Cite duas consequências da multicolinearidade?", "b": "Sinais invertidos ou instáveis nos betas, e t baixo com F significante e R² alto (erros de predição).", "id": "C0383"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "Normalidade dos resíduos (diagnóstico): o que verifica / teste e decisão?", "b": "base da inferência e dos IC — Shapiro-Francia; H0: normais; queremos p > 0,05 (não rejeitar)", "id": "C0384"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "Multicolinearidade (diagnóstico): o que verifica / teste e decisão?", "b": "alta correlação entre as explicativas — VIF = 1/Tolerance, com Tolerance = 1 - R^2_{aux}; VIF > 10 é alerta", "id": "C0385"}, {"a": "A2", "tp": "Regressão", "s": "conceito", "f": "Heterocedasticidade (diagnóstico): o que verifica / teste e decisão?", "b": "variância dos erros não constante (cone no gráfico) — Breusch-Pagan; H0: homocedasticidade; p < 0,05 → problema", "id": "C0386"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Converta p = 0,8 em chance?", "b": "0,8 ÷ 0,2 = 4 (4 para 1).", "id": "C0387"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "β = 0,7. O que significa e^β ≈ 2,01?", "b": "Cada unidade a mais de X aproximadamente dobra a chance do evento.", "id": "C0388"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Quantos logitos tem um Y com 4 categorias?", "b": "3 (M − 1), cada um contra a referência.", "id": "C0389"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Por que baixar o cutoff aumenta a sensibilidade?", "b": "Mais observações passam a ser classificadas como evento, capturando mais verdadeiros positivos (ao custo de mais falsos positivos).", "id": "C0390"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Teste χ² (razão de verossimilhança) (medida): para quê?", "b": "compara o modelo com o nulo (só intercepto); p < 5% → ao menos um β ≠ 0 (equivale ao F)", "id": "C0391"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Teste z de Wald (medida): para quê?", "b": "cada parâmetro (equivale ao t)", "id": "C0392"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Pseudo-R² de McFadden (medida): para quê?", "b": "1 - LL/LL_0; não é variância explicada", "id": "C0393"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Real 1 (): previsto 1 / previsto 0?", "b": "VP (verdadeiro positivo) — FN (falso negativo)", "id": "C0394"}, {"a": "A3", "tp": "Logística", "s": "conceito", "f": "Real 0 (): previsto 1 / previsto 0?", "b": "FP (falso positivo) — VN (verdadeiro negativo)", "id": "C0395"}, {"a": "A3", "tp": "Dados de Contagem", "s": "conceito", "f": "É uma quantidade (variável dependente quantitativa);\n2. com valores discretos (inteiros);\n3. não negativos (0, 1, 2, …);\n4. e precisa ter uma exposição definida (tempo, área, região: \"se mudar a exposição, muda a contagem\").\n\nExemplos: consultas por ano, IPOs por ano, infrações por mês, falhas de fabricação.\n\n## 2. O modelo Poisson\n\n\\[ P(Y = m) = \\frac{e^{-\\lambda}\\,\\lambda^m}{m!} \\qquad \\text{com } E[Y] = Var[Y] = \\lambda \\;\\;(\\text{equidispersão}) \\]\n\nO \\lambda é a taxa média na exposição, e é o único parâmetro. O modelo usa ligação logarítmica: \\ln(\\lambda) = \\alpha + \\beta_1 X_1 + \\cdots + \\beta_k X_k, estimado por máxima verossimilhança (smf.poisson). (†) e^{\\beta} é a razão entre taxas esperadas por unidade de X.\n\n> Exemplo resolvido. \\lambda = 3 consultas/ano. P(0) = e^{-3} \\approx 0{,}050; P(2) = \\frac{e^{-3}\\cdot 3^2}{2} \\approx 0{,}224 (22,4%). Se a exposição passa de 1 ano para 6 meses, \\lambda cai para cerca de 1,5: por isso a exposição precisa estar definida.\n\n## 3. Superdispersão e o teste de Cameron e Trivedi\n\nA superdispersão ocorre quando a variância é maior que a média (cauda longa), e a Poisson não captura valores altos. A subdispersão é o contrário. O teste de Cameron e Trivedi (1990) detecta a superdispersão em quatro passos:\n\n1. estimar o modelo Poisson;\n2. criar Y^ = \\frac{(Y - \\hat\\lambda)^2 - Y}{\\hat\\lambda};\n3. rodar uma regressão auxiliar de Y^ sobre \\hat\\lambda sem intercepto (é um teste de variância, não preditivo);\n4. olhar o β: p < 0,05 → há superdispersão; se não for significante, vale a Poisson.\n\n## 4. Binomial negativo (Poisson-Gama)\n\nQuando há superdispersão, usa-se o binomial negativo, que tem dois parâmetros e uma variância quadrática:\n\n\\[ Var[Y] = \\lambda + \\varphi\\,\\lambda^2, \\qquad \\varphi = \\frac{1}{\\theta} \\]\n\nO \\varphi é o \"alfa\" do statsmodels. Para decidir: se o alfa for significante (p < 0,05), há superdispersão e o binomial negativo é melhor; se não for, a saída é idêntica à da Poisson (o binomial negativo nunca é pior). O teste de razão de verossimilhança (LR) entre os dois também ajuda, e o modelo prevê melhor valores altos.\n\n> Exemplo resolvido. Média = 2 e variância = 10. Na Poisson a variância seria 2. No binomial negativo, 10 = 2 + \\varphi\\cdot 2^2, logo \\varphi = 2: o modelo reproduz a cauda longa que a Poisson não captura.\n\n## 5. Excesso de zeros: ZIP e ZINB\n\nQuando o evento é raro (ex.: 5.000 residências e só 4 com violência doméstica), há zeros demais. A solução combina um modelo de contagem com um modelo binário (logístico): o ZIP é logit + Poisson e o ZINB é logit + binomial negativo (Lambert, 1992). Há dois tipos de zero:\n\n| Tipo | Origem | Componente |\n|---|---|---|\n| Estrutural | o evento nunca ocorreria | binário (logit) |\n| Amostral | poderia ocorrer, mas não ocorreu no período | de contagem |\n\n\\[ P(Y=0) = p_{logit} + (1 - p_{logit})\\,P_{contagem}(0) \\qquad P(Y=m) = (1 - p_{logit})\\,P_{contagem}(m),\\; m\\geq 1 \\]\n\nO teste de Vuong (1989) diz se há inflação de zeros: se for significante, use o modelo inflacionado.\n\n> Exemplo resolvido. p_{logit} = 0{,}7 e P_{Poisson}(0) = 0{,}2 → P(Y=0) = 0{,}7 + 0{,}3\\times 0{,}2 = 0{,}76; P(Y=1) = 0{,}3\\times P_{Poisson}(1).\n\n## O que levar daqui\n\nContagem: quantidade, discreta, não negativa e com exposição. Poisson: média = variância = λ. Binomial negativo: variância = λ + φλ² (alfa = φ). Cameron-Trivedi: β da auxiliar (sem intercepto) significante → superdispersão. ZIP/ZINB: logit + contagem; Vuong detecta zeros em excesso.\n\n## Erros que todo mundo comete\n\n| Erro | Correção |\n|---|---|\n| \"Qualquer Y numérico → OLS\" | contagem pede Poisson/binomial negativo |\n| \"Poisson aceita variância maior que a média\" | exige média = variância |\n| \"O binomial negativo piora a Poisson sem superdispersão\" | com alfa não significante, equivale à Poisson |\n| \"Zeros em excesso = superdispersão\" | são problemas diferentes; ZIP/ZINB tratam zeros |\n| \"O Cameron-Trivedi usa intercepto\" | a regressão auxiliar é sem intercepto |\n| \"Zero estrutural = amostral\" | estrutural: nunca ocorreria; amostral: poderia, mas não ocorreu |\n| \"O Vuong detecta superdispersão\" | detecta inflação de zeros |\n\n## Teste-se\n\n1. Quais as 4 características de um dado de contagem?", "b": "Quantidade, valores discretos, não negativos e exposição definida.", "id": "C0396"}, {"a": "A3", "tp": "Dados de Contagem", "s": "conceito", "f": "Média = 4 e variância = 20. Qual o modelo mais adequado?", "b": "Binomial negativo (superdispersão: variância muito maior que a média).", "id": "C0397"}, {"a": "A3", "tp": "Dados de Contagem", "s": "conceito", "f": "O que o teste de Vuong detecta?", "b": "Inflação de zeros (modelo inflacionado × convencional).", "id": "C0398"}, {"a": "A3", "tp": "Dados de Contagem", "s": "conceito", "f": "Diferencie zero estrutural e zero amostral?", "b": "Estrutural: o evento nunca ocorreria (componente logit). Amostral: poderia ocorrer, mas não ocorreu naquele período (componente de contagem).", "id": "C0399"}, {"a": "A3", "tp": "Dados de Contagem", "s": "conceito", "f": "Estrutural (tipo): origem / componente?", "b": "o evento nunca ocorreria — binário (logit)", "id": "C0400"}, {"a": "A3", "tp": "Dados de Contagem", "s": "conceito", "f": "Amostral (tipo): origem / componente?", "b": "poderia ocorrer, mas não ocorreu no período — de contagem", "id": "C0401"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "Variância entre grupos = 12 e residual = 28. Qual o ICC?", "b": "12 ÷ (12 + 28) = 0,30 (30% de efeito do contexto).", "id": "C0402"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "O que \\nu_{1j} representa?", "b": "A variação da inclinação entre grupos (o efeito de X difere entre contextos).", "id": "C0403"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "Por que não usar OLS com dummies de escola?", "b": "Porque não separam efeitos observáveis dos não observáveis nem capturam a variância entre contextos.", "id": "C0404"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "Quais são os níveis de um modelo de medidas repetidas de alunos em escolas?", "b": "Tempo (nível 1) → aluno (nível 2) → escola (nível 3).", "id": "C0405"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "Efeitos fixos (γ) (componente): o que é / exemplo?", "b": "parâmetros comuns a toda a população — intercepto e inclinação \"médios\"", "id": "C0406"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "\\nu_{0j} (componente): o que é / exemplo?", "b": "variação do intercepto entre grupos — escolas com médias diferentes", "id": "C0407"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "\\nu_{1j} (componente): o que é / exemplo?", "b": "variação da inclinação entre grupos — o efeito das horas de estudo difere entre escolas", "id": "C0408"}, {"a": "A3", "tp": "Multinível", "s": "conceito", "f": "\\varepsilon_{ij} (componente): o que é / exemplo?", "b": "erro do nível 1 — variação individual do aluno", "id": "C0409"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "O que é data drift?", "b": "Mudança na distribuição dos dados (ou de Y) em produção que reduz a performance do modelo.", "id": "C0410"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Cite os 4 componentes do MLflow?", "b": "Tracking, Projects, Models e Model Registry.", "id": "C0411"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Qual a diferença entre transformação e ação no Spark?", "b": "Transformação (map, filter) é lazy e só planeja; ação (count, collect) dispara a execução e retorna valor ao driver.", "id": "C0412"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "O que são as camadas bronze, silver e gold?", "b": "Bronze: dados brutos; silver: dados limpos; gold: dados agregados e prontos para consumo.", "id": "C0413"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Tracking (componente): função?", "b": "registra experimentos: parâmetros, métricas e artefatos (autolog faz isso sozinho)", "id": "C0414"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Projects (componente): função?", "b": "padroniza o código para reprodutibilidade", "id": "C0415"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Models (componente): função?", "b": "formato unificado do modelo, com metadados, dependências e assinatura (signature): o esquema de entrada e saída", "id": "C0416"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Model Registry (componente): função?", "b": "versões e estágios (ex.: promover a versão 3 para produção e arquivar a 2)", "id": "C0417"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Velocidade (v): significado?", "b": "rapidez com que são gerados e processados", "id": "C0418"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Variedade (v): significado?", "b": "estruturados, semi e não estruturados", "id": "C0419"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Veracidade (v): significado?", "b": "confiabilidade e qualidade", "id": "C0420"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Valor (v): significado?", "b": "insights úteis", "id": "C0421"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Armazenamento (): hadoop mapreduce / apache spark?", "b": "HDFS (distribuído) — usa vários (HDFS, nuvem)", "id": "C0422"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Processamento (): hadoop mapreduce / apache spark?", "b": "paralelo, em disco — em memória, bem mais rápido", "id": "C0423"}, {"a": "P2", "tp": "Big Data e MLOps", "s": "conceito", "f": "Escala (): hadoop mapreduce / apache spark?", "b": "horizontal (adiciona servidores) — horizontal", "id": "C0424"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Qual a H0 do teste ADF e o que fazer se p = 0,40?", "b": "H0: a série não é estacionária. Com p = 0,40 não rejeita: aplique log e/ou diferenciação e teste novamente.", "id": "C0425"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Como escolher p e q em um ARIMA?", "b": "p pela PACF (corta no lag p em um AR) e q pela ACF (corta no lag q em um MA); d pelos testes de estacionariedade.", "id": "C0426"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Quando usar modelo multiplicativo?", "b": "Quando a amplitude da sazonalidade cresce junto com o nível da série.", "id": "C0427"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Reais 100 e 110; previstos 90 e 120. Quanto vale o MAE?", "b": "Erros absolutos 10 e 10 → MAE = 10.", "id": "C0428"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "O que deve acontecer com os resíduos de um bom modelo?", "b": "Ser ruído branco: média zero, variância constante e sem autocorrelação (Ljung-Box com p > 0,05).", "id": "C0429"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Tendência (T) (componente): o que é?", "b": "direção de longo prazo", "id": "C0430"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Sazonalidade (S) (componente): o que é?", "b": "padrão que se repete em período fixo (mês, semana)", "id": "C0431"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Ciclo (C) (componente): o que é?", "b": "ondas longas sem período fixo", "id": "C0432"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Erro (E) (componente): o que é?", "b": "o que sobra, imprevisível", "id": "C0433"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "SES (simples) (método): quando / parâmetros?", "b": "sem tendência e sem sazonalidade — α (0 a 1)", "id": "C0434"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Holt (método): quando / parâmetros?", "b": "com tendência — α e β", "id": "C0435"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Holt-Winters (método): quando / parâmetros?", "b": "com tendência e sazonalidade (aditivo ou multiplicativo) — α, β e γ", "id": "C0436"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "ETS (método): quando / parâmetros?", "b": "escolhe automaticamente: A (aditivo), M (multiplicativo), N (nenhum), Ad (tendência amortecida) — —", "id": "C0437"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "MAE (medida): fórmula/ideia / observação?", "b": "média dos erros absolutos — na unidade original", "id": "C0438"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "MSE (medida): fórmula/ideia / observação?", "b": "média dos erros ao quadrado — penaliza erros grandes", "id": "C0439"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "RMSE (medida): fórmula/ideia / observação?", "b": "\\sqrt{MSE} — na unidade original", "id": "C0440"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "MAPE (medida): fórmula/ideia / observação?", "b": "erro percentual absoluto médio — sem unidade; explode com valores perto de zero", "id": "C0441"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "Theil's U (medida): fórmula/ideia / observação?", "b": "ajuste da previsão — menor é melhor, zero é ideal", "id": "C0442"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "ADF (Dickey-Fuller aumentado) (teste): h0 / decisão?", "b": "a série não é estacionária (raiz unitária) — p ≤ 0,05 → estacionária; p > 0,05 → transformar", "id": "C0443"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "KPSS (teste): h0 / decisão?", "b": "a série é estacionária — hipóteses invertidas em relação ao ADF", "id": "C0444"}, {"a": "A5", "tp": "Séries Temporais", "s": "conceito", "f": "AR(p "s": "conceito", "f": "Qual a diferença entre stemming e lematização?", "b": "Stemming corta sufixos até o radical (rápido, pode gerar não-palavra); lematização leva ao lema do dicionário usando a classe gramatical (mais precisa).", "id": "C0478"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "O que é ABSA?", "b": "Análise de sentimento baseada em aspectos: atribui um sentimento a cada característica mencionada no texto.", "id": "C0479"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "Cite três abordagens para análise de sentimento?", "b": "Léxico (VADER, LeIA), ML clássico (Naive Bayes com TF-IDF) e deep learning/Transformers/LLMs.", "id": "C0480"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "Por que o sarcasmo é difícil?", "b": "Porque a polaridade aparente das palavras é oposta à intenção; léxicos e modelos simples não capturam o contexto.", "id": "C0481"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "NLP / PLN (área): o que é?", "b": "processa e entende a linguagem humana por algoritmos", "id": "C0482"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "Text mining (área): o que é?", "b": "extrai padrões e conhecimento de grandes volumes de texto", "id": "C0483"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "Análise de sentimento (AS) (área): o que é?", "b": "detecta emoções e opiniões, classificando em positivo, negativo ou neutro; computadores não sentem, identificam padrões", "id": "C0484"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "LLM (área): o que é?", "b": "modelo treinado em grandes volumes de texto para gerar e compreender linguagem (prevê a próxima palavra)", "id": "C0485"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "Minúsculas (etapa): o que faz / resultado?", "b": "padroniza a caixa — \"eu amo ds!\"", "id": "C0486"}, {"a": "A5", "tp": "Text Mining / NLP", "s": "conceito", "f": "Remoção de pontuação (e acentos, se for o  problema tratando as variáveis como contínuas (isso dá um limite superior para o ótimo inteiro).\n2. Ramificação (branching): se L = 5{,}7, criam-se dois subproblemas, L \\leq 5 e L \\geq 6, e resolve-se cada um.\n3. Limitação (bounding): toda solução inteira encontrada é candidata; ramos que não podem superar a melhor candidata são podados.\n\n> Exemplo resolvido. No exemplo dos livros a solução relaxada já é (5, 5), inteira: não é preciso ramificar. Em outro caso hipotético, o subproblema L \\leq 5 dá (5, 5) com Q = 65 e o L \\geq 6 dá (6, 4) com Q = 64; a melhor candidata, 65, vence.\n\nOutro exemplo é a nova ala hospitalar: variáveis q_1, q_2, q_3 (quartos de 1, 2 e 3 leitos); maximizar a receita R = 7500q_1 + 6000q_2 + 4500q_3 com restrições de área (10q_1 + 15q_2 + 18q_3 \\leq 1200), de capacidade (q_1 + q_2 + q_3 \\leq 70), de limite de individuais (q_1 \\leq 30), de mínimo de leitos (q_1 + 2q_2 + 3q_3 \\geq 120) e de domínio (inteiros ≥ 0).\n\n## 4. Modelos mistos e os padrões de modelagem\n\nNo PLIM há variáveis contínuas, inteiras e binárias. O exemplo da aula é um problema de transporte e transbordo com ativação de terminais: dois centros (CD1 com 40 t e CD2 com 60 t) abastecem três lojas (30, 35 e 25 t), com a possibilidade de passar por dois terminais de transbordo (T1 e T2), de capacidade 50 t e custo fixo de ativação de $ 10 cada. Além disso, o trecho CD2 → L2 só pode ser feito em caminhões de 7 t. Os padrões para traduzir cada regra são:\n\n| Regra do problema | Como modelar |\n|---|---|\n| Oferta de um centro | soma do que sai ≤ oferta |\n| Demanda de uma loja | soma do que chega = demanda |\n| Conservação de fluxo no terminal | tudo que entra = tudo que sai |\n| Decisão sim/não (ativar um terminal) | variável binária y (0 ou 1) |\n| Custo fixo | somar 10\\,y na função objetivo |\n| Capacidade só se ativado | \\text{entrada no terminal} \\leq 50\\,y (com y=0, nada passa; com y=1, até 50 t) |\n| Quantidade em lotes (caminhões de 7 t) | x = 7k com k inteiro |\n\n> Exemplo resolvido (lote). Se x_{CD2,L2} = 7k, os valores possíveis são 0, 7, 14, 21, 28 e 35. No ótimo da aula, k = 3 e x_{CD2,L2} = 21.\n\nO ótimo do exemplo com terminais custou cerca de 330, com os dois terminais ativados.\n\n## O que levar daqui\n\nPO transforma problemas em modelos com variáveis, objetivo e restrições. PL só tem equações lineares; o Simplex acha o ótimo andando pelos vértices. Para variáveis inteiras usa-se Branch-and-Bound (relaxar, ramificar, limitar, podar). No modelo misto, decisão sim/não vira binária; custo fixo entra multiplicado pela binária; capacidade condicionada vira x \\leq \\text{Cap}\\cdot y; lotes viram x = \\text{lote}\\cdot k.\n\n## Erros que todo mundo comete\n\n| Erro | Correção |\n|---|---|\n| \"O ótimo está dentro da região\" | em PL, está num vértice |\n| \"O Simplex testa todos os vértices\" | caminha e para quando nada melhora |\n| \"Branch-and-Bound sempre ramifica\" | se a relaxada já é inteira, não ramifica |\n| \"Variável binária = inteira qualquer\" | só pode ser 0 ou 1 |\n| Esquecer a conservação de fluxo no terminal | entrada = saída |\n| Definir restrições antes do objetivo | defina o objetivo primeiro |\n\n## Teste-se\n\n1. Quais os três componentes de um modelo de otimização?", "b": "Variáveis de decisão, função objetivo e restrições.", "id": "C0495"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Como modelar \"um terminal só pode receber carga se estiver ativado, com capacidade de 50 t\"?", "b": "Com uma binária y: entrada no terminal ≤ 50·y.", "id": "C0496"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Como representar um trecho que só aceita caminhões de 7 t?", "b": "x = 7k, com k inteiro não negativo.", "id": "C0497"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "O que é a solução relaxada no Branch-and-Bound?", "b": "A solução do problema tratando as variáveis inteiras como contínuas; dá um limite superior (em maximização) para o ótimo inteiro.", "id": "C0498"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Variáveis de decisão (peça): pergunta / exemplo (caixas de livros)?", "b": "o que posso escolher? — L = caixas leves, M = caixas mistas", "id": "C0499"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Função objetivo (peça): pergunta / exemplo (caixas de livros)?", "b": "o que quero maximizar ou minimizar? — maximizar Q = 6L + 7M (livros entregues)", "id": "C0500"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Restrições (peça): pergunta / exemplo (caixas de livros)?", "b": "quais limites existem? (sempre comparam duas quantidades mensuráveis) — L + M \\leq 10; 6L + 2M \\geq 40", "id": "C0501"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Oferta de um centro (regra do problema): como modelar?", "b": "soma do que sai ≤ oferta", "id": "C0502"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Demanda de uma loja (regra do problema): como modelar?", "b": "soma do que chega = demanda", "id": "C0503"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Conservação de fluxo no terminal (regra do problema): como modelar?", "b": "tudo que entra = tudo que sai", "id": "C0504"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Decisão sim/não (ativar um terminal) (regra do problema): como modelar?", "b": "variável binária y (0 ou 1)", "id": "C0505"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Custo fixo (regra do problema): como modelar?", "b": "somar 10\\,y na função objetivo", "id": "C0506"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Capacidade só se ativado (regra do problema): como modelar?", "b": "\\text{entrada no terminal} \\leq 50\\,y (com y=0, nada passa; com y=1, até 50 t)", "id": "C0507"}, {"a": "A5", "tp": "Pesquisa Operacional", "s": "conceito", "f": "Quantidade em lotes (caminhões de 7 t) (regra do problema): como modelar?", "b": "x = 7k com k inteiro", "id": "C0508"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Para que serve o OOB no bagging?", "b": "As ~37% de observações que ficam fora de cada bootstrap servem como validação embutida, sem separar dados.", "id": "C0509"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Quando priorizar recall em vez de precisão?", "b": "Quando perder um positivo real é grave (doença, fraude) e o falso alarme é aceitável.", "id": "C0510"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Qual a diferença entre hard e soft voting?", "b": "Hard voting usa a classe mais votada; soft voting faz a média das probabilidades de cada modelo.", "id": "C0511"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "O que a regularização L1 faz no XGBoost?", "b": "Penaliza a soma dos valores absolutos dos pesos das folhas, podendo zerar contribuições e simplificar o modelo.", "id": "C0512"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Raiz (nó): papel?", "b": "ponto de partida: o conjunto de dados completo", "id": "C0513"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Internos (nó): papel?", "b": "perguntas sobre as características", "id": "C0514"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Folhas (nó): papel?", "b": "resultado final", "id": "C0515"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "A folha devolve (): classificação / regressão?", "b": "a classe mais frequente — a média dos valores que caíram nela", "id": "C0516"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Melhor divisão (): classificação / regressão?", "b": "a que reduz a impureza dos grupos — a que reduz o erro (critério padrão: squared error)", "id": "C0517"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Acurácia (métrica): pergunta / importa quando?", "b": "quanto acertou no total? — classes equilibradas (enganosa em bases desbalanceadas)", "id": "C0518"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Precisão (métrica): pergunta / importa quando?", "b": "quando diz \"positivo\", quanto confio? — o falso alarme é caro", "id": "C0519"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Recall (sensibilidade) (métrica): pergunta / importa quando?", "b": "quantos positivos reais encontrou? — perder um positivo é grave (doença, fraude)", "id": "C0520"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "MAE (métrica): característica?", "b": "erro médio absoluto; mesma unidade; robusto a outliers", "id": "C0521"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "MSE (métrica): característica?", "b": "erro quadrático médio; penaliza erros grandes", "id": "C0522"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "RMSE (métrica): característica?", "b": "raiz do MSE; mesma unidade", "id": "C0523"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Voting / averaging (técnica): como funciona / efeito?", "b": "modelos diferentes votam: hard voting = classe mais votada; soft voting = média das probabilidades; em regressão, média — simples", "id": "C0524"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Bagging (técnica): como funciona / efeito?", "b": "modelos do mesmo tipo, em paralelo, cada um em uma amostra bootstrap (com reposição); agrega por voto ou média — reduz variância", "id": "C0525"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Boosting (técnica): como funciona / efeito?", "b": "modelos em sequência; cada um foca nos erros (resíduos) do anterior — reduz viés", "id": "C0526"}, {"a": "A4", "tp": "Árvores e Ensemble", "s": "conceito", "f": "Stacking (técnica): como funciona / efeito?", "b": "um meta-modelo aprende a combinar as previsões dos modelos-base (usa previsões out-of-fold para evitar vazamento) — combina modelos diferentes", "id": "C0527"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Por que a rede neural é chamada de \"função aproximadora\"?", "b": "Porque aproxima uma função desconhecida do fenômeno real; o teorema da aproximação universal garante que uma rede suficientemente larga aproxima qualquer função contínua.", "id": "C0528"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Qual a fórmula do gradient descent e o papel do learning rate?", "b": "W ← W − η∇J(W). O learning rate (η) define o tamanho do passo: grande demais oscila; pequeno demais é lento.", "id": "C0529"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Qual loss usar para classificação binária e qual para multiclasse com rótulo inteiro?", "b": "Binária: BCE (com sigmoid). Multiclasse com rótulo inteiro: SCCE (com softmax).", "id": "C0530"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Diferença entre LSTM e Transformer?", "b": "LSTM é sequencial, linear em N e esquece o longo prazo; o Transformer paraleliza no treino e conecta todos os pares, ao custo quadrático em N.", "id": "C0531"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Features (): ml tradicional / deep learning?", "b": "feitas à mão (feature engineering): limitadas e pouco escaláveis — aprendidas pela rede (representation learning)", "id": "C0532"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Hierarquia (): ml tradicional / deep learning?", "b": "— — baixo nível (bordas) → médio (olho, boca) → alto (rosto)", "id": "C0533"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Ponto fraco (): ml tradicional / deep learning?", "b": "depende do especialista — interpretabilidade; em dados tabulares pequenos o ML clássico costuma ser mais eficiente", "id": "C0534"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "imagem em cinza / RGB (rank): nome / shape de exemplo?", "b": "— (H, W, 1) / (H, W, 3); dataset: (N, H, W, ·)", "id": "C0535"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Sigmoid \\frac{1}{1+e^{-z}} (ativação): característica / uso?", "b": "comprime em (0, 1); satura nas pontas (gradiente quase zero) — saída binária", "id": "C0536"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "ReLU \\max(0, z) (ativação): característica / uso?", "b": "barata; não satura para z > 0 — padrão nas camadas ocultas", "id": "C0537"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Softmax (ativação): característica / uso?", "b": "transforma logits em distribuição de probabilidade que soma 1 — saída multiclasse", "id": "C0538"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "MAE / MSE (loss): quando / fórmula/ideia?", "b": "regressão — erro médio absoluto ou quadrático", "id": "C0539"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "BCE (binary cross entropy) (loss): quando / fórmula/ideia?", "b": "classificação binária (1 neurônio + sigmoid) — -[y\\log\\hat{y} + (1-y)\\log(1-\\hat{y})]", "id": "C0540"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "CCE (categorical) (loss): quando / fórmula/ideia?", "b": "multiclasse com rótulo em one-hot + softmax — -\\sum y_i\\log\\hat{y}_i", "id": "C0541"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "SCCE (sparse) (loss): quando / fórmula/ideia?", "b": "multiclasse com rótulo como inteiro — -\\log\\hat{y}_{[y]} (mesmo valor da CCE)", "id": "C0542"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "One-hot (encoding): quando?", "b": "categorias sem ordem", "id": "C0543"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Ordinal (encoding): quando?", "b": "ordem genuína (Likert, escolaridade)", "id": "C0544"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Embedding (encoding): quando?", "b": "alta cardinalidade", "id": "C0545"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "MinMax (scaler): característica?", "b": "[0, 1]; sensível a outliers", "id": "C0546"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Standard (scaler): característica?", "b": "média 0 e desvio 1 (dados ~normais)", "id": "C0547"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Robust (scaler): característica?", "b": "mediana e IQR; resistente a outliers", "id": "C0548"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Padding 'valid' (conceito): o que faz / exemplo?", "b": "não preenche as bordas; a saída diminui — entrada 5×5, kernel 3×3 → 3×3", "id": "C0549"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Padding 'same' (conceito): o que faz / exemplo?", "b": "preenche; a saída mantém a resolução — 5×5 → 5×5", "id": "C0550"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Stride (2,2) (conceito): o que faz / exemplo?", "b": "passo maior; reduz a resolução — 5×5, same → 3×3", "id": "C0551"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "MaxPooling2D (conceito): o que faz / exemplo?", "b": "maior valor de cada janela; sem parâmetros treináveis — (4,4,1) com janela 2×2 → (2,2,1)", "id": "C0552"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Complexidade (): lstm / transformer?", "b": "linear, O(N) — quadrática, O(N^2)", "id": "C0553"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Treino (): lstm / transformer?", "b": "sequencial (não paraleliza) — paralelo", "id": "C0554"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Relações de longo prazo (): lstm / transformer?", "b": "limitadas (esquece) — todos os pares conectados", "id": "C0555"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Dados exigidos (): lstm / transformer?", "b": "poucos/médios — muitos", "id": "C0556"}, {"a": "A4", "tp": "Deep Learning", "s": "conceito", "f": "Usos (): lstm / transformer?", "b": "séries temporais, IoT, áudio de baixa latência — LLMs, tradução", "id": "C0557"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "O que significa dizer que o HTTP é stateless?", "b": "Cada requisição é isolada e precisa trazer todas as informações para ser processada.", "id": "C0558"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Qual temperatura usar para extrair dados em JSON?", "b": "Baixa (0 a 0,2), para ter respostas consistentes e determinísticas.", "id": "C0559"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Quais as etapas do RAG?", "b": "Ingestão (limpeza, chunking, embeddings, banco vetorial) e consulta (embedding da pergunta, busca Top-K, prompt aumentado, geração ancorada).", "id": "C0560"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Quando usar RAG em vez de fine-tuning?", "b": "Para conhecimento factual e dados que mudam, com necessidade de auditar a fonte e custo menor; fine-tuning serve a estilo e comportamento.", "id": "C0561"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "GET (método): uso?", "b": "consulta e leitura (não altera estado)", "id": "C0562"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "POST (método): uso?", "b": "envio de dados complexos para inferência ou criação de registros", "id": "C0563"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "PUT / PATCH / DELETE (método): uso?", "b": "atualização total, parcial e remoção (REST)", "id": "C0564"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Token (conceito): o que é?", "b": "fragmento de palavra (~4 caracteres em inglês); base de tarifação e limites", "id": "C0565"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Janela de contexto (conceito): o que é?", "b": "máximo de tokens (entrada + saída) vistos de uma vez", "id": "C0566"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Temperatura baixa (0–0,2) (conceito): o que é?", "b": "determinismo; indicada para extração de dados, JSON e RAG", "id": "C0567"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Temperatura alta (0,7–1,0) (conceito): o que é?", "b": "variabilidade e criatividade; brainstorming", "id": "C0568"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Top-P (nucleus sampling) (conceito): o que é?", "b": "restringe a escolha aos tokens mais prováveis", "id": "C0569"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Alucinação (conceito): o que é?", "b": "informação incorreta apresentada de forma plausível", "id": "C0570"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Como busca (): busca léxica / busca semântica (vetorial)?", "b": "correspondência exata de caracteres (BM25, SQL LIKE) — significado contextual", "id": "C0571"}, {"a": "P2", "tp": "APIs e LLMs", "s": "conceito", "f": "Fraqueza (): busca léxica / busca semântica (vetorial)?", "b": "falha com sinônimos e erros de digitação — exige embeddings e índice vetorial", "id": "C0572"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Diferencie mudança e transição?", "b": "Mudança é um evento externo, planejável e visível; transição é o processo psicológico interno (identidade, emoções), com ritmo próprio.", "id": "C0573"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Quais as três fases da transição de Bridges?", "b": "Ending (fim/perda), zona neutra e novo começo.", "id": "C0574"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Cite os 8 passos de Kotter?", "b": "Urgência, equipe-guia, visão, comunicação, empowerment, vitórias de curto prazo, persistir e fazer a mudança perdurar.", "id": "C0575"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "O que é o paradoxo da McKinsey citado na aula?", "b": "88% das empresas usam IA, mas só 37% relatam impacto real no lucro (EBIT).", "id": "C0576"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Andrew Ng (autor): visão?", "b": "a IA tende a transformar tarefas, não a eliminar o profissional", "id": "C0577"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Geoffrey Hinton (autor): visão?", "b": "preocupação com sistemas difíceis de controlar e com o impacto no trabalho", "id": "C0578"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Fei-Fei Li (autor): visão?", "b": "IA centrada no ser humano", "id": "C0579"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Sam Altman (autor): visão?", "b": "avançar rápido aprendendo no caminho (o paradoxo: aceleração exige cuidado)", "id": "C0580"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "acontece fora das pessoas (mudança): transição?", "b": "acontece dentro das pessoas", "id": "C0581"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "pode ser planejada (mudança): transição?", "b": "precisa ser vivenciada", "id": "C0582"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "é visível (mudança): transição?", "b": "muitas vezes invisível", "id": "C0583"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "envolve estrutura, tecnologia, processos (mudança): transição?", "b": "envolve identidade e emoções", "id": "C0584"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "pode ser rápida (mudança): transição?", "b": "tem ritmo próprio", "id": "C0585"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "é imposta ou decidida (mudança): transição?", "b": "precisa ser assimilada", "id": "C0586"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Estratégia (dimensão): ideia?", "b": "inicia ou provoca a mudança (fusão, nova tecnologia); depende da capacidade da empresa de mudar", "id": "C0587"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Estrutura (dimensão): ideia?", "b": "papéis, autoridade e segmentação; a IA redefine funções e elimina tarefas", "id": "C0588"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Sistemas (dimensão): ideia?", "b": "controlam o fluxo de informação e apoiam decisões; o big data amplia as variáveis", "id": "C0589"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Cultura (dimensão): ideia?", "b": "valores compartilhados e praticados; a parte mais estável e difícil de mudar; com a IA, migra do controle para a experimentação", "id": "C0590"}, {"a": "P2", "tp": "Gestão da Mudança", "s": "conceito", "f": "Estilo de gestão (dimensão): ideia?", "b": "os líderes são a alavanca da mudança", "id": "C0591"}], "plan": {"intro": "", "days": [], "mapa": [], "logistica": []}};

const LS={get(k,d){try{const v=localStorage.getItem('pf:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('pf:'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AREA=D.areas; let tab=LS.get('tab','sim');
function rng(seed){let a=0;for(const c of String(seed))a=(a*31+c.charCodeAt(0))>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const QB={};D.bank.forEach(q=>QB[q.id]=q);D.p2.forEach(s=>s.qs.forEach(q=>QB[q.id]=q));
function nav(){const T=[['cards','Flashcards'],['sim','Simulados'],['rev','Revisão de erros'],['desemp','Desempenho']];$('#nav').innerHTML=T.map(([k,l])=>'<button class="'+(tab===k?'on':'')+'" data-t="'+k+'">'+l+'</button>').join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;LS.set('tab',tab);run=null;render()})}
let run=null,fc=null;
function render(){nav();({plano,cards,sim,rev,desemp})[tab]()}
/* ---------- PLANO */
function plano(){const done=LS.get('plan',{});let tot=0,n=0;D.plan.days.forEach(d=>d.blocos.forEach(b=>b.itens.forEach(it=>{tot++;if(done[it.id])n++})));
 let h='<h1>Plano de estudos</h1><p class="mut">'+esc(D.plan.intro)+'</p><div class="card"><div class="row"><b>Progresso</b><span class="mut">'+n+' de '+tot+' itens</span></div><div class="bar"><i style="width:'+Math.round(100*n/tot)+'%"></i></div></div>';
 D.plan.days.forEach(d=>{h+='<div class="day"><h2>'+esc(d.titulo)+' <span class="mut">· '+esc(d.horas)+'</span></h2>';d.blocos.forEach(b=>{h+='<div class="card"><h3>'+esc(b.titulo)+' <span class="mut">· '+esc(b.tempo)+'</span></h3>';b.itens.forEach(it=>{h+='<label class="ck'+(done[it.id]?' done':'')+'"><input type="checkbox" data-id="'+it.id+'" '+(done[it.id]?'checked':'')+'><span>'+it.t+'</span></label>'});if(b.dica)h+='<div class="exp">💡 '+b.dica+'</div>';h+='</div>'});h+='</div>'});
 h+='<h2>Mapa de tópicos</h2><div class="card"><table><tr><th>Prova</th><th>Área e tópicos</th><th>Capítulos</th><th>Questões</th></tr>'+D.plan.mapa.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+'</table></div>';
 h+='<h2>Formato</h2><div class="card">'+D.plan.logistica.map(x=>'<p>• '+x+'</p>').join('')+'</div>';
 main.innerHTML=h;main.querySelectorAll('input[data-id]').forEach(c=>c.onchange=()=>{const d=LS.get('plan',{});d[c.dataset.id]=c.checked;LS.set('plan',d);plano()})}
/* ---------- FLASHCARDS */
function cards(){const f=LS.get('cf',{a:'todas',s:'todas',st:'pend'});const st=LS.get('cs',{});
 let pool=D.cards.filter(c=>(f.a==='todas'||c.a===f.a)&&(f.s==='todas'||c.s===f.s)&&(f.st==='todos'||(f.st==='pend'?st[c.id]!=='ok':st[c.id]==='no')));
 const all=D.cards.filter(c=>(f.a==='todas'||c.a===f.a)&&(f.s==='todas'||c.s===f.s));const ok=all.filter(c=>st[c.id]==='ok').length;
 if(!fc||!pool.find(c=>c.id===fc.id)){fc=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;LS.set('flip',false)}
 const flip=LS.get('flip',false);
 const sel=(id,opts,val)=>'<select id="'+id+'">'+opts.map(([v,l])=>'<option value="'+v+'"'+(v===val?' selected':'')+'>'+l+'</option>').join('')+'</select>';
 let h='<h1>Flashcards</h1><div class="row">'+sel('fa',[['todas','Todas as áreas'],...Object.entries(AREA).map(([k,v])=>[k,k+' · '+v])],f.a)+sel('fs',[['todas','Todas as fontes'],['original','Questões originais'],['conceito','Conceitos dos resumos']],f.s)+sel('fst',[['pend','Ainda não domino'],['no','Só os que errei'],['todos','Todos']],f.st)+'</div>';
 h+='<div class="mut" style="margin:10px 0">'+ok+' de '+all.length+' dominados · '+pool.length+' no filtro</div><div class="bar"><i style="width:'+(all.length?100*ok/all.length:0)+'%"></i></div>';
 if(!fc)h+='<div class="card">Nada neste filtro. 🎉</div>';else{h+='<div class="card fc'+(flip?' back':'')+'" id="fcc"><div>'+(flip?esc(fc.b):'<div class="mut" style="font-size:.8rem;margin-bottom:8px">'+esc(AREA[fc.a]||'')+' · '+esc(fc.tp)+'</div>'+esc(fc.f))+'</div></div><div class="row">'+(flip?'<button class="btn bad" id="no">Errei</button><button class="btn ok" id="yes">Sei</button>':'<button class="btn" id="show">Mostrar resposta</button>')+'<button class="btn g" id="skip">Pular</button></div><p class="mut">Atalhos: espaço vira a carta; S = sei; N = errei.</p>'}
 main.innerHTML=h;const set=(k,v)=>{const x=LS.get('cf',{a:'todas',s:'todas',st:'pend'});x[k]=v;LS.set('cf',x);fc=null;cards()};
 $('#fa').onchange=e=>set('a',e.target.value);$('#fs').onchange=e=>set('s',e.target.value);$('#fst').onchange=e=>set('st',e.target.value);
 if(fc){const turn=()=>{LS.set('flip',!LS.get('flip',false));cards()};$('#fcc').onclick=turn;const sh=$('#show');if(sh)sh.onclick=turn;const mark=v=>{const s=LS.get('cs',{});s[fc.id]=v;LS.set('cs',s);fc=null;LS.set('flip',false);cards()};const y=$('#yes'),n=$('#no');if(y)y.onclick=()=>mark('ok');if(n)n.onclick=()=>mark('no');$('#skip').onclick=()=>{fc=null;LS.set('flip',false);cards()}}}
document.addEventListener('keydown',e=>{if(tab!=='cards'||!fc||/INPUT|SELECT/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();LS.set('flip',!LS.get('flip',false));cards()}else if(LS.get('flip',false)&&(e.key==='s'||e.key==='n')){const s=LS.get('cs',{});s[fc.id]=e.key==='s'?'ok':'no';LS.set('cs',s);fc=null;LS.set('flip',false);cards()}});
/* ---------- SIMULADOS */
function setsList(){const L=[];D.p1.forEach((s,i)=>L.push({k:'p1-'+i,t:'P1 · Conhecimentos #'+(i+1),n:10,ids:s,kind:'p1'}));D.p2.forEach((s,i)=>L.push({k:'p2-'+i,t:'P2 · Interpretação #'+(i+1)+(s.titulo?' · '+s.titulo:''),n:5,ids:s.qs.map(q=>q.id),kind:'p2',passage:s}));return L}
function sim(){if(run)return runView();const hist=LS.get('hist',[]);const L=setsList();
 let h='<h1>Simulados</h1><p class="mut">Simulados de múltipla escolha: bloco de conhecimentos (10 questões, 2 de cada área técnica) e bloco de interpretação de texto (5 questões).</p>';
 h+='<div class="card"><h3>Simulado completo (15 questões)</h3><div class="row">'+'<select id="cp1">'+D.p1.map((_,i)=>'<option value="'+i+'">P1 #'+(i+1)+'</option>').join('')+'</select><select id="cp2">'+D.p2.map((s,i)=>'<option value="'+i+'">P2 #'+(i+1)+'</option>').join('')+'</select><button class="btn" id="goc">Iniciar simulado completo</button></div></div>';
 h+='<div class="card"><h3>Por simulado</h3><table><tr><th>Simulado</th><th>Melhor nota</th><th></th></tr>'+L.map(s=>{const hs=hist.filter(x=>x.parts&&x.parts.includes(s.k));const best=hs.length?Math.max(...hs.map(x=>x.byset&&x.byset[s.k]!=null?x.byset[s.k]:0)):null;return'<tr><td>'+esc(s.t)+'</td><td>'+(best==null?'—':best+'/'+s.n)+'</td><td><button class="btn g" data-k="'+s.k+'">Fazer</button></td></tr>'}).join('')+'</table></div>';
 main.innerHTML=h;main.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>start([L.find(s=>s.k===b.dataset.k)]));$('#goc').onclick=()=>start([L.find(s=>s.k==='p1-'+$('#cp1').value),L.find(s=>s.k==='p2-'+$('#cp2').value)])}
function start(sets,custom){run={sets:sets,custom:custom||null,ans:{},t0:Date.now(),done:false};runView()}
function qList(){return run.custom?run.custom.map(id=>({q:QB[id],set:null})):run.sets.flatMap(s=>s.ids.map(id=>({q:QB[id],set:s})))}
function optsOf(q){return shuffled([q.c,...q.d],q.id).map(t=>({t,ok:t===q.c}))}
function cardHtml(q,i){const o=optsOf(q);const a=run.ans[q.id];const rev=run.done||a!==undefined;const dx=q.dx||[];let di=0;
 const body=o.map((x,j)=>{let cls='',why='';if(rev){if(x.ok){cls=' ok';why='<div class="why">✅ <b>Correta.</b> '+esc(q.e||'')+'</div>'}else{const mine=a===x.t;if(mine)cls=' bad';const r=q.dx&&q.dx[x.t];why='<div class="why">'+(mine?'❌ <b>Sua resposta — incorreta.</b> ':'✖ <b>Incorreta.</b> ')+(r?esc(r):'Não responde ao enunciado: a alternativa correta é «'+esc(q.c)+'».')+'</div>'}}
  return'<label class="opt'+cls+'"><input type="radio" name="q'+i+'" '+(a===x.t?'checked':'')+(rev?' disabled':'')+' data-q="'+q.id+'" data-t="'+j+'">'+esc(x.t)+why+'</label>'}).join('');
 const head=rev?(a===undefined?'<div class="exp">⚪ Em branco.</div>':(a===q.c?'<div class="exp" style="color:var(--ok)"><b>✅ Você acertou!</b></div>':'<div class="exp" style="color:var(--bad)"><b>❌ Você errou.</b> A correta está em verde.</div>')):'';
 return'<div class="card" id="qc'+i+'" data-i="'+i+'"><div class="row"><b>Questão '+(i+1)+'</b><span class="tag">'+esc(q.a)+'</span><span class="mut">'+esc(q.tp)+'</span></div><div class="q" style="margin:8px 0">'+esc(q.s)+'</div>'+body+head+'</div>'}
function bindQ(root,L){root.querySelectorAll('input[type=radio]:not([disabled])').forEach(r=>r.onchange=()=>{const q=QB[r.dataset.q];run.ans[q.id]=optsOf(q)[+r.dataset.t].t;const card=r.closest('.card');const i=+card.dataset.i;const y=window.scrollY;card.outerHTML=cardHtml(q,i);bindQ($('#qc'+i).parentNode,L);window.scrollTo(0,y);const cnt=$('#cnt');if(cnt)cnt.textContent=Object.keys(run.ans).length+' / '+L.length+' respondidas'})}
function runView(){const L=qList();let h='<div class="row"><h1 class="sp">'+(run.custom?'Revisão de erros':esc(run.sets.map(s=>s.t).join(' + ')))+'</h1><span class="mut" id="cnt"></span><span class="mut" id="tm" style="margin-left:10px"></span></div>';let lastSet=null,n=0;
 L.forEach(({q,set},i)=>{if(set&&set!==lastSet){h+='<h2>'+(set.kind==='p1'?'Bloco de conhecimentos':'Bloco de interpretação')+'</h2>';if(set.kind==='p2'&&set.passage.texto)h+='<h3>'+esc(set.passage.titulo)+'</h3><div class="pass">'+esc(set.passage.texto)+'</div>';lastSet=set}
  n++;h+=cardHtml(q,i)});
 if(!run.done)h+='<div class="row"><button class="btn" id="fin">Finalizar e corrigir</button><button class="btn g" id="can">Cancelar</button></div>';
 else{const r=score(L);h+=resultView(r)+'<div class="row"><button class="btn" id="again">Voltar aos simulados</button></div>'}
 main.innerHTML=h;
 bindQ(main,L);
 const f=$('#fin');if(f)f.onclick=()=>{run.done=true;run.t1=Date.now();finish(L);runView();window.scrollTo(0,0)};const c=$('#can');if(c)c.onclick=()=>{run=null;render()};const g=$('#again');if(g)g.onclick=()=>{run=null;render()};
 const tm=$('#tm');if(tm&&!run.done){const id=setInterval(()=>{if(!run||run.done||!$('#tm')){clearInterval(id);return}const s=Math.floor((Date.now()-run.t0)/1000);$('#tm').textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}}
function score(L){const by={};let ok=0;L.forEach(({q})=>{by[q.a]=by[q.a]||{n:0,ok:0};by[q.a].n++;if(run.ans[q.id]===q.c){by[q.a].ok++;ok++}});return{ok,n:L.length,by}}
function resultView(r){return'<div class="card"><h2>Resultado: '+r.ok+' / '+r.n+' ('+Math.round(100*r.ok/r.n)+'%)</h2><table><tr><th>Área</th><th>Acertos</th></tr>'+Object.entries(r.by).map(([k,v])=>'<tr><td>'+esc(k+' · '+(AREA[k]||''))+'</td><td>'+v.ok+' / '+v.n+'</td></tr>').join('')+'</table></div>'}
function finish(L){const r=score(L);const wrong=LS.get('wrong',[]);L.forEach(({q})=>{const i=wrong.indexOf(q.id);if(run.ans[q.id]===q.c){if(i>=0&&run.custom)wrong.splice(i,1)}else if(i<0)wrong.push(q.id)});LS.set('wrong',wrong);
 const byset={};run.sets.forEach(s=>{const ids=s.ids||[];byset[s.k]=ids.filter(id=>run.ans[id]===QB[id].c).length});
 const h=LS.get('hist',[]);h.push({d:new Date().toISOString(),t:(run.custom?'Revisão':run.sets.map(s=>s.t).join(' + ')),ok:r.ok,n:r.n,by:r.by,parts:run.sets.map(s=>s.k),byset,secs:Math.floor((run.t1-run.t0)/1000)});LS.set('hist',h)}
/* ---------- REVISÃO */
function rev(){if(run)return runView();const w=LS.get('wrong',[]).filter(id=>QB[id]);let h='<h1>Revisão de erros</h1>';if(!w.length)h+='<div class="card">Nenhum erro guardado. Faça um simulado primeiro.</div>';else{h+='<div class="card"><div class="row"><b>'+w.length+' questões erradas</b><span class="sp"></span><button class="btn" id="pr">Refazer todas</button><button class="btn g" id="cl">Limpar lista</button></div></div>';const by={};w.forEach(id=>{const a=QB[id].a;by[a]=(by[a]||0)+1});h+='<div class="card">'+Object.entries(by).map(([k,v])=>'<span class="tag">'+k+': '+v+'</span>').join('')+'</div>'}
 main.innerHTML=h;const p=$('#pr');if(p)p.onclick=()=>start([],shuffled(w,String(Date.now())));const c=$('#cl');if(c)c.onclick=()=>{LS.set('wrong',[]);rev()}}
/* ---------- DESEMPENHO */
function desemp(){const h=LS.get('hist',[]);let s='<h1>Desempenho</h1>';if(!h.length)s+='<div class="card">Sem simulados feitos ainda.</div>';else{const agg={};h.forEach(x=>Object.entries(x.by||{}).forEach(([k,v])=>{agg[k]=agg[k]||{n:0,ok:0};agg[k].n+=v.n;agg[k].ok+=v.ok}));
 s+='<div class="card"><h3>Acertos por área (todos os simulados)</h3><table><tr><th>Área</th><th>Acertos</th><th>%</th></tr>'+Object.entries(agg).sort().map(([k,v])=>'<tr><td>'+esc(k+' · '+(AREA[k]||''))+'</td><td>'+v.ok+'/'+v.n+'</td><td>'+Math.round(100*v.ok/v.n)+'%</td></tr>').join('')+'</table><p class="mut">Priorize as áreas com menor percentual.</p></div>';
 s+='<div class="card"><h3>Histórico</h3><table><tr><th>Quando</th><th>Simulado</th><th>Nota</th><th>Tempo</th></tr>'+h.slice().reverse().map(x=>'<tr><td>'+new Date(x.d).toLocaleString('pt-BR')+'</td><td>'+esc(x.t)+'</td><td>'+x.ok+'/'+x.n+'</td><td>'+Math.floor((x.secs||0)/60)+' min</td></tr>').join('')+'</table></div>'}
 main.innerHTML=s}
render();
</script>
