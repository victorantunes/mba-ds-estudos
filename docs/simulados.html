<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulados e flashcards · MBA Data Science e Analytics</title>
<style>
:root{--bg:#f6f6f3;--fg:#1c2230;--mut:#667085;--card:#fff;--bd:#e3e6ec;--ac:#2f5bea;--ac2:#e8eeff;--ok:#12805c;--bad:#c2410c;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--fg:#e6e9f0;--mut:#98a2b3;--card:#171b25;--bd:#2a3040;--ac:#7c9cff;--ac2:#1c2540;--ok:#4ade9d;--bad:#fb923c;--warn:#fdb022}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:1rem}nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--bd);color:var(--fg);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;margin:.2em 0 .4em}h2{font-size:1.2rem;margin:1.4em 0 .4em}h3{font-size:1.02rem;margin:1.1em 0 .3em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:15px}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
select,input[type=number]{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-right:6px}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.12rem;cursor:pointer;white-space:pre-wrap;user-select:none}
.fc.back{text-align:left;justify-content:flex-start;font-size:1.02rem}
.q{white-space:pre-wrap}.opt{display:block;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-right:8px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.pass{background:var(--ac2);border-left:4px solid var(--ac);padding:12px 16px;border-radius:0 10px 10px 0;white-space:pre-wrap}
.why{font-size:.88rem;color:var(--mut);margin-top:6px;padding-top:6px;border-top:1px dashed var(--bd)}.opt.ok .why{color:var(--fg,inherit)}.exp{font-size:.92rem;color:var(--mut);margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--ac2)}
.day{border-left:4px solid var(--ac);padding-left:14px;margin:18px 0}
label.ck{display:flex;gap:9px;align-items:flex-start;padding:4px 0}label.ck input{margin-top:6px;transform:scale(1.15)}
label.ck.done span{text-decoration:line-through;color:var(--mut)}
a{color:var(--ac)}
</style>
</head>
<body>
<header><b>Simulados · Data Science e Analytics</b><nav id="nav"></nav><span class="sp"></span><span class="mut" id="clock"></span></header>
<main id="main"></main>
<script>
const D={"areas": {"A1": "Não supervisionados (cluster, PCA, correspondência)", "A2": "OLS (regressão simples e múltipla)", "A3": "Máxima verossimilhança (logística, contagem, multinível)", "A4": "Modelos adicionais (ensemble, redes neurais, deep learning)", "A5": "Técnicas diversas (estatística, wrangling, scraping, NLP, SNA, PO, séries, riscos)", "P2": "Gestão em Data Science & Analytics (interpretação)"}, "bank": [{"id": "O000", "a": "A4", "tp": "Bagging e Random Forest", "src": "original", "s": "Considere as afirmações sobre o bagging (Bootstrap Aggregating):\nI – Treina vários modelos do mesmo tipo, cada um em uma amostra bootstrap dos dados.\nII – Combina as previsões por votação (classificação) ou média (regressão).\nIII – Seu efeito principal é reduzir o viés de cada modelo individual.\nEstá correto o que se afirma em:", "c": "Apenas I e II.", "d": ["Apenas I e III.", "Apenas II e III.", "I, II e III."], "e": "Bagging treina modelos do mesmo tipo em amostras bootstrap (I) e agrega por votação ou média (II); seu efeito é reduzir a variância, não o viés (III é falsa).", "dx": {"Apenas I e III.": "A III é falsa: bagging reduz variância.", "Apenas II e III.": "A III é falsa e a I verdadeira, então a combinação erra.", "I, II e III.": "A III é falsa."}}, {"id": "O001", "a": "A4", "tp": "Bagging e Random Forest", "src": "original", "s": "Em uma amostra bootstrap (com reposição) de tamanho igual ao do conjunto original, aproximadamente que fração dos registros originais costuma ficar de fora (out-of-bag, OOB)?", "c": "Cerca de 37%.", "d": ["Cerca de 63%.", "Cerca de 50%.", "Cerca de 10%."], "e": "Cada sorteio com reposição deixa um registro de fora com prob. (1 − 1/n); para n grande, (1 − 1/n)^n → e^−1 ≈ 0,368. Cerca de 37% fica fora (OOB) e ~63% entra.", "dx": {"Cerca de 63%.": "63% é a fração que ENTRA na amostra (complemento de 37%), não a que fica de fora.", "Cerca de 50%.": "50% não decorre do cálculo; só valeria sem reposição com metade amostrada.", "Cerca de 10%.": "10% subestima: a probabilidade de ficar de fora é e^−1, bem maior."}}, {"id": "O002", "a": "A4", "tp": "Bagging e Random Forest", "src": "original", "s": "Qual é a diferença central entre a Random Forest e o bagging tradicional de árvores?", "c": "Na Random Forest, em cada divisão só um subconjunto aleatório de variáveis é candidato ao split, o que descorrelaciona as árvores.", "d": ["A Random Forest treina as árvores em sequência, corrigindo os erros anteriores.", "A Random Forest usa todas as variáveis em todos os splits, para maximizar a correlação entre as árvores.", "A Random Forest dispensa a agregação das previsões das árvores."], "e": "A Random Forest sorteia, a cada split, um subconjunto de variáveis candidatas, descorrelacionando as árvores e reduzindo a variância da média.", "dx": {"A Random Forest treina as árvores em sequência, corrigindo os erros anteriores.": "Treino sequencial corrigindo erros é boosting.", "A Random Forest usa todas as variáveis em todos os splits, para maximizar a correlação entre as árvores.": "Usar todas as variáveis nos splits é o bagging tradicional, não a RF.", "A Random Forest dispensa a agregação das previsões das árvores.": "A RF agrega previsões (votação/média)."}}, {"id": "O003", "a": "A4", "tp": "Bagging e Random Forest", "src": "original", "s": "Em uma Random Forest, qual hiperparâmetro define quantas variáveis são consideradas como candidatas em cada divisão de uma árvore?", "c": "max_features", "d": ["n_estimators", "min_samples_leaf", "bootstrap"], "e": "n_estimators é o nº de árvores; max_features controla a aleatoriedade das colunas por split."}, {"id": "O004", "a": "A4", "tp": "Boosting", "src": "original", "s": "No boosting, cada novo modelo da sequência:", "c": "É treinado para corrigir os erros (resíduos) dos modelos anteriores.", "d": ["É treinado de forma independente e em paralelo aos demais.", "É treinado apenas com os dados de teste.", "Substitui os modelos anteriores, que são descartados."], "e": "Boosting é sequencial: cada modelo foca nos erros do anterior e a previsão final é a soma ponderada."}, {"id": "O005", "a": "A4", "tp": "Boosting", "src": "original", "s": "Sobre bagging e boosting, assinale a alternativa correta:", "c": "O bagging reduz principalmente a variância; o boosting reduz principalmente o viés.", "d": ["O bagging reduz principalmente o viés; o boosting reduz principalmente a variância.", "Ambos treinam os modelos em sequência.", "Ambos treinam os modelos em paralelo e de forma independente."], "e": "Bagging faz média de modelos independentes, reduzindo variância; boosting corrige erros sequencialmente, reduzindo viés.", "dx": {"O bagging reduz principalmente o viés; o boosting reduz principalmente a variância.": "Inverte os papéis.", "Ambos treinam os modelos em sequência.": "Só o boosting treina em sequência.", "Ambos treinam os modelos em paralelo e de forma independente.": "Só o bagging treina em paralelo de forma independente."}}, {"id": "O006", "a": "A4", "tp": "Boosting", "src": "original", "s": "No XGBoost, os parâmetros reg_alpha e reg_lambda correspondem, respectivamente, às regularizações:", "c": "L1 e L2, que penalizam os pesos das folhas e controlam a complexidade do modelo.", "d": ["L2 e L1, que ajustam o tamanho do bootstrap.", "Dropout e batch normalization.", "Early stopping e learning rate."], "e": "reg_alpha = L1 e reg_lambda = L2, penalizando os pesos das folhas e controlando a complexidade.", "dx": {"L2 e L1, que ajustam o tamanho do bootstrap.": "Inverte a ordem e não ajusta bootstrap.", "Dropout e batch normalization.": "Dropout e batch norm são técnicas de redes neurais.", "Early stopping e learning rate.": "Early stopping e learning rate são outros hiperparâmetros."}}, {"id": "O007", "a": "A4", "tp": "Boosting", "src": "original", "s": "Em modelos de boosting, aumentar demais o learning rate tende a:", "c": "Tornar o treinamento instável, com risco de oscilar e de sobreajustar.", "d": ["Garantir convergência mais precisa com menos árvores.", "Eliminar a necessidade de early stopping.", "Reduzir o custo computacional sem qualquer perda de qualidade."], "e": "Learning rate alto dá passos grandes: o modelo pode oscilar em torno do mínimo e se ajustar demais ao treino, ficando instável.", "dx": {"Garantir convergência mais precisa com menos árvores.": "Passos grandes não garantem precisão; costumam piorar a convergência.", "Eliminar a necessidade de early stopping.": "O early stopping continua necessário para decidir onde parar.", "Reduzir o custo computacional sem qualquer perda de qualidade.": "Não reduz custo 'sem perda': a perda de qualidade é justamente o risco."}}, {"id": "O008", "a": "A4", "tp": "Ensemble", "src": "original", "s": "No stacking, o meta-modelo (nível 1):", "c": "Aprende a combinar as previsões dos modelos-base (nível 0), usando-as como novas variáveis.", "d": ["Faz uma votação simples, sem etapa de treinamento.", "Treina apenas com as variáveis originais, ignorando os modelos-base.", "É sempre idêntico a um dos modelos-base."], "e": "No stacking o meta-modelo é treinado com as previsões dos modelos-base como features.", "dx": {"Faz uma votação simples, sem etapa de treinamento.": "Votação sem treino é voting, não stacking.", "Treina apenas com as variáveis originais, ignorando os modelos-base.": "O meta-modelo usa as previsões dos modelos-base.", "É sempre idêntico a um dos modelos-base.": "Não é igual a nenhum modelo-base; é um aprendiz extra."}}, {"id": "O009", "a": "A4", "tp": "Ensemble", "src": "original", "s": "Três modelos estimam a probabilidade de inadimplência de um cliente: 0,9; 0,4 e 0,3. Considerando corte de 0,5, qual é o resultado no soft voting e no hard voting, respectivamente?", "c": "Inadimplente (média ≈ 0,53) e adimplente (apenas 1 de 3 modelos votou inadimplente).", "d": ["Adimplente e inadimplente.", "Inadimplente nos dois casos.", "Adimplente nos dois casos."], "e": "Soft voting faz a média das probabilidades: (0,9+0,4+0,3)/3 ≈ 0,53 > 0,5 → inadimplente. Hard voting conta votos: só 1 de 3 passa de 0,5 → adimplente.", "dx": {"Adimplente e inadimplente.": "Inverte os resultados: soft dá inadimplente e hard dá adimplente.", "Inadimplente nos dois casos.": "Hard voting não dá inadimplente: apenas 1 modelo de 3 votou assim.", "Adimplente nos dois casos.": "Soft voting não dá adimplente: a média 0,53 passa do corte."}}, {"id": "O010", "a": "A4", "tp": "Árvores de decisão", "src": "original", "s": "Uma árvore de decisão muito profunda e sem poda tende a apresentar:", "c": "Baixo viés e alta variância (sobreajuste aos dados de treino).", "d": ["Alto viés e baixa variância (subajuste).", "Alto viés e alta variância ao mesmo tempo, sempre.", "Baixo viés e baixa variância, independentemente dos dados."], "e": "Árvore profunda sem poda memoriza o treino: ajusta o ruído (baixo viés) e muda muito com pequenas alterações nos dados (alta variância) = sobreajuste.", "dx": {"Alto viés e baixa variância (subajuste).": "Alto viés e baixa variância é o perfil de uma árvore rasa demais (subajuste).", "Alto viés e alta variância ao mesmo tempo, sempre.": "Viés e variância altos ao mesmo tempo 'sempre' não descreve o caso; árvore profunda tem viés baixo.", "Baixo viés e baixa variância, independentemente dos dados.": "Não existe ganho 'grátis' dos dois lados: baixa variância exigiria poda ou ensemble."}}, {"id": "O011", "a": "A4", "tp": "Árvores de decisão", "src": "original", "s": "Um banco deseja detectar fraudes, e deixar passar uma fraude é muito mais grave que um alarme falso. Qual métrica deve ser priorizada?", "c": "Recall (sensibilidade).", "d": ["Precisão.", "Acurácia, sempre.", "Especificidade."], "e": "Se perder uma fraude é pior que um falso alarme, interessa minimizar falsos negativos: maximizar o recall.", "dx": {"Precisão.": "Precisão mede quantos alertas eram fraudes reais (falsos positivos); não é o foco.", "Acurácia, sempre.": "Acurácia engana em classes desbalanceadas; 'sempre' é falso.", "Especificidade.": "Especificidade foca em acertar os negativos, não em achar as fraudes."}}, {"id": "O012", "a": "A4", "tp": "Árvores de decisão", "src": "original", "s": "O F1-score é definido como:", "c": "A média harmônica entre precisão e recall.", "d": ["A média aritmética entre acurácia e precisão.", "A razão entre falsos positivos e falsos negativos.", "O quadrado da diferença entre precisão e recall."], "e": "F1 = 2·(precisão·recall)/(precisão+recall) = média harmônica de precisão e recall.", "dx": {"A média aritmética entre acurácia e precisão.": "Não envolve acurácia, e é média harmônica.", "A razão entre falsos positivos e falsos negativos.": "Não é razão de falsos positivos por falsos negativos.", "O quadrado da diferença entre precisão e recall.": "Não é diferença ao quadrado."}}, {"id": "O013", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "Sobre o perceptron, assinale a alternativa correta:", "c": "Calcula ŷ = g(Σ xᵢ·wᵢ), em que w₀ é o bias e g é a função de ativação.", "d": ["Sem função de ativação, um perceptron univariado representa curvas não lineares arbitrárias.", "Resolve o problema XOR sem camada oculta.", "Não possui pesos treináveis."], "e": "Sem ativação, o perceptron univariado é uma regressão linear (w₁ gira a reta; w₀ a desloca)."}, {"id": "O014", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "O problema XOR é historicamente importante porque mostrou que:", "c": "Um perceptron sem camada oculta e sem ativação não linear não resolve problemas que não são linearmente separáveis.", "d": ["Redes neurais não conseguem aprender nenhuma função.", "O XOR é linearmente separável, mas exige muitos dados.", "A função sigmoid é incompatível com redes neurais."], "e": "O XOR não é linearmente separável; um perceptron simples (sem camada oculta/ativação não linear) não o resolve, o que motivou as redes multicamadas.", "dx": {"Redes neurais não conseguem aprender nenhuma função.": "Redes aprendem funções; o ponto é a limitação do perceptron simples.", "O XOR é linearmente separável, mas exige muitos dados.": "O XOR NÃO é linearmente separável.", "A função sigmoid é incompatível com redes neurais.": "A sigmoide é compatível com redes neurais (foi muito usada)."}}, {"id": "O015", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "Por que as funções de ativação não lineares são indispensáveis em uma MLP?", "c": "Sem elas, a composição de várias camadas continua sendo uma função linear.", "d": ["Porque aumentam a quantidade de dados disponíveis.", "Porque eliminam a necessidade de treinar a rede.", "Porque tornam todas as camadas independentes entre si."], "e": "A não linearidade é o que dá poder expressivo à rede."}, {"id": "O016", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "Em redes profundas, a ReLU costuma ser preferida à sigmoid nas camadas ocultas porque:", "c": "Não satura para valores positivos, o que reduz o problema do gradiente que desaparece.", "d": ["Comprime qualquer valor para o intervalo (0, 1), como uma probabilidade.", "Garante que todas as saídas somem 1.", "Não possui custo computacional."], "e": "A sigmoid satura nas pontas (gradiente ≈ 0); a ReLU é barata e não satura para z > 0."}, {"id": "O017", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "A função softmax, aplicada na camada de saída, serve para:", "c": "Transformar os logits em probabilidades que somam 1, em classificação multiclasse.", "d": ["Eliminar valores negativos das camadas ocultas.", "Normalizar as imagens de entrada para o intervalo [0, 255].", "Reduzir a resolução do feature map."], "e": "Softmax converte os logits em probabilidades não negativas que somam 1: usada na saída de classificação multiclasse.", "dx": {"Eliminar valores negativos das camadas ocultas.": "Eliminar negativos nas camadas ocultas é papel da ReLU.", "Normalizar as imagens de entrada para o intervalo [0, 255].": "Normalizar imagens é pré-processamento, não da softmax.", "Reduzir a resolução do feature map.": "Reduzir resolução do feature map é papel do pooling/stride."}}, {"id": "O018", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "Em um problema multiclasse com rótulos inteiros (0, 1, 2…) e saída softmax, a função de perda adequada é:", "c": "Sparse Categorical Cross Entropy.", "d": ["Binary Cross Entropy.", "Erro absoluto médio (MAE).", "Erro quadrático médio (MSE)."], "e": "Com rótulo em one-hot usa-se a Categorical CE; com rótulo inteiro, a Sparse CCE (mesmo valor de perda)."}, {"id": "O019", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "No gradient descent, W ← W − η·∇J(W). O que tende a ocorrer se o learning rate η for grande demais?", "c": "O treinamento pode oscilar ou divergir, ultrapassando o mínimo da loss.", "d": ["O treinamento sempre converge mais rápido e de forma estável.", "Os pesos deixam de ser atualizados.", "A rede passa a ter menos parâmetros."], "e": "Learning rate pequeno demais é lento; grande demais é instável."}, {"id": "O020", "a": "A4", "tp": "Redes neurais", "src": "original", "s": "Durante o treino, a loss de treinamento cai continuamente, mas a loss de validação cai e depois volta a subir. Isso indica:", "c": "Overfitting; medidas como early stopping, dropout ou regularização ajudam.", "d": ["Underfitting; deve-se reduzir a complexidade do modelo.", "Que o modelo atingiu o mínimo global; o treino deve continuar.", "Que o conjunto de validação não é necessário."], "e": "A rede começa a decorar o treino; restaura-se o modelo da melhor época de validação."}, {"id": "O021", "a": "A4", "tp": "Deep learning", "src": "original", "s": "Em uma convolução com entrada 5×5, kernel 3×3, padding 'valid' e stride 1, qual é o tamanho da saída?", "c": "3×3", "d": ["5×5", "4×4", "2×2"], "e": "Sem preenchimento: 5 − 3 + 1 = 3."}, {"id": "O022", "a": "A4", "tp": "Deep learning", "src": "original", "s": "Qual é a principal vantagem de uma CNN sobre uma rede densa (FCN) no processamento de imagens?", "c": "Aprende features locais e hierárquicas, preserva a estrutura espacial e tem invariância à translação.", "d": ["Achata a imagem e usa features globais.", "Dispensa o treinamento por gradiente.", "Só funciona com imagens em preto e branco."], "e": "A CNN usa filtros que aprendem padrões locais (bordas → formas → objetos), preservam a estrutura espacial e são invariantes à translação.", "dx": {"Achata a imagem e usa features globais.": "Achatar e usar features globais é o que a rede densa faz e é a desvantagem.", "Dispensa o treinamento por gradiente.": "A CNN também é treinada por gradiente.", "Só funciona com imagens em preto e branco.": "Funciona com imagens coloridas (RGB) e em tons de cinza."}}, {"id": "O023", "a": "A4", "tp": "Deep learning", "src": "original", "s": "Sobre a self-attention dos Transformers, assinale a alternativa correta:", "c": "Cada token gera Query, Key e Value; os scores entre Query e Key, normalizados por softmax, ponderam os Values.", "d": ["Processa os tokens estritamente em sequência, um de cada vez.", "Dispensa o uso de embeddings.", "Dispensa o positional encoding, pois conhece a ordem dos tokens."], "e": "Na self-attention cada token gera Q, K, V; os scores Q·K, passados por softmax, ponderam os Values.", "dx": {"Processa os tokens estritamente em sequência, um de cada vez.": "Processa em paralelo, não em sequência.", "Dispensa o uso de embeddings.": "Precisa de embeddings como entrada.", "Dispensa o positional encoding, pois conhece a ordem dos tokens.": "Por não ter noção de ordem, precisa do positional encoding."}}, {"id": "O024", "a": "A4", "tp": "Deep learning", "src": "original", "s": "Comparando LSTM e Transformer, é correto afirmar que o Transformer:", "c": "Paraleliza o treino e conecta todos os pares de tokens, ao custo de complexidade quadrática em N.", "d": ["Tem complexidade linear em N e memória constante na inferência.", "Treina de forma estritamente sequencial.", "Esquece com facilidade relações de longo prazo."], "e": "O Transformer treina em paralelo e usa atenção entre todos os pares de tokens, com custo quadrático em N (N²).", "dx": {"Tem complexidade linear em N e memória constante na inferência.": "Complexidade linear e memória constante descrevem RNNs/LSTMs na inferência, não o Transformer.", "Treina de forma estritamente sequencial.": "Treino estritamente sequencial é característica das LSTMs.", "Esquece com facilidade relações de longo prazo.": "Dependências de longo prazo são o ponto forte da atenção; o esquecimento é problema das LSTMs."}}, {"id": "O025", "a": "A4", "tp": "Deep learning", "src": "original", "s": "Sobre word embeddings, assinale a alternativa correta:", "c": "São vetores densos e treináveis, em que palavras de uso parecido ficam próximas no espaço.", "d": ["São vetores esparsos com uma dimensão por palavra do vocabulário.", "São fixos e idênticos em todos os contextos, o que resolve a ambiguidade.", "Dispensam o treinamento da rede."], "e": "O embedding clássico é fixo por palavra; a atenção é que traz o contexto."}, {"id": "O026", "a": "A3", "tp": "Contagem e inflacionados de zeros", "src": "original", "s": "No teste de Cameron e Trivedi para superdispersão, a regressão auxiliar é estimada sem intercepto e o coeficiente da variável é estatisticamente diferente de zero. Conclui-se que:", "c": "Há superdispersão: a variância é significativamente maior que a média, e o modelo binomial negativo é mais adequado.", "d": ["Há equidispersão, e o modelo Poisson é adequado.", "Há subdispersão, e deve-se usar OLS.", "Os dados são contínuos."], "e": "Coeficiente significante na regressão auxiliar de Cameron-Trivedi = superdispersão, logo binomial negativo.", "dx": {"Há equidispersão, e o modelo Poisson é adequado.": "Equidispersão seria coeficiente não significante.", "Há subdispersão, e deve-se usar OLS.": "Subdispersão não se conclui disso, e OLS não é alternativa.", "Os dados são contínuos.": "O teste é sobre contagens, discretas, não contínuas."}}, {"id": "O027", "a": "A3", "tp": "Contagem e inflacionados de zeros", "src": "original", "s": "O teste de Vuong, em modelos para dados de contagem, é utilizado para:", "c": "Verificar se há inflação de zeros, comparando o modelo inflacionado com o convencional.", "d": ["Detectar superdispersão.", "Verificar normalidade dos resíduos.", "Escolher o número de dimensões da correspondência."], "e": "O teste de Vuong compara o modelo inflacionado de zeros com o convencional, verificando se há inflação de zeros.", "dx": {"Detectar superdispersão.": "Superdispersão é detectada por Cameron-Trivedi (overdisp).", "Verificar normalidade dos resíduos.": "Normalidade é testada por Shapiro-Francia.", "Escolher o número de dimensões da correspondência.": "Dimensões da correspondência dependem de categorias, não de Vuong."}}, {"id": "O028", "a": "A3", "tp": "Contagem e inflacionados de zeros", "src": "original", "s": "Em modelos inflacionados de zeros (ZIP/ZINB), os 'zeros estruturais' correspondem a:", "c": "Observações para as quais o evento nunca ocorreria, modeladas pelo componente binário (logit).", "d": ["Zeros que poderiam ter ocorrido por acaso, modelados pela Poisson.", "Valores negativos substituídos por zero.", "Observações perdidas (missing)."], "e": "Zeros estruturais vêm de observações que nunca teriam o evento, modeladas por um componente binário (logit); zeros amostrais vêm da Poisson/BN.", "dx": {"Zeros que poderiam ter ocorrido por acaso, modelados pela Poisson.": "Zeros por acaso são os zeros amostrais, modelados pela Poisson.", "Valores negativos substituídos por zero.": "Nada a ver com substituir negativos.", "Observações perdidas (missing).": "Zero estrutural não é dado faltante."}}, {"id": "O029", "a": "A3", "tp": "Contagem e inflacionados de zeros", "src": "original", "s": "Uma variável dependente de contagem apresenta média 2 e variância 10. Qual é o modelo mais adequado?", "c": "Binomial negativo, pois há superdispersão (variância muito maior que a média).", "d": ["Poisson, pois média e variância são sempre iguais.", "Regressão linear (OLS) com Box-Cox.", "Regressão logística binária."], "e": "Variância (10) bem acima da média (2) = superdispersão; o Poisson subestima o erro; o binomial negativo, com parâmetro de dispersão, é o adequado.", "dx": {"Poisson, pois média e variância são sempre iguais.": "Poisson exige média = variância, e aqui não é o caso; 'sempre iguais' é falso.", "Regressão linear (OLS) com Box-Cox.": "OLS/Box-Cox não respeita a natureza discreta e não negativa da contagem.", "Regressão logística binária.": "Logística binária é para resposta dicotômica."}}, {"id": "O030", "a": "A3", "tp": "Modelos multinível", "src": "original", "s": "Em um modelo multinível, a variância entre escolas é 20 e a variância residual é 80. O coeficiente de correlação intraclasse (ICC) vale:", "c": "0,20 — 20% da variação é atribuível ao contexto (escola).", "d": ["0,80 — 80% da variação é atribuível à escola.", "0,25 — a razão entre as variâncias.", "4,0 — a razão entre residual e escola."], "e": "ICC = variância entre grupos / (entre + residual) = 20/(20 + 80) = 0,20: 20% da variação é do contexto.", "dx": {"0,80 — 80% da variação é atribuível à escola.": "0,80 é a parcela residual.", "0,25 — a razão entre as variâncias.": "0,25 é 20/80, razão mas não proporção do total.", "4,0 — a razão entre residual e escola.": "4,0 é a razão inversa 80/20."}}, {"id": "O031", "a": "A3", "tp": "Modelos multinível", "src": "original", "s": "Para prever o valor de um indivíduo de determinado grupo em um modelo multinível, deve-se:", "c": "Somar a parte fixa (γ) aos efeitos aleatórios do grupo (ν₀ⱼ e ν₁ⱼ·x).", "d": ["Usar apenas os parâmetros de efeito fixo.", "Usar apenas os efeitos aleatórios.", "Descartar o grupo e estimar um OLS."], "e": "O fittedvalues já incorpora os efeitos aleatórios."}, {"id": "O032", "a": "A3", "tp": "Modelos logísticos", "src": "original", "s": "Em uma regressão logística multinomial com uma variável dependente de 4 categorias, quantos logitos são estimados?", "c": "3, cada um comparando uma categoria com a categoria de referência.", "d": ["4, um por categoria.", "1, que compara todas as categorias.", "6, um por par de categorias."], "e": "Com J categorias estimam-se J − 1 logitos, cada um comparando uma categoria com a de referência. Com 4 categorias, são 3 logitos.", "dx": {"4, um por categoria.": "4 contaria também a referência, que não tem logito próprio (é a base de comparação).", "1, que compara todas as categorias.": "1 logito só serve para a regressão logística binária (2 categorias).", "6, um por par de categorias.": "6 seria o número de pares (4·3/2), esquema one-vs-one que não é o usado na multinomial."}}, {"id": "O033", "a": "A3", "tp": "Modelos logísticos", "src": "original", "s": "Em uma regressão logística binária, o coeficiente β = 0,7 de uma variável X implica que e^β ≈ 2,01. Isso significa que:", "c": "Cada unidade adicional de X multiplica a chance (odds) do evento por cerca de 2.", "d": ["Cada unidade adicional de X aumenta a probabilidade em 70 pontos percentuais.", "A probabilidade do evento é 2,01.", "X reduz a chance do evento pela metade."], "e": "e^β é a razão de chances: cada unidade de X multiplica as odds por ≈ 2,01.", "dx": {"Cada unidade adicional de X aumenta a probabilidade em 70 pontos percentuais.": "O coeficiente não é variação em pontos percentuais de probabilidade.", "A probabilidade do evento é 2,01.": "e^β é razão de odds, não probabilidade.", "X reduz a chance do evento pela metade.": "Reduzir pela metade corresponderia a e^β ≈ 0,5 (β negativo)."}}, {"id": "O034", "a": "A3", "tp": "Modelos logísticos", "src": "original", "s": "Em um modelo de regressão logística binária, o logito estimado para um indivíduo é Z = −0,5. Qual é a probabilidade estimada de ocorrência do evento? (p = 1/(1 + e^−Z))", "c": "Aproximadamente 0,3775.", "d": ["Aproximadamente 0,6225.", "Aproximadamente 0,5000.", "Aproximadamente 0,1353."], "e": "p = 1/(1 + e^0,5) = 1/(1 + 1,6487) ≈ 0,3775. Logito negativo → probabilidade abaixo de 0,5.", "dx": {"Aproximadamente 0,6225.": "0,6225 é o complemento (1 − 0,3775), a probabilidade se Z fosse +0,5.", "Aproximadamente 0,5000.": "0,5 só ocorre quando Z = 0.", "Aproximadamente 0,1353.": "0,1353 é e^−2; não vem desse cálculo."}}, {"id": "O035", "a": "A3", "tp": "Modelos logísticos", "src": "original", "s": "A matriz de confusão de um modelo logístico (cutoff 0,5) apresenta: verdadeiros positivos = 45, falsos negativos = 15, falsos positivos = 10 e verdadeiros negativos = 130. A sensibilidade do modelo é:", "c": "75,00%", "d": ["92,86%", "87,50%", "81,82%"], "e": "Sensibilidade = VP/(VP + FN) = 45/60 = 75%. (Acurácia = 175/200 = 87,5%; especificidade = 130/140 ≈ 92,86%.)"}, {"id": "O036", "a": "A3", "tp": "Modelos logísticos", "src": "original", "s": "Com os mesmos dados de uma matriz de confusão (VP = 45, FN = 15, FP = 10, VN = 130), a acurácia global do modelo é:", "c": "87,50%", "d": ["75,00%", "92,86%", "81,82%"], "e": "Acurácia = (VP + VN)/total = 175/200."}, {"id": "O037", "a": "A3", "tp": "Contagem e inflacionados de zeros", "src": "original", "s": "Em um modelo de regressão Poisson, ln(λ) = 0,5 + 0,2·X. Para X = 3, o número esperado de ocorrências é aproximadamente:", "c": "3,00", "d": ["1,10", "0,50", "1,82"], "e": "λ = e^(0,5 + 0,2·3) = e^1,1 ≈ 3,00. Em Poisson o preditor linear é ln(λ), então é preciso exponenciar.", "dx": {"1,10": "1,10 é o preditor linear ln(λ), sem aplicar a exponencial.", "0,50": "0,50 é só o intercepto; esquece a contribuição de X e a exponencial.", "1,82": "1,82 vem de e^0,6 (usar X = 1 em vez de 3)."}}, {"id": "O038", "a": "A3", "tp": "Modelos logísticos", "src": "original", "s": "Em uma regressão logística multinomial com três categorias (referência = 0), os logitos de um indivíduo são Z₁ = 0,5 e Z₂ = −0,2. A probabilidade de pertencer à categoria de referência é aproximadamente:", "c": "0,288", "d": ["0,476", "0,236", "0,333"], "e": "P₀ = 1/(1 + e^0,5 + e^−0,2) = 1/(1 + 1,649 + 0,819) ≈ 0,288."}, {"id": "O039", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Em uma regressão linear simples, o coeficiente de correlação de Pearson entre X e Y é 0,6. O R² do modelo é:", "c": "0,36", "d": ["0,60", "0,77", "0,16"], "e": "Em regressão simples R² = r² = 0,6² = 0,36.", "dx": {"0,60": "0,60 é o r, não o R².", "0,77": "0,77 é a raiz de 0,6, operação errada.", "0,16": "0,16 não decorre de r (seria 0,4²)."}}, {"id": "O040", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Considere o modelo Preço = 40 + 12·Sul + 8·Norte, em que Sul e Norte são dummies e a região de referência é o Centro. O preço médio previsto para o Norte é:", "c": "48", "d": ["8", "52", "60"], "e": "O intercepto (40) é o preço do Centro (referência); Norte = 40 + 8 = 48 (Sul = 52).", "dx": {"8": "8 é só o diferencial do Norte em relação ao Centro.", "52": "52 é o preço previsto para o Sul (40 + 12).", "60": "60 soma 40 + 12 + 8, como se a região fosse Sul e Norte ao mesmo tempo."}}, {"id": "O041", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Uma variável qualitativa com 5 categorias será incluída em uma regressão OLS por meio de dummies. Quantas dummies devem ser criadas?", "c": "4", "d": ["5", "3", "1"], "e": "Com J categorias criam-se J − 1 dummies; a categoria omitida é a referência. 5 − 1 = 4.", "dx": {"5": "5 inclui todas as categorias e gera multicolinearidade perfeita (armadilha da variável dummy).", "3": "3 omite duas categorias sem necessidade; haveria perda de informação.", "1": "1 só serve para variável com 2 categorias."}}, {"id": "O042", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Em um teste de Shapiro-Francia aplicado aos resíduos de um modelo OLS, obteve-se p-valor = 0,40. A conclusão adequada é:", "c": "Não se rejeita a hipótese de normalidade dos resíduos.", "d": ["Rejeita-se a normalidade; deve-se aplicar Box-Cox.", "Há heterocedasticidade.", "Há multicolinearidade."], "e": "No Shapiro-Francia H0 é normalidade. Com p = 0,40 > 0,05 não se rejeita H0: resíduos compatíveis com normalidade.", "dx": {"Rejeita-se a normalidade; deve-se aplicar Box-Cox.": "Só se rejeitaria a normalidade (e se pensaria em Box-Cox) com p < 0,05.", "Há heterocedasticidade.": "Heterocedasticidade é testada pelo Breusch-Pagan, não pelo Shapiro-Francia.", "Há multicolinearidade.": "Multicolinearidade se avalia por VIF/tolerance."}}, {"id": "O043", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Em um teste de Breusch-Pagan, obteve-se p-valor = 0,002. A conclusão adequada é:", "c": "Há evidência de heterocedasticidade.", "d": ["Os resíduos são normais.", "Há multicolinearidade grave.", "O modelo está livre de problemas."], "e": "No Breusch-Pagan H0 é variância constante (homocedasticidade). Com p = 0,002 < 0,05 rejeita-se H0: há heterocedasticidade.", "dx": {"Os resíduos são normais.": "A normalidade dos resíduos é testada por Shapiro-Francia/Shapiro-Wilk, não pelo BP.", "Há multicolinearidade grave.": "Multicolinearidade é avaliada por VIF/tolerance.", "O modelo está livre de problemas.": "Rejeitar H0 do BP indica problema, então não dá para dizer que o modelo está livre de problemas."}}, {"id": "O044", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Em uma transformação de Box-Cox, o parâmetro lambda (λ) igual a zero corresponde a:", "c": "Uma transformação logarítmica (ln) da variável dependente.", "d": ["Uma transformação linear, sem alteração.", "Uma transformação quadrática.", "Uma transformação inversa (1/Y)."], "e": "Em Box-Cox, λ = 0 equivale à transformação ln(Y); λ = 1 é linear; λ = 2 quadrática; λ = −1 inversa.", "dx": {"Uma transformação linear, sem alteração.": "Transformação sem alteração (linear) corresponde a λ = 1.", "Uma transformação quadrática.": "Quadrática corresponde a λ = 2.", "Uma transformação inversa (1/Y).": "Inversa 1/Y corresponde a λ = −1."}}, {"id": "O045", "a": "A2", "tp": "Regressão OLS", "src": "original", "s": "Um VIF de 10 para uma variável explicativa corresponde a uma Tolerance de:", "c": "0,10", "d": ["10", "0,90", "1"], "e": "Tolerance = 1/VIF = 1/10 = 0,10. Quanto menor a tolerance, maior a multicolinearidade; 0,10 é o limite clássico de alerta.", "dx": {"10": "10 é o próprio VIF, não a tolerance (que é o inverso dele).", "0,90": "0,90 seria 1 − 0,10; não é a relação entre VIF e tolerance.", "1": "1 é a tolerance de uma variável sem nenhuma colinearidade (VIF = 1), não de um VIF = 10."}}, {"id": "O046", "a": "A1", "tp": "PCA", "src": "original", "s": "Os autovalores de uma análise fatorial por componentes principais são 2,6; 1,1; 0,2 e 0,1. Pelo critério de Kaiser (raiz latente), quantos fatores devem ser mantidos e qual o percentual de variância acumulada deles?", "c": "Dois fatores, que acumulam 92,5% da variância.", "d": ["Um fator, com 65% da variância.", "Três fatores, com 97,5% da variância.", "Quatro fatores, com 100% da variância."], "e": "Mantêm-se os fatores com autovalor > 1: 2,6 + 1,1 = 3,7 de um total de 4 → 92,5%."}, {"id": "O047", "a": "A1", "tp": "Análise de Correspondência", "src": "original", "s": "Uma Análise de Correspondência Múltipla envolve três variáveis com 4, 3 e 5 categorias. O número máximo de dimensões é:", "c": "9", "d": ["12", "3", "11"], "e": "O máximo de dimensões da ACM é a soma das categorias menos o número de variáveis: (4 + 3 + 5) − 3 = 9 (J − Q).", "dx": {"12": "12 é a soma das categorias, sem descontar o número de variáveis.", "3": "3 é o número de variáveis, não de dimensões.", "11": "11 descontaria só 1; o correto é descontar Q = 3."}}, {"id": "O048", "a": "A1", "tp": "Clustering", "src": "original", "s": "Um banco com 50 observações é analisado pelo método hierárquico aglomerativo. Quantos estágios de aglomeração (junções) ocorrem até restar um único cluster?", "c": "49", "d": ["50", "1", "25"], "e": "Com n observações são necessárias n − 1 junções para chegar a um cluster: 50 − 1 = 49.", "dx": {"50": "50 seria o número de clusters iniciais, não de junções.", "1": "1 é o número final de clusters, não de estágios.", "25": "25 só aconteceria se cada junção unisse duas duplas, o que não é como o algoritmo opera (une um par por vez)."}}, {"id": "E00", "a": "A1", "tp": "Clustering (hierárquico e K-means)", "src": "original", "s": "Por que é recomendável padronizar (Z-score) as variáveis antes de uma análise de clusters baseada em distância euclidiana?", "c": "Para que variáveis em escalas muito diferentes (por exemplo, renda em reais e idade em anos) não dominem o cálculo das distâncias.", "d": ["Para que todas as variáveis passem a ser categóricas.", "Para garantir que os clusters tenham o mesmo número de observações.", "Para eliminar a necessidade de escolher o número de clusters."], "e": "A distância euclidiana soma diferenças ao quadrado; a variável de maior escala pesaria mais. O Z-score deixa todas com média 0 e desvio padrão 1.", "dx": {"Para que todas as variáveis passem a ser categóricas.": "O Z-score mantém as variáveis métricas; não as transforma em categóricas.", "Para garantir que os clusters tenham o mesmo número de observações.": "Padronizar não equilibra o tamanho dos clusters.", "Para eliminar a necessidade de escolher o número de clusters.": "O número de clusters continua precisando ser definido (dendrograma, cotovelo, silhueta)."}}, {"id": "E01", "a": "A1", "tp": "Clustering (hierárquico e K-means)", "src": "original", "s": "No encadeamento single linkage (vizinho mais próximo), a distância entre dois clusters é:", "c": "A menor distância entre um elemento de um cluster e um elemento do outro.", "d": ["A maior distância entre um elemento de um cluster e um elemento do outro.", "A média das distâncias entre todos os pares de elementos dos dois clusters.", "A distância entre as médias gerais de todas as variáveis."], "e": "Single = mínimo (vizinhos mais próximos); complete = máximo (vizinhos mais distantes); average = média entre pares.", "dx": {"A maior distância entre um elemento de um cluster e um elemento do outro.": "Essa é a definição do complete linkage (vizinho mais distante).", "A média das distâncias entre todos os pares de elementos dos dois clusters.": "Essa é a definição do average linkage.", "A distância entre as médias gerais de todas as variáveis.": "A distância entre centroides pertence ao centroid linkage."}}, {"id": "E02", "a": "A1", "tp": "Clustering (hierárquico e K-means)", "src": "original", "s": "Pontos A = 1, B = 2, C = 6 e D = 8 são clusterizados pelo método hierárquico aglomerativo com single linkage. Quais são os dois primeiros agrupamentos?", "c": "Primeiro A e B (distância 1) e, depois, C e D (distância 2).", "d": ["Primeiro B e C (distância 4) e, depois, A e D.", "Primeiro A e D (distância 7) e, depois, B e C.", "Primeiro C e D e, depois, A e B, com a mesma distância."], "e": "As menores distâncias são d(A,B) = 1 e d(C,D) = 2; o algoritmo une sempre o par mais próximo primeiro.", "dx": {"Primeiro B e C (distância 4) e, depois, A e D.": "B e C estão a 4: não é a menor distância disponível.", "Primeiro A e D (distância 7) e, depois, B e C.": "A e D estão a 7, a maior distância; seria o último par a se unir.", "Primeiro C e D e, depois, A e B, com a mesma distância.": "As distâncias são diferentes (2 e 1), então a ordem é A–B e depois C–D."}}, {"id": "E03", "a": "A1", "tp": "Clustering (hierárquico e K-means)", "src": "original", "s": "No K-means, a cada iteração, o que acontece depois de alocar cada observação ao centroide mais próximo?", "c": "Os centroides são recalculados como a média das observações de cada cluster.", "d": ["O número de clusters K é redefinido automaticamente.", "As observações são padronizadas novamente.", "O dendrograma é reconstruído."], "e": "O ciclo é: alocar ao centroide mais próximo, recalcular os centroides (médias) e repetir até não haver realocações.", "dx": {"O número de clusters K é redefinido automaticamente.": "O K é definido a priori e não muda durante o algoritmo.", "As observações são padronizadas novamente.": "A padronização é feita antes, uma única vez.", "O dendrograma é reconstruído.": "O dendrograma pertence ao método hierárquico."}}, {"id": "E04", "a": "A1", "tp": "Clustering (hierárquico e K-means)", "src": "original", "s": "A silhueta de uma observação é s = (b − a) / máx(a, b). Se a = 2 e b = 8, o valor de s é:", "c": "0,75, indicando que a observação está bem alocada.", "d": ["0,25, indicando má alocação.", "6, pois é a diferença b − a.", "−0,75, indicando que deveria estar em outro cluster."], "e": "s = (8 − 2)/8 = 0,75. Valores próximos de 1 indicam boa alocação; próximos de −1, alocação provavelmente errada.", "dx": {"0,25, indicando má alocação.": "0,25 seria (2/8), esquecendo de calcular b − a.", "6, pois é a diferença b − a.": "6 é só o numerador; falta dividir por máx(a, b) = 8.", "−0,75, indicando que deveria estar em outro cluster.": "O sinal seria negativo apenas se a > b."}}, {"id": "E05", "a": "A1", "tp": "Análise Fatorial por Componentes Principais", "src": "original", "s": "No critério da raiz latente (Kaiser), mantêm-se os fatores com:", "c": "Autovalor maior que 1.", "d": ["Autovalor menor que 1.", "Carga fatorial igual a 1 em todas as variáveis.", "Comunalidade igual a zero."], "e": "Autovalor > 1 significa que o fator explica mais variância do que uma variável original padronizada (que tem variância 1).", "dx": {"Autovalor menor que 1.": "Autovalor < 1 indica fator que explica menos que uma variável isolada; é descartado.", "Carga fatorial igual a 1 em todas as variáveis.": "Cargas iguais a 1 em todas as variáveis não é o critério.", "Comunalidade igual a zero.": "Comunalidade zero indicaria variável sem relação com os fatores."}}, {"id": "E06", "a": "A1", "tp": "Análise Fatorial por Componentes Principais", "src": "original", "s": "Em uma análise fatorial com 5 variáveis padronizadas, os autovalores são 2,6; 1,3; 0,6; 0,3 e 0,2. Quantos fatores o critério de Kaiser retém e que percentual da variância total eles explicam?", "c": "2 fatores, explicando (2,6 + 1,3)/5 = 78% da variância.", "d": ["3 fatores, explicando 90% da variância.", "1 fator, explicando 52% da variância.", "5 fatores, explicando 100% da variância."], "e": "Só 2,6 e 1,3 são maiores que 1. A variância total é igual ao número de variáveis (5), então 3,9/5 = 0,78.", "dx": {"3 fatores, explicando 90% da variância.": "O terceiro autovalor (0,6) é menor que 1, então não é retido.", "1 fator, explicando 52% da variância.": "Um fator só ignoraria o segundo autovalor (1,3 > 1).", "5 fatores, explicando 100% da variância.": "Reter todos não reduz a dimensionalidade; o critério existe para filtrar."}}, {"id": "E07", "a": "A1", "tp": "Análise Fatorial por Componentes Principais", "src": "original", "s": "O teste de esfericidade de Bartlett tem como hipótese nula que a matriz de correlações é igual à matriz identidade. Um p-valor menor que 0,05 indica que:", "c": "Rejeita-se H0: há correlações suficientes entre as variáveis, e a análise fatorial é adequada.", "d": ["Não se rejeita H0: as variáveis são independentes e a fatorial é adequada.", "As variáveis devem ser todas excluídas da análise.", "O número de fatores deve ser igual ao número de variáveis."], "e": "Matriz identidade significa correlações nulas; rejeitar essa hipótese mostra que existe correlação a ser resumida em fatores.", "dx": {"Não se rejeita H0: as variáveis são independentes e a fatorial é adequada.": "Não rejeitar H0 indicaria que não há correlação e a fatorial seria inadequada.", "As variáveis devem ser todas excluídas da análise.": "O teste avalia a adequação global; não manda excluir variáveis.", "O número de fatores deve ser igual ao número de variáveis.": "O número de fatores é decidido por Kaiser/scree plot, não por este teste."}}, {"id": "E08", "a": "A1", "tp": "Análise de Correspondência (simples e múltipla)", "src": "original", "s": "Em uma análise de correspondência simples (ANACOR) com uma variável de 5 categorias e outra de 4 categorias, o número máximo de dimensões é:", "c": "3, pois é o mínimo entre (5 − 1) e (4 − 1).", "d": ["4, pois é o mínimo entre 5 e 4.", "9, pois é a soma das categorias menos 1 variável.", "7, pois é a soma das categorias menos 2."], "e": "Na ANACOR, o máximo de dimensões é mín(I − 1, J − 1) = mín(4, 3) = 3.", "dx": {"4, pois é o mínimo entre 5 e 4.": "Faltou subtrair 1 das categorias antes de tomar o mínimo.", "9, pois é a soma das categorias menos 1 variável.": "Essa conta (soma das categorias menos o número de variáveis) é a da ACM, não da ANACOR.", "7, pois é a soma das categorias menos 2.": "Subtrair 2 da soma não é regra de nenhuma das duas técnicas."}}, {"id": "E09", "a": "A1", "tp": "Análise de Correspondência (simples e múltipla)", "src": "original", "s": "Na análise dos resíduos padronizados ajustados de uma tabela de contingência, um valor de 2,8 em uma célula indica que:", "c": "Há associação estatisticamente significante entre as duas categorias, com frequência observada maior que a esperada.", "d": ["Não há associação, pois o valor está acima de 1,96.", "A frequência observada é menor que a esperada.", "A célula deve ser excluída da tabela."], "e": "Resíduo padronizado ajustado > 1,96 (a 95%) indica associação significante; positivo significa mais casos que o esperado sob independência.", "dx": {"Não há associação, pois o valor está acima de 1,96.": "Acima de 1,96 é justamente o critério para associação significante.", "A frequência observada é menor que a esperada.": "Valor positivo indica observado maior que o esperado; o menor teria sinal negativo.", "A célula deve ser excluída da tabela.": "Células com resíduo alto são as mais informativas; não se excluem."}}, {"id": "E10", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "Em uma regressão linear simples estimada por OLS, o parâmetro beta (inclinação) representa:", "c": "A variação esperada em Y para cada aumento de uma unidade em X.", "d": ["O valor esperado de Y quando X é igual à média.", "A proporção da variância de Y explicada por X.", "O erro padrão dos resíduos."], "e": "Em Y = α + βX, β é o efeito marginal de X; α é o valor de Y quando X = 0.", "dx": {"O valor esperado de Y quando X é igual à média.": "Quando X = média, o valor esperado é α + β·média, não β.", "A proporção da variância de Y explicada por X.": "A proporção de variância explicada é o R².", "O erro padrão dos resíduos.": "O erro padrão dos resíduos mede a dispersão em torno da reta."}}, {"id": "E11", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "Em um modelo Y = 10 + 2·X1 − 3·X2, qual é o valor previsto de Y para X1 = 4 e X2 = 1?", "c": "15", "d": ["9", "21", "18"], "e": "Y = 10 + 2·4 − 3·1 = 10 + 8 − 3 = 15.", "dx": {"9": "9 vem de 10 + 2 − 3 usando X1 = 1.", "21": "21 esquece de subtrair o termo de X2 (10 + 8 + 3).", "18": "18 usa 10 + 8 sem o termo de X2."}}, {"id": "E12", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "O R² ajustado, diferentemente do R², serve para:", "c": "Comparar modelos com números diferentes de variáveis, penalizando a inclusão de preditoras que pouco contribuem.", "d": ["Testar a normalidade dos resíduos.", "Aumentar sempre que uma variável é adicionada ao modelo.", "Medir a multicolinearidade entre as variáveis."], "e": "O R² nunca diminui ao acrescentar variáveis; o ajustado desconta o número de parâmetros e pode cair.", "dx": {"Testar a normalidade dos resíduos.": "A normalidade é testada por Shapiro-Francia.", "Aumentar sempre que uma variável é adicionada ao modelo.": "Quem sempre aumenta é o R² simples, não o ajustado.", "Medir a multicolinearidade entre as variáveis.": "A multicolinearidade é medida por VIF e tolerance."}}, {"id": "E13", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "Em uma regressão múltipla, o teste t de uma variável com p-valor = 0,32 (α = 5%) indica que:", "c": "A variável não é estatisticamente significante para explicar Y na presença das demais.", "d": ["A variável é significante, pois 0,32 é maior que 0,05.", "O modelo inteiro é inadequado.", "A variável tem multicolinearidade perfeita."], "e": "H0 do teste t: o parâmetro é zero. Com p > α não se rejeita H0, então a variável não contribui de forma significante.", "dx": {"A variável é significante, pois 0,32 é maior que 0,05.": "É o contrário: p > α significa NÃO significante.", "O modelo inteiro é inadequado.": "A significância individual não invalida o modelo; isso é avaliado pelo teste F.", "A variável tem multicolinearidade perfeita.": "Multicolinearidade é diagnosticada por VIF, não pelo p-valor."}}, {"id": "E14", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "A heterocedasticidade viola qual pressuposto do modelo OLS?", "c": "A variância constante dos termos de erro (homocedasticidade).", "d": ["A normalidade das variáveis explicativas.", "A ausência de variáveis dummy.", "A necessidade de que Y seja categórica."], "e": "Heterocedasticidade é variância dos erros que muda com X; costuma ocorrer por variáveis omitidas ou forma funcional errada.", "dx": {"A normalidade das variáveis explicativas.": "O pressuposto de normalidade é sobre os termos de erro, não sobre as explicativas.", "A ausência de variáveis dummy.": "Dummies são permitidas e comuns.", "A necessidade de que Y seja categórica.": "No OLS, Y é quantitativa."}}, {"id": "E15", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "Uma tolerance de 0,05 para uma variável explicativa indica:", "c": "Multicolinearidade elevada, pois o VIF correspondente é 20.", "d": ["Ausência de multicolinearidade.", "Multicolinearidade moderada, pois o VIF é 0,05.", "Que a variável deve ser transformada por Box-Cox."], "e": "VIF = 1/Tolerance = 1/0,05 = 20. VIF acima de 10 (tolerance < 0,10) sugere multicolinearidade elevada.", "dx": {"Ausência de multicolinearidade.": "Tolerance baixa significa MAIS colinearidade, não menos.", "Multicolinearidade moderada, pois o VIF é 0,05.": "O VIF é o inverso da tolerance (20), não igual a ela.", "Que a variável deve ser transformada por Box-Cox.": "Box-Cox trata a distribuição de Y, não a multicolinearidade."}}, {"id": "E16", "a": "A2", "tp": "Regressão simples e múltipla (OLS)", "src": "original", "s": "Na previsão de salário com a dummy 'mulher' (1 = mulher, 0 = homem) em Salário = 3000 + 500·Experiência − 400·Mulher, o salário previsto de uma mulher com 2 anos de experiência é:", "c": "3600", "d": ["4000", "3200", "2600"], "e": "3000 + 500·2 − 400·1 = 3000 + 1000 − 400 = 3600.", "dx": {"4000": "4000 ignora o termo da dummy.", "3200": "3200 omite a experiência e aplica só a dummy sobre o intercepto.", "2600": "2600 desconta a dummy sem somar a experiência de forma correta."}}, {"id": "E17", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Em uma regressão logística binária, o coeficiente estimado de X é β = −0,7. Isso significa que:", "c": "Cada aumento de uma unidade em X reduz a chance (odds) do evento, multiplicando-a por e^−0,7 ≈ 0,50.", "d": ["Cada aumento de X reduz a probabilidade em 70 pontos percentuais.", "X não afeta a probabilidade do evento.", "A chance do evento é negativa."], "e": "O sinal do beta dá a direção; e^β dá a razão de chances. e^−0,7 ≈ 0,50: a chance cai pela metade.", "dx": {"Cada aumento de X reduz a probabilidade em 70 pontos percentuais.": "β não é variação linear de probabilidade; atua sobre o logito.", "X não afeta a probabilidade do evento.": "Um β diferente de zero (se significante) indica efeito.", "A chance do evento é negativa.": "Chance (odds) é sempre positiva; o logito é que pode ser negativo."}}, {"id": "E18", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Em um modelo logístico binário, a sensibilidade é:", "c": "A proporção de eventos reais (positivos) que o modelo classificou corretamente como evento.", "d": ["A proporção de não eventos classificados corretamente.", "A proporção total de acertos do modelo.", "A proporção de previsões de evento que realmente eram evento."], "e": "Sensibilidade = VP/(VP + FN). Especificidade = VN/(VN + FP). Acurácia = (VP + VN)/total.", "dx": {"A proporção de não eventos classificados corretamente.": "Essa é a especificidade.", "A proporção total de acertos do modelo.": "Essa é a acurácia.", "A proporção de previsões de evento que realmente eram evento.": "Essa é a precisão (valor preditivo positivo)."}}, {"id": "E19", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Uma matriz de confusão apresenta VP = 40, FN = 10, VN = 35 e FP = 15. A sensibilidade e a especificidade são, respectivamente:", "c": "0,80 e 0,70", "d": ["0,70 e 0,80", "0,75 e 0,75", "0,73 e 0,78"], "e": "Sensibilidade = 40/(40 + 10) = 0,80. Especificidade = 35/(35 + 15) = 0,70.", "dx": {"0,70 e 0,80": "Inverte as duas métricas.", "0,75 e 0,75": "0,75 é a acurácia (75/100), não as duas medidas.", "0,73 e 0,78": "Esses valores não resultam das contas com os números dados."}}, {"id": "E20", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Em um modelo de regressão Poisson, a hipótese central sobre a variável dependente é:", "c": "Que a média e a variância são iguais (equidispersão).", "d": ["Que a variância é sempre muito maior que a média.", "Que a variável só assume 0 ou 1.", "Que a variável é contínua e normal."], "e": "Quando a variância é muito maior que a média (superdispersão), usa-se o binomial negativo.", "dx": {"Que a variância é sempre muito maior que a média.": "Variância muito maior caracteriza superdispersão, o caso do binomial negativo.", "Que a variável só assume 0 ou 1.": "Variável 0/1 é caso da logística binária.", "Que a variável é contínua e normal.": "Contagem é discreta e não negativa, não contínua normal."}}, {"id": "E21", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Um modelo de contagem tem ln(λ) = 1 + 0,5·X. Para X = 2, o número esperado de ocorrências é aproximadamente:", "c": "7,39", "d": ["2,00", "3,00", "1,65"], "e": "ln(λ) = 1 + 0,5·2 = 2, então λ = e² ≈ 7,39.", "dx": {"2,00": "2,00 é o valor do logaritmo, sem a exponencial.", "3,00": "3,00 soma 1 + 2 sem usar o coeficiente de X.", "1,65": "1,65 é e^0,5, sem o restante do preditor."}}, {"id": "E22", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Em modelos multinível, o modelo nulo (sem variáveis explicativas) é estimado para:", "c": "Decompor a variância em níveis e calcular a correlação intraclasse (ICC), verificando se vale a pena modelar a estrutura hierárquica.", "d": ["Prever a variável dependente com a máxima acurácia.", "Substituir o teste de normalidade dos resíduos.", "Eliminar os efeitos aleatórios do modelo."], "e": "O modelo nulo separa a variância entre grupos da variância dentro dos grupos; se o ICC for relevante, o multinível se justifica.", "dx": {"Prever a variável dependente com a máxima acurácia.": "O modelo nulo não tem preditores; o foco é decompor a variância.", "Substituir o teste de normalidade dos resíduos.": "Não substitui o teste de normalidade.", "Eliminar os efeitos aleatórios do modelo.": "Ele justamente avalia a variância dos efeitos aleatórios."}}, {"id": "E23", "a": "A3", "tp": "Logística, contagem e multinível", "src": "original", "s": "Os efeitos fixos e os efeitos aleatórios em um modelo multinível diferem porque:", "c": "Os fixos são parâmetros comuns a todos os grupos; os aleatórios capturam como o intercepto ou a inclinação variam de um grupo para outro.", "d": ["Os fixos variam por grupo e os aleatórios são constantes.", "Os aleatórios só existem em modelos de contagem.", "Os fixos são estimados sem máxima verossimilhança."], "e": "Previsão = parte fixa (comum) + parte aleatória (desvio do grupo).", "dx": {"Os fixos variam por grupo e os aleatórios são constantes.": "Está invertido.", "Os aleatórios só existem em modelos de contagem.": "Efeitos aleatórios aparecem em modelos lineares, logísticos e de contagem.", "Os fixos são estimados sem máxima verossimilhança.": "Ambos são estimados por máxima verossimilhança (ML/REML)."}}, {"id": "XDL100", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em redes neurais, a função de perda (loss), também chamada de função objetivo, serve para:", "c": "Medir o erro entre a predição da rede e o valor real, orientando a atualização dos pesos para reduzi-lo.", "d": ["Escolher quantas camadas ocultas a rede terá.", "Normalizar as variáveis de entrada antes do treino.", "Definir a quantidade de épocas do treinamento."], "e": "Aula 22/09: a loss é calculada comparando predição e rótulo e o gradiente indica como alterar os pesos. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL101", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "No treinamento com mini-batch SGD, a cada passo de otimização:", "c": "Toma-se um conjunto de N amostras aleatórias do treino, faz-se a inferência, calcula-se a média da loss e otimiza-se em relação àquele batch.", "d": ["Usa-se todo o conjunto de dados de uma vez para calcular o gradiente.", "Usa-se apenas uma amostra do conjunto de teste.", "Descartam-se os pesos antigos e reinicia-se a rede."], "e": "Aula 22/09: 'um batch são N amostras aleatórias do dado de treinamento; calculo a loss, a média da loss e otimizo em relação àquele batch'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL102", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Segundo a aula, se o batch size for aumentado por um fator K, é possível:", "c": "Aumentar o learning rate pelo mesmo fator K.", "d": ["Reduzir o learning rate pelo fator K.", "Eliminar a necessidade de normalizar os dados.", "Dispensar o conjunto de validação."], "e": "Aula 22/09: batch maior permite aumentar o learning rate pelo mesmo fator; a 'temperatura de treinamento' é o learning rate dividido pelo batch size. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL103", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "A 'temperatura de treinamento', citada na aula, é definida como:", "c": "O learning rate dividido pelo batch size.", "d": ["O learning rate multiplicado pelo número de épocas.", "O número de camadas dividido pelo número de neurônios.", "A razão entre a loss de treino e a de validação."], "e": "Aula 22/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL104", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Durante o treino, a loss de treino só melhora, enquanto a de validação melhora até certo ponto e depois começa a piorar. O procedimento adequado é:", "c": "Esperar algumas épocas de 'paciência', interromper o treinamento (early stopping) e restaurar o modelo da melhor época de validação.", "d": ["Aumentar o número de épocas até a loss de validação cair novamente.", "Descartar o conjunto de validação.", "Reduzir o conjunto de treino pela metade."], "e": "Aula 22/09: usa-se early stopping com paciência e restauração do melhor modelo de validação. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL105", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em redes profundas, a ReLU é preferida à sigmoide nas camadas ocultas porque:", "c": "A probabilidade de o gradiente desaparecer é menor com a ReLU do que com a sigmoide.", "d": ["A sigmoide é mais barata computacionalmente.", "A ReLU sempre produz saídas entre 0 e 1.", "A sigmoide não é diferenciável."], "e": "Aula 22/09: 'quando a rede fica profunda, a probabilidade do gradiente desaparecer com ReLU é menor do que com a sigmoide'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL106", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Otimizadores como SGD com momentum e Adam, em comparação ao SGD puro:", "c": "Ganham velocidade (inércia) na descida, ajudando a sair de mínimos locais rasos, e o Adam, por ser adaptativo, tolera escolhas imperfeitas de learning rate e batch size.", "d": ["Dispensam totalmente a escolha do learning rate.", "Garantem sempre o mínimo global.", "Funcionam apenas para redes com uma única camada."], "e": "Aula 22/09: otimizadores 'pegam velocidade' e o adaptativo 'consegue se adaptar até um certo nível'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL107", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em uma rede com 64 neurônios, aplicar dropout de 20% significa que, a cada inferência de treino:", "c": "Cerca de 13 neurônios (20% de 64) têm suas saídas desligadas aleatoriamente, o que regulariza e controla o overfitting.", "d": ["Todos os neurônios são desligados em 20% das épocas.", "20% dos dados de treino são removidos definitivamente.", "O learning rate é reduzido em 20%."], "e": "Aula 22/09: 'dropout é uma técnica de regularização... apaga 20% dessas saídas, ou seja, ~13 neurônios'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL108", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em um modelo com duas saídas, uma de regressão (MSE) e outra de classificação (entropia cruzada), por que é preciso balancear as perdas?", "c": "Porque as perdas têm escalas naturais diferentes, e escalas desbalanceadas geram diferença de gradiente, prejudicando o treino.", "d": ["Porque a entropia cruzada só funciona com regressão.", "Porque o MSE não pode ser usado em redes neurais.", "Porque só uma das saídas pode ser otimizada por vez."], "e": "Aula 22/09: 'rede neural não gosta de escalas diferentes, porque vai dar diferença de gradiente; então a gente tem que balancear as perdas'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL109", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "No dataset Abalone, a variável categórica nominal 'sexo' deve ser tratada, para a rede neural, por meio de:", "c": "Um encoding categórico adequado, como one-hot, e não como um número ordinal arbitrário.", "d": ["Um valor numérico crescente (1, 2, 3), pois a rede aprende a ordem sozinha.", "Remoção da variável, pois redes neurais não aceitam categorias.", "Padronização por Z-score da própria coluna de texto."], "e": "Aula 22/09: encodings categóricos (one-hot, ordinal, embedding); ordinal só se houver ordem genuína. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL110", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "A função softmax, aplicada à saída de uma rede de classificação multiclasse:", "c": "Redistribui os valores (logits) em probabilidades que somam 1, funcionando como uma normalização.", "d": ["Zera todos os valores negativos.", "Escolhe diretamente a classe vencedora, sem calcular probabilidades.", "Multiplica os logits pelo learning rate."], "e": "Aula 22/09: 'quando eu jogo na softmax, ela redistribui esses números e faz uma espécie de normalização'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL200", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Quando o dado possui estrutura espacial (tensores de rank 2, 3 ou mais), as redes densas (MLP) tornam-se ineficientes porque:", "c": "Precisam achatar o dado e perdem a relação de vizinhança entre as posições.", "d": ["Não aceitam números reais como entrada.", "Têm menos neurônios que as CNNs.", "Só funcionam com dados de texto."], "e": "Aula 29/09: 'quando o dado entra no espaço bidimensional, rank 2, 3, 4…, as MLPs se tornam ineficientes'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL201", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em uma operação de convolução, o kernel:", "c": "Costuma ser menor que a imagem e desliza sobre ela; em cada posição, multiplicam-se os valores correspondentes e somam-se os produtos.", "d": ["É sempre do mesmo tamanho da imagem.", "É fixo e definido manualmente, sem aprendizado.", "Soma os valores da imagem sem multiplicar."], "e": "Aula 29/09: 'você vai multiplicar todo mundo pelo seu respectivo endereço, no kernel e na imagem, e depois você soma'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL202", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Uma imagem em tons de cinza, ao ser processada por uma CNN, é representada com:", "c": "Um canal de feature, ou seja, formato (H, W, 1).", "d": ["Três canais (R, G e B).", "Nenhuma dimensão de canal, pois é bidimensional demais.", "Quatro canais, incluindo transparência."], "e": "Aula 29/09: 'quando uma imagem só tem um canal de cor, a gente tem que representar com um canal de feature'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL203", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Uma entrada 4×4 é convoluída com um kernel 3×3, sem padding. O tamanho da saída é:", "c": "2×2", "d": ["4×4", "3×3", "1×1"], "e": "Aula 29/09: 'quando a gente convoluiu um input 4x4 e um kernel 3x3, a saída diminuiu o tamanho'. Saída = 4 − 3 + 1. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL204", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Uma imagem 5×5×1 é convoluída com kernel 3×3 e padding 'valid'. A saída tem formato:", "c": "3×3", "d": ["5×5", "4×4", "2×2"], "e": "Aula 29/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL205", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Qual é a consequência de convoluir repetidamente uma imagem sem padding e com kernel 3×3?", "c": "A imagem perde pixels a cada convolução (dois por dimensão) e, com muitas camadas, pode desaparecer; o padding 'same' evita essa perda.", "d": ["A imagem aumenta de tamanho a cada camada.", "A imagem mantém sempre o mesmo tamanho.", "O kernel deixa de ser aprendido."], "e": "Aula 29/09: 'se toda vez que eu convoluir perder dois pixels, ela vai desaparecer'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL206", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em uma convolução com stride 2, uma imagem 8×8 passa a ter, aproximadamente, resolução:", "c": "4×4, isto é, a resolução cai pela metade.", "d": ["16×16", "8×8", "2×2"], "e": "Aula 29/09: 'se essa imagem tivesse oito por oito, ia ficar quatro por quatro, por causa dos strides dois'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL207", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "O max pooling é:", "c": "Uma operação parecida com a convolução, mas que mantém o maior valor de cada janela, reduzindo a resolução do feature map.", "d": ["Uma convolução com kernel aleatório que aumenta a resolução.", "Uma função de ativação que satura em 1.", "Uma etapa que remove canais de cor."], "e": "Aula 29/09: 'existe uma outra operação que não é convolucional, é muito parecida... que é o max pooling'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL208", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em uma imagem RGB, ao convoluir com um kernel 3×3:", "c": "O kernel passa a ter também 3 canais (profundidade igual ao número de canais de entrada).", "d": ["O kernel continua com um único canal.", "A imagem é convertida antes em tons de cinza obrigatoriamente.", "O kernel precisa ser 3×3×6."], "e": "Aula 29/09: 'se a imagem for RGB, ele vai automaticamente criar três canais também'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL209", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "No início do treinamento de uma CNN, os valores do kernel:", "c": "Nascem aleatórios e são ajustados pelo gradiente descendente ao longo do treino.", "d": ["São fixos e iguais aos do filtro de Sobel.", "São definidos pelo usuário e nunca mudam.", "São iguais a zero até a última época."], "e": "Aula 29/09: 'o kernel nasce aleatório... o gradiente descendente vai começar a levar para uma ladeira de convergência'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL210", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Na arquitetura U-Net, usada para segmentação:", "c": "Os feature maps do caminho de descida são copiados para o caminho de subida, o que permite segmentar com precisão.", "d": ["A imagem é convertida em texto antes da segmentação.", "Não há convoluções, apenas camadas densas.", "A rede só classifica a imagem inteira, sem localizar objetos."], "e": "Na U-Net as conexões 'skip' copiam os feature maps do caminho de descida para o de subida, recuperando detalhe espacial e permitindo segmentação precisa.", "dx": {"A imagem é convertida em texto antes da segmentação.": "Não há conversão para texto.", "Não há convoluções, apenas camadas densas.": "É uma rede convolucional.", "A rede só classifica a imagem inteira, sem localizar objetos.": "A segmentação classifica cada pixel, localizando objetos."}}, {"id": "XDL300", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Na camada de vetorização de texto, o parâmetro max_tokens define:", "c": "O tamanho do vocabulário (os tokens mais frequentes mantidos).", "d": ["O comprimento fixo de cada sequência de saída.", "O número de épocas de treinamento.", "A quantidade de camadas do modelo."], "e": "Aula 06/10: 'Max Tokens é o meu vocabulário'; o output_sequence_length corta ou completa as sentenças. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL301", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "O parâmetro output_sequence_length da vetorização de texto:", "c": "Fixa o comprimento das sequências, cortando as sentenças maiores e completando as menores.", "d": ["Define o tamanho do vocabulário.", "Define o número de cabeças de atenção.", "Reduz a dimensão do embedding."], "e": "output_sequence_length fixa o tamanho das sequências de saída: corta as maiores e completa (padding) as menores.", "dx": {"Define o tamanho do vocabulário.": "O tamanho do vocabulário é max_tokens.", "Define o número de cabeças de atenção.": "Número de cabeças é um hiperparâmetro da atenção multi-head.", "Reduz a dimensão do embedding.": "A dimensão do embedding é definida na camada Embedding."}}, {"id": "XDL302", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Uma palavra que não pertence ao vocabulário aprendido é tratada, na vetorização, como:", "c": "Um token especial de palavra desconhecida ([UNK]).", "d": ["Um erro que interrompe o treinamento.", "Um token de padding.", "A palavra mais frequente do vocabulário."], "e": "Aula 06/10: 'se o modelo vê uma palavra que não conhece, simplesmente joga para esse token'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL303", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em relação ao vocabulário construído pela vetorização, é correto afirmar que:", "c": "Os tokens ficam ordenados por frequência decrescente.", "d": ["Os tokens ficam em ordem alfabética obrigatória.", "Apenas palavras raras são mantidas.", "O vocabulário é fixo e independe dos dados."], "e": "Aula 06/10: 'eles estão em ordem decrescente de frequência'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL304", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Sobre o vetor multi-hot de um texto, é correto afirmar que:", "c": "Tem o tamanho do vocabulário e indica a presença dos tokens, sem preservar a ordem.", "d": ["Preserva a ordem exata das palavras.", "Tem uma dimensão por frase do corpus.", "Guarda o significado semântico de cada palavra."], "e": "Aula 06/10. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL305", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Em comparação com o one-hot de sequência, o embedding:", "c": "Reúne ordem, frequência e semântica em um espaço dimensional pequeno.", "d": ["Perde a ordem das palavras.", "Usa um vetor esparso do tamanho do vocabulário.", "Não é treinável."], "e": "Aula 06/10: 'agora vai ter ordem, frequência e semântica em um espaço dimensional pequeno'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL306", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Uma vantagem do Transformer sobre a LSTM é:", "c": "A alta capacidade de paralelização do treino, que as LSTMs não têm.", "d": ["Menor custo de memória em sequências longas.", "Não precisar de embeddings.", "Processar os tokens estritamente em sequência."], "e": "Aula 06/10: 'a parte extremamente auto-paralelizável do Transformer, que LSTMs não têm'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL307", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "O positional encoding foi criado para:", "c": "Recuperar a informação de ordem dos tokens, que o mecanismo de atenção sozinho perde.", "d": ["Reduzir o tamanho do vocabulário.", "Substituir a camada de embedding.", "Normalizar os logits em probabilidades."], "e": "Aula 06/10: 'vamos inventar alguma coisa para recuperar a informação da ordem para que esse transformer valha a pena'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL308", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "No mecanismo de atenção multi-cabeça (multi-head):", "c": "As dimensões do embedding são divididas pelo número de cabeças H, e cada cabeça aprende padrões diferentes.", "d": ["Todas as cabeças aprendem exatamente o mesmo padrão.", "Cada cabeça processa uma palavra diferente do vocabulário.", "As cabeças substituem a camada de saída."], "e": "Aula 06/10: 'dividem as dimensões do embedding por H... cada cabeça aprende coisas diferentes'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XDL309", "a": "A4", "tp": "Redes neurais e deep learning", "src": "reconstruida", "s": "Quando se diz que um modelo de linguagem tem 'janela de contexto de um milhão de tokens', quer-se dizer que:", "c": "Ele consegue receber, de uma vez, até um milhão de tokens como entrada.", "d": ["O vocabulário tem um milhão de palavras diferentes.", "O modelo possui um milhão de parâmetros.", "O treino foi feito com um milhão de épocas."], "e": "Aula 06/10. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV300", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "O XGBoost pode ser descrito, de forma simplificada, como:", "c": "Uma implementação altamente otimizada de gradient boosting usando árvores de decisão.", "d": ["Uma implementação de bagging com amostras bootstrap.", "Uma rede neural convolucional.", "Um algoritmo de clustering hierárquico."], "e": "Aula 08/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV301", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "No boosting, as árvores são construídas:", "c": "De forma sequencial, cada uma tentando corrigir os erros (resíduos) das anteriores.", "d": ["De forma paralela e independente, com votação final.", "Uma única vez, sem correção de erros.", "Apenas com os dados de teste."], "e": "Aula 08/09: 'várias árvores, só que de forma sequencial... o terceiro modelo vai tentar corrigir esses resíduos'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV302", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "Comparando Random Forest e boosting, é correto afirmar que:", "c": "Na Random Forest as árvores são construídas em paralelo e combinadas por votação ou média; no boosting são sequenciais e corrigem os erros anteriores.", "d": ["Ambas constroem as árvores em sequência.", "A Random Forest corrige os erros das árvores anteriores.", "O boosting usa votação simples de árvores independentes."], "e": "Aula 08/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV303", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "No gradient boosting, o learning rate corresponde:", "c": "Ao tamanho do passo, enquanto o gradiente fornece a direção.", "d": ["À direção do passo, enquanto o gradiente dá o tamanho.", "Ao número de árvores da floresta.", "À profundidade máxima de cada árvore."], "e": "Aula 08/09: 'o gradiente vai dar a direção do passo e o tamanho do passo é o learning rate'. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV304", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "O early stopping em modelos de boosting serve para:", "c": "Interromper o treinamento quando adicionar novas árvores deixa de melhorar o resultado na validação.", "d": ["Aumentar o número de árvores até o erro de treino zerar.", "Reduzir o learning rate a zero.", "Remover variáveis irrelevantes."], "e": "Aula 08/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV305", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "Em train_test_split de um problema de classificação, o parâmetro stratify=y:", "c": "Mantém a proporção das classes tanto no treino quanto no teste.", "d": ["Embaralha os dados duas vezes.", "Aumenta a quantidade de dados de treino.", "Remove as classes minoritárias."], "e": "Aula 08/09. (Questão elaborada a partir das legendas das aulas.)"}, {"id": "XARV306", "a": "A4", "tp": "Árvores, ensemble, bagging, RF e boosting", "src": "reconstruida", "s": "Em um problema de classificação binária com o XGBoost, o objetivo (objective) 'binary:logistic':", "c": "Usa uma função logística para transformar a saída br
